 seg:el=>{S.seg=el.dataset.s;render()},
 camp:el=>{const sg=D.segs.find(s=>s.id===el.dataset.s);if(!sg)return;S.appr['camp:'+sg.id]=1;log(`Piloto de 4 semanas programado: ${sg.n}`);render();toast('Piloto programado (simulado).')},
 ev:el=>{S.ev=el.dataset.id;const e=D.ev.find(x=>x.id===S.ev);if(e)S.cam=camOf(e);render()},
 evSet:el=>{const e=D.ev.find(x=>x.id===el.dataset.id);if(!e)return;S.appr['ev:'+e.id]=el.dataset.st;log(`${e.type}${e.plate?' '+e.plate:''}: ${el.dataset.st==='ok'?'atendido':'falsa alarma'}`);render();toast(el.dataset.st==='ok'?'Listo: queda registrado quién lo atendió y cuándo.':'Descartado: las falsas alarmas sirven para ajustar el modelo.')},
 hose:el=>{S.hose=el.dataset.h;render()},
 wo:el=>{const h=el.dataset.h;S.appr['mt:'+h]=1;S.wo.unshift({t:h==='agua'?'Revisar boca de descarga y juntas del tanque T3':h==='3B'?'Cambiar el filtro de la manguera 3B (Diésel)':`Revisar pulsador y válvula de la manguera ${h}`,s:'Nueva',when:addD(TODAY,1)});log(`Orden de trabajo creada: ${S.wo[0].t}`);render();toast('Orden de trabajo creada.')},
 scn:el=>{startChat(el.dataset.s);render();const s=$('say');if(s)s.focus()},
 say:()=>sendSay(),
 mic:()=>listen(),
 endChat:()=>{const c=S.chat;if(!c||c.end||c.busy)return;c.end=true;finishChat(SCN.find(s=>s.id===c.id),c);render()},
 tour:()=>goTour(0),
 tourNext:()=>{if(S.tour==null)return;if(S.tour>=TOUR.length-1){S.tour=null;renderTour();toast('Fin de la presentación.')}else goTour(S.tour+1)},
 tourPrev:()=>{if(S.tour)goTour(S.tour-1)},
 tourEnd:()=>{S.tour=null;renderTour()},
 parte:()=>{S.appr.parte=1;log('Parte diario de prueba enviado por WhatsApp (simulado)');render();toast('Parte enviado (simulado). En producción sale todos los días a la hora que elija el dueño.')},
 fleet:el=>{S.fleet=el.dataset.id;render()},
 fBlock:el=>{const id=el.dataset.id,on=!S.appr['fb:'+id];if(on)S.appr['fb:'+id]=1;else delete S.appr['fb:'+id];log(`Cuenta ${id}: cargas ${on?'bloqueadas':'desbloqueadas'}`);render();toast(on?'Cargas bloqueadas (simulado). En producción, el controlador rechaza los vales de esa cuenta.':'Cuenta desbloqueada.')},
 fSend:el=>{S.appr['fr:'+el.dataset.id]=1;log(`Resumen de cuenta ${el.dataset.id} enviado por WhatsApp (simulado)`);render();toast('Resumen enviado (simulado).')},
 fSus:el=>{const x=D.fleet.sus.find(s=>s.id===el.dataset.id);if(!x)return;S.appr['fs:'+x.id]=el.dataset.st;log(`${x.t} (${x.plate}): ${el.dataset.st==='ask'?'se pidió explicación al cliente':'revisada, está bien'}`);render()},

 cartel:()=>{S.appr.cartel=1;log('Aviso al encargado: corregir el precio del cartel de la ruta');render();toast('Aviso enviado. En la demo, el cartel queda corregido.')},
 cp:el=>{const c=COMPL.find(x=>x.id===el.dataset.id);if(!c)return;S.appr['cp:'+c.id]=1;S.wo.unshift({t:c.t,s:'Nueva',when:addD(TODAY,c.d<0?1:Math.max(1,c.d-5))});log(`Cumplimiento agendado: ${c.t}`);render();toast('Agendado: quedó en las órdenes de trabajo.')},
 askQ:el=>doAsk(ASKQ[+el.dataset.q].q),
 ask:()=>{const i=$('askIn'),q=i&&i.value.trim();if(q)doAsk(q);else toast('Escribí una pregunta o tocá una de las sugeridas.')},
 convTrain:el=>{const x=CONV[+el.dataset.i];if(!x)return;S.appr['cv:'+el.dataset.i]=1;log(`Práctica «Ofrecer la tienda» asignada a ${x.n}`);render();toast(`Práctica asignada a ${x.n}: escenario de la tienda en Capacitación.`)},
 cvRule:el=>{const id=el.dataset.id,r=D.cv.rules.find(x=>x.id===id);if(!r)return;S.cvOff[id]=!S.cvOff[id];log(`Regla «${r.n}»: ${S.cvOff[id]?'pausada':'activada'}`);render()},
 detMode:()=>{S.det=!S.det;render()},

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const f=ACT[el.dataset.act];if(!f)return;if(el.tagName==='A'||el.tagName==='BUTTON')e.preventDefault();f(el,e)});
document.addEventListener('input',e=>{const el=e.target.closest('[data-in]');if(el&&IN[el.dataset.in])IN[el.dataset.in](el,e)});
document.addEventListener('change',e=>{const el=e.target.closest('[data-ch]');if(!el)return;const k=el.dataset.ch;
 if(k==='tts'){S.tts=el.checked;if(!S.tts&&'speechSynthesis' in window)speechSynthesis.cancel()}
 else if(k==='rule')setRule(el);
 else if(k==='auto'){S.autoOrder=el.checked;if(el.checked)log('Pedido automático con aprobación por WhatsApp activado');toast(el.checked?'Pedido automático activado (simulado): vas a recibir el pedido armado para aprobar.':'Pedido automático desactivado.')}});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&!$('drawer').hidden){closeDrawer();return}
 const t=e.target;if(!t||!t.matches)return;
 if(t.id==='say'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendSay();return}
 if(t.id==='askIn'&&e.key==='Enter'){e.preventDefault();ACT.ask();return}
 if((e.key==='Enter'||e.key===' ')&&t.matches('[data-act][role="button"],tr[data-act]')){e.preventDefault();t.click()}});
document.addEventListener('dragover',e=>{if(e.dataTransfer&&Array.from(e.dataTransfer.types||[]).includes('Files')){e.preventDefault();const d=$('drop');if(d)d.classList.toggle('on',!!e.target.closest&&!!e.target.closest('#drop'))}});
document.addEventListener('dragleave',e=>{if(!e.relatedTarget){const d=$('drop');if(d)d.classList.remove('on')}});
document.addEventListener('drop',e=>{if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length){e.preventDefault();const d=$('drop');if(d)d.classList.remove('on');if(e.target.closest&&e.target.closest('#drop'))runSample(e.dataTransfer.files[0].name)}});
