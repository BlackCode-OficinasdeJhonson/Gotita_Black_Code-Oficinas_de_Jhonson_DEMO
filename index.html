<html lang="es">
<head>

<style>
/* GOTA — demo de Black Code para estaciones de servicio.
   Identidad propia inspirada en el lenguaje visual de las estaciones de servicio: amarillo de marquesina con franja roja,
   tipografía geométrica, botones redondeados y tarjetas con degradé cálido. Sin logos ni nombres de terceros.
   Archivo único, sin dependencias: funciona sin internet (la tipografía cae a la del sistema). */
:root{
  --bg:#F5F5F2; --surface:#FFFFFF; --surface-2:#FAFAF8; --sunken:#EFEEEA; --line:#E6E4DE; --line-strong:#CFCCC4;
  --fg:#1E1E1E; --muted:#5C5C5A; --faint:#8C8C88;
  --accent:#FFC72C; --accent-ink:#8A5D00; --accent-soft:#FFF3CC; --on-accent:#1E1E1E;
  --red:#E3261B; --red-ink:#B71C13; --on-red:#FFFFFF;
  --side:#FFFFFF; --side-fg:#2A2A2A; --side-muted:#7A7A76; --side-hover:#FFF6D6; --side-active:#FFC72C; --side-line:#ECEAE4;
  --ok:#22703F; --ok-soft:#DCEFE3; --warn:#8A5A0A; --warn-soft:#FAEDD0; --bad:#C62A20; --bad-soft:#F9DCD8; --info:#2462A6; --info-soft:#DCE7F5;
  --l-green-bg:#D5EEDD; --l-green-fg:#1B6A3E; --l-yellow-bg:#FFF0B8; --l-yellow-fg:#735600;
  --l-orange-bg:#FDE0C8; --l-orange-fg:#94470B; --l-red-bg:#F9D7D2; --l-red-fg:#A2271A;
  --l-purple-bg:#E8DCF5; --l-purple-fg:#693E9E; --l-blue-bg:#D7E5F7; --l-blue-fg:#1F569E;
  --l-gray-bg:#ECEBE6; --l-gray-fg:#55534C;
  --c1:#2563A8; --c2:#E5600F; --c3:#3F3F3F; --c4:#1F8A4C;
  --wa-chat:#EFEAE2; --wa-in:#FFFFFF; --wa-fg:#111B21;
  --grad:linear-gradient(120deg,#E3261B 0%,#F06A1C 55%,#FFB21A 100%);
  --shadow:0 1px 2px rgba(20,20,20,.06),0 0 0 1px rgba(20,20,20,.04);
  --shadow-lg:0 24px 60px rgba(20,20,20,.22);
  --scrim:rgba(20,20,20,.38);
  --f-body:'Jost',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-display:'Jost',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'Jost',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --band:#EFEEEA;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111111; --surface:#1A1A1A; --surface-2:#202020; --sunken:#0B0B0B; --line:#2C2C2C; --line-strong:#3D3D3D;
  --fg:#F2F2F0; --muted:#A8A8A3; --faint:#707070;
  --accent-ink:#FFD45C; --accent-soft:#3A2E0A; --red:#D9281D; --red-ink:#FF7A70; --band:#262626;
  --side:#151515; --side-fg:#E8E8E4; --side-muted:#8E8E89; --side-hover:#241F10; --side-line:#262626;
  --ok:#55C58E; --ok-soft:#17301F; --warn:#E3A640; --warn-soft:#352810; --bad:#F07568; --bad-soft:#3A1917; --info:#71A9EA; --info-soft:#16263A;
  --l-green-bg:#173A26; --l-green-fg:#84DBA8; --l-yellow-bg:#383012; --l-yellow-fg:#EBCB63;
  --l-orange-bg:#40250F; --l-orange-fg:#F3A86A; --l-red-bg:#41191A; --l-red-fg:#F3958B;
  --l-purple-bg:#2D2140; --l-purple-fg:#C8A9EF; --l-blue-bg:#172A45; --l-blue-fg:#90BAF1;
  --l-gray-bg:#262626; --l-gray-fg:#B8B8B2;
  --c1:#6EA8EC; --c2:#FF8A3D; --c3:#C9C9C9; --c4:#5FD08E;
  --wa-chat:#0B141A; --wa-in:#202C33; --wa-fg:#E9EDEF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.03);
  --shadow-lg:0 24px 60px rgba(0,0,0,.55); --scrim:rgba(0,0,0,.55);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111111; --surface:#1A1A1A; --surface-2:#202020; --sunken:#0B0B0B; --line:#2C2C2C; --line-strong:#3D3D3D;
  --fg:#F2F2F0; --muted:#A8A8A3; --faint:#707070;
  --accent-ink:#FFD45C; --accent-soft:#3A2E0A; --red:#D9281D; --red-ink:#FF7A70; --band:#262626;
  --side:#151515; --side-fg:#E8E8E4; --side-muted:#8E8E89; --side-hover:#241F10; --side-line:#262626;
  --ok:#55C58E; --ok-soft:#17301F; --warn:#E3A640; --warn-soft:#352810; --bad:#F07568; --bad-soft:#3A1917; --info:#71A9EA; --info-soft:#16263A;
  --l-green-bg:#173A26; --l-green-fg:#84DBA8; --l-yellow-bg:#383012; --l-yellow-fg:#EBCB63;
  --l-orange-bg:#40250F; --l-orange-fg:#F3A86A; --l-red-bg:#41191A; --l-red-fg:#F3958B;
  --l-purple-bg:#2D2140; --l-purple-fg:#C8A9EF; --l-blue-bg:#172A45; --l-blue-fg:#90BAF1;
  --l-gray-bg:#262626; --l-gray-fg:#B8B8B2;
  --c1:#6EA8EC; --c2:#FF8A3D; --c3:#C9C9C9; --c4:#5FD08E;
  --wa-chat:#0B141A; --wa-in:#202C33; --wa-fg:#E9EDEF;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.03);
  --shadow-lg:0 24px 60px rgba(0,0,0,.55); --scrim:rgba(0,0,0,.55);
  color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--red-ink)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
svg.i{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mono,.num{font-variant-numeric:tabular-nums}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}

/* ---------- shell: marquesina amarilla con franja roja ---------- */
.app{display:grid;grid-template-columns:240px minmax(0,1fr);height:100%}
.side{background:var(--side);color:var(--side-fg);display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--side-line)}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.brand .mark{width:36px;height:36px;flex:none;display:grid;place-items:center}
.brand .mark svg{width:36px;height:36px}
.brand b{font:800 24px/1 var(--f-display);color:var(--fg);letter-spacing:.08em}
.brand small{display:block;font:500 10.5px/1.2 var(--f-body);color:var(--side-muted);letter-spacing:.1em;text-transform:uppercase;margin-top:4px}
.nav{display:flex;flex-direction:column;gap:3px;padding:6px 12px;overflow:auto;flex:1;min-height:0}
.nav .sec{font:600 10.5px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--side-muted);padding:14px 10px 6px}
.nav button{all:unset;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:99px;color:var(--side-fg);cursor:pointer;font-size:14.5px;font-weight:500}
.nav button:hover{background:var(--side-hover)}
.nav button.on{background:var(--side-active);color:#1E1E1E;font-weight:600}
.nav button.on svg{color:var(--red)}
.nav button:focus-visible{outline:2px solid var(--red)}
.nav .badge{margin-left:auto;font:600 11px/1 var(--f-body);background:var(--red);color:#fff;border-radius:99px;padding:3px 7px}
.nav .badge.soft{background:var(--sunken);color:var(--side-fg)}
.nav button.on .badge.soft{background:rgba(255,255,255,.7);color:#1E1E1E}
.side-foot{border-top:1px solid var(--side-line);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.proto{font-size:11.5px;color:var(--side-muted);line-height:1.4}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:14px 24px;background:var(--accent);color:#1E1E1E;border-bottom:6px solid var(--red);flex-wrap:wrap}
.top .ttl{min-width:0;flex:1 1 220px}
.top .eyebrow{font:600 11px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:rgba(30,30,30,.65);margin-bottom:5px}
.top h1{font:700 21px/1.2 var(--f-display);letter-spacing:-.005em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.top .btn{background:rgba(255,255,255,.9);border-color:transparent;color:#1E1E1E}
.top .btn:hover{background:#fff}
.top .btn.pri{background:var(--red);color:#fff}
.view{flex:1;overflow:auto;padding:22px 24px 40px;min-height:0}
.view:focus{outline:none}
.grid-cam{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
@media (max-width:1100px){.grid-cam{grid-template-columns:minmax(0,1fr)}}
.demo-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 24px;background:#1E1E1E;color:#F2F2F0;font-size:13px}
.demo-bar b{font:700 10.5px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;background:var(--accent);color:#1E1E1E;padding:4px 8px;border-radius:99px}
.demo-bar span{flex:1;min-width:0}
.demo-bar button{border:1px solid #F2F2F0;background:transparent;color:#F2F2F0;border-radius:99px;padding:3px 12px;font-weight:600;font-size:12px}
.hero{background:var(--grad);color:#fff;border-radius:22px;padding:22px 26px;box-shadow:var(--shadow)}
.hero p{color:rgba(255,255,255,.9)!important}
.hero .btn{background:#fff;border-color:#fff;color:#1E1E1E}
.tour{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100% - 32px));background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);z-index:49;overflow:clip;border:1px solid var(--line)}
body:has(#tour:not([hidden])) .view{padding-bottom:300px} /* con el panel abierto, el final de la vista queda por encima */
.tour .th{background:var(--accent);color:#1E1E1E;padding:10px 16px;border-bottom:4px solid var(--red);display:flex;align-items:center;gap:8px;font-weight:700}
.tour .tb{padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.tour .tb b{font-size:16px}
.tour .tf{display:flex;gap:8px;align-items:center;padding:0 16px 14px}
.tour .dots{display:flex;gap:4px;flex:1}
.tour .dots i{width:7px;height:7px;border-radius:50%;background:var(--line-strong)}
.tour .dots i.on{background:var(--red)}
@media (max-width:520px){.tour{left:8px;right:8px;width:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px))}.tour .dots{display:none}.tour .tb{padding:10px 14px;font-size:13px}.tour .tb b{font-size:15px}.tour .tf{justify-content:flex-end}}

/* ---------- controles ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:600;font-size:13.5px;white-space:nowrap;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--line-strong);background:var(--surface-2)}
.btn.pri{background:var(--red);border-color:var(--red);color:var(--on-red)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunken)}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:99px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;background:var(--sunken);border-radius:99px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:99px;display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);font-weight:500}
.seg button.on{background:var(--accent);color:#1E1E1E;box-shadow:var(--shadow)}
.seg .cnt{font:500 10.5px/1 var(--f-mono);background:var(--bad-soft);color:var(--bad);border-radius:99px;padding:2px 6px}
.inp,.sel,.ta{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;min-width:0}
.inp:hover,.sel:hover,.ta:hover{border-color:var(--line-strong)}
.inp[aria-invalid="true"]{border-color:var(--bad);background:var(--bad-soft)}
.ta{resize:vertical;min-height:44px;line-height:1.5}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#1E1E1E}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent)}

/* ---------- chips y estados ---------- */
.lbl{display:inline-flex;align-items:center;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:5px;line-height:1.35;white-space:nowrap}
.c-green{background:var(--l-green-bg);color:var(--l-green-fg)} .c-yellow{background:var(--l-yellow-bg);color:var(--l-yellow-fg)}
.c-orange{background:var(--l-orange-bg);color:var(--l-orange-fg)} .c-red{background:var(--l-red-bg);color:var(--l-red-fg)}
.c-purple{background:var(--l-purple-bg);color:var(--l-purple-fg)} .c-blue{background:var(--l-blue-bg);color:var(--l-blue-fg)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)}
.p-mute{background:var(--l-gray-bg);color:var(--l-gray-fg)} .p-acc{background:var(--accent-soft);color:var(--accent-ink)}
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);color:var(--fg);border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:16px}
.banner svg{color:var(--accent-ink);margin-top:2px}
.banner.ok{background:var(--ok-soft)} .banner.ok svg{color:var(--ok)}
.conf{font:500 11px/1 var(--f-mono);color:var(--muted)}
.okc{color:var(--ok)} .badc{color:var(--bad)} .warnc{color:var(--warn)}
.muted{color:var(--muted)} .small{font-size:12.5px}
.src{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--muted);border:1px dashed var(--line-strong);border-radius:99px;padding:3px 10px;white-space:nowrap}
.note{font-size:12.5px;color:var(--muted);margin:14px 2px 0;line-height:1.5}

/* ---------- tablas ---------- */
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.tbl-wrap.flat{border:0;border-radius:0 0 12px 12px}
table.tbl{width:100%;border-collapse:collapse;min-width:640px}
table.tbl.fit{min-width:0}
.tbl th{font:500 10.5px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.tbl td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl td.r,.tbl th.r{text-align:right}
.tbl td.num{white-space:nowrap}
.tbl .sub{font-size:12px;color:var(--muted)}
.tbl input.inp{padding:5px 8px;text-align:right;font-family:var(--f-mono)}

/* ---------- paneles y tarjetas ---------- */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;min-width:0}
.stat span{font:500 10.5px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stat b{display:block;font:700 24px/1.15 var(--f-mono);margin:8px 0 4px;letter-spacing:-.02em;overflow-wrap:anywhere}
.stat small{color:var(--muted);font-size:12px}
.stat.bad b{color:var(--bad)} .stat.ok b{color:var(--ok)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid-fit{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,600px),1fr));gap:16px} /* dos columnas solo si cada una tiene 600 px */
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.mt{margin-top:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;min-width:0}
.panel-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-h h2{font-size:14px;font-weight:600;flex:1 1 12em;min-width:0}
.panel-h .n{font:500 11px/1 var(--f-mono);color:var(--muted)}
.panel-h .grow,.grow{flex:1}
.pad{padding:14px 16px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.item{display:flex;gap:10px;align-items:flex-start;padding:10px 16px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item[data-act]{cursor:pointer}
.item[data-act]:hover{background:var(--surface-2)}
.item.sel{background:var(--accent-soft)}
.item>svg{margin-top:2px;color:var(--muted)}
.item .body{min-width:0;flex:1}
.item .body b{font-weight:500;display:block}
.item .body small{color:var(--muted);font-size:12.5px;display:block;margin-top:2px}
.item .side-r{display:flex;flex-direction:column;align-items:flex-end;gap:5px;text-align:right}
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.hello h2{font:700 30px/1.1 var(--f-display);letter-spacing:-.01em}
.hello p{margin:4px 0 0;color:var(--muted)}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;min-width:0}
.pcard:hover{border-color:var(--line-strong)}
.pcard.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.pcard h3{font-size:14.5px;font-weight:600;line-height:1.3}
.pcard .cl{font-size:12.5px;color:var(--muted)}
.pcard .big{font:700 26px/1 var(--f-mono);letter-spacing:-.02em}
.pcard .kvs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border-top:1px solid var(--line);padding-top:10px}
.pcard .kvs span{display:block;font:500 10px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.pcard .kvs b{font:500 13.5px/1.1 var(--f-mono)}
.delta{font:600 12px/1 var(--f-mono);padding:4px 7px;border-radius:5px;white-space:nowrap}

/* ---------- drawer y toast ---------- */

.tryout{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}

.tk-fill.f1{fill:var(--c1)} .tk-fill.f2{fill:var(--c2)} .tk-fill.f3{fill:var(--c3)} .tk-fill.f4{fill:var(--c4)}

.truck{display:flex;gap:4px;align-items:stretch;margin:6px 0 4px}

.truck .cmp.sm{min-width:min(56px,22%)} /* el compartimento chico no se aplasta: su rótulo («D. Premium») entra entero */
@media (max-width:620px){.truck .cmp{font-size:10px;padding:4px 1px;letter-spacing:-.02em}}
.truck .cmp.empty{background:var(--sunken);color:var(--muted);border:1px dashed var(--line-strong)}
.truck .cab{flex:0 0 30px;border-radius:7px 14px 14px 7px;background:var(--line-strong)}
.imp details{border-bottom:1px solid var(--line)}
.imp summary{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;list-style:none}

.imp summary span{flex:1;min-width:0}
.imp summary::before{content:"›";color:var(--faint);font-weight:700;transition:transform .15s}
.imp details[open] summary::before{transform:rotate(90deg)}
.imp details p{padding:0 16px 12px 30px;font-size:12.5px;color:var(--muted)}
.imp-tot{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-weight:600}
.imp-tot b{font:800 22px/1 var(--f-mono);color:var(--ok)}
.flow{display:grid;grid-template-columns:minmax(0,1.1fr) auto minmax(0,1fr) auto minmax(0,1.1fr);gap:12px;align-items:center;padding:16px}
.flow .col2{display:flex;flex-direction:column;gap:6px}

.msg.yo{background:var(--accent);color:#1E1E1E;align-self:flex-end;border-bottom-right-radius:4px}

.typing{display:inline-flex;gap:4px;padding:3px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.1s infinite}
.typing i:nth-child(2){animation-delay:.18s} .typing i:nth-child(3){animation-delay:.36s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.composer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);align-items:flex-end}
.scorebig{font:800 46px/1 var(--f-display)}
.crit{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:10px 14px;align-items:center}
.meter{height:7px;background:var(--sunken);border-radius:9px;overflow:hidden}

.meter i.mid{background:var(--warn)} .meter i.low{background:var(--bad)}

.tbl tr.sel td{background:var(--accent-soft)}
table.tbl.heat-t{table-layout:fixed;width:100%;min-width:420px} .heat-t td{padding:0;height:24px;border-left:1px solid var(--surface)} .heat-t th{padding:6px 0;font-size:10px;text-align:center} .heat-t th:first-child,.heat-t td:first-child{width:62px;padding:4px 8px;text-align:left} .heat-t th:last-child,.heat-t td:last-child{width:46px;padding:4px 6px;text-align:right}

.wa .b small{display:block;text-align:right;font-size:10.5px;opacity:.6;margin-top:4px}
.wa .hd{font:500 11px/1 var(--f-mono);color:var(--muted);text-align:center;margin-bottom:4px}
.fc{display:block;width:100%;height:auto}
.fc text{font:500 10px var(--f-mono);fill:var(--muted)}
.fc .ground{fill:var(--surface-2)} .fc .store{fill:var(--sunken);stroke:var(--line-strong)} .fc .island{fill:var(--line-strong)}
.fc .pump{fill:var(--surface);stroke:var(--fg);stroke-width:1.2} .fc .canopy{fill:none;stroke:var(--line-strong);stroke-dasharray:6 5}
.fc .road{fill:var(--sunken)} .fc .cam{fill:var(--fg)} .fc .camv{fill:var(--accent);opacity:.18}

@keyframes pulse{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
.evdot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:5px;background:var(--info)}
.evdot.crit{background:var(--bad)} .evdot.warn{background:var(--warn)} .evdot.ok{background:var(--ok)}
.heat{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:14px 16px}

/* ---------- GOTA: cámaras, app del cliente, promos ---------- */

function buildHistory(P){const g=RNG(7331),days=[];
 for(let i=56;i>=1;i--)days.push({d:addD(TODAY,-i),rain:g.u()<.18,v:{}});
 for(const p of PRODS){const base=P.p[p.id].vol/30.4;
  days.forEach((x,k)=>{const trend=1+.0012*(k-55);x.v[p.id]=Math.round(base*DW[p.id][x.d.getDay()]*(x.rain?RAINF(p.id):1)*trend*(1+.05*g.n()))})}
 return days}
function lwDays(){let d=addD(TODAY,1);while(d.getDay()!==6)d=addD(d,1);return[d,addD(d,1),addD(d,2)]}
const isLW=date=>D.lw.some(x=>+x===+day0(date));
const isLWEve=date=>+addD(D.lw[0],-1)===+day0(date);
/* pronóstico: promedio de los últimos 4 días iguales de la semana, sin el efecto de la lluvia, más el contexto cargado */
function fcDay(hist,pid,date,ctx){const dd=day0(date);const same=hist.filter(x=>x.d.getDay()===dd.getDay()&&x.d<dd).slice(-4);if(!same.length)return 0;
 let f=sum(same.map(x=>x.v[pid]/(x.rain?RAINF(pid):1)))/same.length;
 if(ctx){if(ctx.lluvia&&dDiff(dd)===1)f*=RAINF(pid);
  if(ctx.finde&&isLW(dd))f*=PR[pid].naf?1.18:.8;
  if(ctx.finde&&isLWEve(dd)&&PR[pid].naf)f*=1.1;
  if(ctx.evento&&dDiff(dd)>=0&&dDiff(dd)<=2)f*=1.05}
 return f}
function backtest(hist,pid){const errs=[];for(let i=hist.length-14;i<hist.length;i++){const x=hist[i];const same=hist.slice(0,i).filter(y=>y.d.getDay()===x.d.getDay()).slice(-4);let f=sum(same.map(y=>y.v[pid]/(y.rain?RAINF(pid):1)))/same.length;if(x.rain)f*=RAINF(pid);errs.push(Math.abs(f-x.v[pid])/x.v[pid])}return sum(errs)/errs.length}
const avgDaily=(pid,ctx)=>sum([1,2,3,4,5,6,7].map(i=>fcDay(D.hist,pid,addD(TODAY,i),ctx)))/7;
/* proyección hora a hora de cada tanque */
function project(ctx,order){const res={},lead=Math.min(96,Math.round(S.P.lead));
 for(const t of TANKS){const pts=[];let L=t.cap*t.lvl,out=null;const cache={};
  for(let h=0;h<=96;h++){if(h>0){const at=addH(NOW,h-1),k=+day0(at);if(!(k in cache))cache[k]=fcDay(D.hist,t.pid,at,ctx);L-=cache[k]*hp(t.pid)[at.getHours()];if(order&&h===lead)L+=order.alloc[t.pid]||0;if(L<0)L=0}
   pts.push(L);if(out===null&&L<t.cap*MINOP)out=h}
  res[t.id]={pts,out}}
 return res}
/* pedido sugerido: llena el camión por compartimentos, primero el tanque con menos días de cobertura, sin pasar el 95% de llenado seguro */
function planOrder(ctx,proj){const lead=Math.min(96,Math.round(S.P.lead));
 const st=TANKS.map(t=>{const lvl=proj[t.id].pts[lead];return{t,lvl,ull:t.cap*SAFE-lvl,daily:avgDaily(t.pid,ctx),add:0}});
 const comps=[];
 for(const c of COMPS.slice().sort((a,b)=>b-a)){const cand=st.filter(x=>x.add+c<=x.ull).sort((a,b)=>(a.lvl+a.add)/a.daily-(b.lvl+b.add)/b.daily);
  if(cand.length){cand[0].add+=c;comps.push({cap:c,pid:cand[0].t.pid})}else comps.push({cap:c,pid:null})}
 const alloc={},cover={};st.forEach(x=>{alloc[x.t.pid]=x.add;cover[x.t.pid]=Math.max(0,(x.lvl+x.add-x.t.cap*MINOP)/x.daily)});
 const order=['super','premium','diesel','dpremium'];comps.sort((a,b)=>(a.pid?order.indexOf(a.pid):9)-(b.pid?order.indexOf(b.pid):9));
 const total=sum(Object.values(alloc));return{alloc,cover,comps,total,full:total===sum(COMPS),eta:addH(NOW,lead)}}
/* conciliación de inventario: libro (apertura + descargas − ventas) contra la medición, con la temperatura ya descontada */
function buildWet(hist){const g=RNG(4242),tol=S.P.tolInv/100;
 return TANKS.map(t=>{const rows=[];const last=hist.slice(-14);
  last.forEach((x,i)=>{const sales=x.v[t.pid],dT=g.n()*.45,coef=PR[t.pid].naf?.0012:.00083,temp=-t.cap*.5*coef*dT,noise=g.n()*.0007*sales,leak=(t.id==='T3'&&i>=5)?-.0042*sales:0;
   rows.push({d:x.d,sales,dT,temp,unexp:noise+leak})});
  const w7=rows.slice(-7),s7=sum(w7.map(r=>r.sales)),u7=sum(w7.map(r=>r.unexp)),neg=w7.filter(r=>r.unexp<0).length,pct=u7/s7;
  const alert=(neg>=6||neg<=1)&&Math.abs(pct)>=tol*.4;
  let k=rows.length-1;const sg=Math.sign(rows[k].unexp);while(k>0&&Math.sign(rows[k-1].unexp)===sg)k--;
  const run=rows.slice(k);
  return{t,rows,pct,neg,alert,since:rows[k].d,days:run.length,cum:sum(run.map(r=>r.unexp)),cumPct:sum(run.map(r=>r.unexp))/sum(run.map(r=>r.sales)),tempMax:Math.max(...rows.map(r=>Math.abs(r.temp)))}})}
/* precios: modelo de demanda con quiebre en el promedio de la zona y reglas del dueño */
function compPrice(c,pid){const a=c.p[pid];return a==null?null:Math.round(S.P.zona[pid]*a/DEF.p[pid].precio)}
function priceModel(pid,fr){const pp=S.P.p[pid],c=pp.costo,p0=pp.precio;
 const rows=COMP.map(x=>({x,p:compPrice(x,pid)})).filter(r=>r.p!=null);
 const W=rows.map(r=>1/Math.max(.3,r.x.dist)),ref=sum(rows.map((r,i)=>r.p*W[i]))/sum(W);
 const ps=rows.map(r=>r.p),mn=Math.min(...ps),mx=Math.max(...ps),e=EL[pid]*FR[fr].k;
 const shape=p=>Math.exp(-(p>ref?1.6:1)*e*(p-ref)/ref);
 const V0=pp.vol/30.4,K=V0/shape(p0),V=p=>K*shape(p),M=p=>(p-c)*V(p);
 const R=RL(),ch=R.maxch/100,maxUp=Math.floor(p0*(1+ch)),maxDn=Math.ceil(p0*(1-ch));
 let lo=Math.max(Math.ceil(c+R.minm[pid]),maxDn),hi=Math.min(Math.floor(mx*(1+R.tope/100)),maxUp),conflict=false;
 if(lo>hi){conflict=true;hi=lo}
 let best=lo,bm=-Infinity;for(let p=lo;p<=hi;p++){const m=M(p);if(m>bm+1e-9){bm=m;best=p}}
 if(Math.abs(best-p0)<3&&p0>=lo&&p0<=hi)best=p0;
 const binding=best!==p0&&best===maxUp?'max':best!==p0&&best===maxDn?'min':null;
 return{pid,c,p0,ref,mn,mx,e,lo,hi,best,V,M,rows,conflict,binding,d:best-p0,dm:M(best)-M(p0)}}

/* ================= gráficos SVG sin librerías ================= */
function niceTicks(a,b,n){const span=b-a;if(!(span>0))return[a];const s0=span/n,mag=10**Math.floor(Math.log10(s0)),e=s0/mag,step=(e>=7.5?10:e>=3.5?5:e>=1.5?2:1)*mag,out=[];for(let v=Math.ceil(a/step)*step;v<=b+1e-9;v+=step)out.push(+v.toFixed(10));return out}
/* en el teléfono el gráfico se dibuja más angosto (420 en vez de 640 unidades) para que los rótulos se lean; el margen izquierdo crece un poco */
const chartW=()=>innerWidth<=620?420:640,chartPl=pl=>innerWidth<=620?Math.max(pl,56):pl;
function lineChart(o){const W=o.w||chartW(),Hh=o.h||230,pl=o.w?o.pl??48:chartPl(o.pl??48),pr=o.pr??14,pt=o.pt??16,pb=o.pb??26;
 const X=x=>pl+(x-o.x0)/(o.x1-o.x0)*(W-pl-pr),Y=y=>pt+(1-(y-o.y0)/(o.y1-o.y0))*(Hh-pt-pb),f=v=>v.toFixed(1);
 let s=`<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${esc(o.label||'Gráfico')}">`;
 (o.bands||[]).forEach(b=>s+=`<rect class="${b.cls||'band'}" x="${f(X(b.x0))}" y="${pt}" width="${f(Math.max(0,X(b.x1)-X(b.x0)))}" height="${Hh-pt-pb}"/>`);
 (o.yt||[]).forEach(([y,l])=>s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${f(Y(y))}" y2="${f(Y(y))}"/><text x="${pl-6}" y="${f(Y(y)+3.5)}" text-anchor="end">${esc(l)}</text>`);
 (o.xt||[]).forEach(([x,l])=>{const xx=X(x),a=xx>W-pr-24?'end':xx<pl+24?'start':'middle';s+=`<text x="${f(a==='end'?Math.min(xx,W-2):xx)}" y="${Hh-7}" text-anchor="${a}">${esc(l)}</text>`});
 (o.hlines||[]).forEach(h=>s+=`<line class="${h.cls||'ref'}" x1="${pl}" x2="${W-pr}" y1="${f(Y(h.y))}" y2="${f(Y(h.y))}"/>${h.label?`<text x="${W-pr-4}" y="${f(Y(h.y)-5)}" text-anchor="end">${esc(h.label)}</text>`:''}`);
 (o.vlines||[]).forEach(v=>s+=`<line class="${v.cls||'ref'}" x1="${f(X(v.x))}" x2="${f(X(v.x))}" y1="${pt}" y2="${Hh-pb}"/>${v.label?`<text x="${f(X(v.x)+(v.anchor==='end'?-4:4))}" y="${v.bottom?Hh-pb-6-(v.dy||0):pt+9+(v.dy||0)}" text-anchor="${v.anchor||'start'}">${esc(v.label)}</text>`:''}`);
 (o.series||[]).forEach(se=>{const d=se.pts.map((p,i)=>(i?'L':'M')+f(X(p[0]))+' '+f(Y(p[1]))).join('');s+=`<path class="ln ${se.cls}${se.dash?' dash':''}${se.thin?' thin':''}" d="${d}"/>`});
 (o.dots||[]).forEach(p=>s+=`<circle class="dot ${p.cls||''}" cx="${f(X(p.x))}" cy="${f(Y(p.y))}" r="${p.r||5}"/>${p.label?`<text class="lab" x="${f(X(p.x))}" y="${f(Y(p.y)+(p.below?19:-10))}" text-anchor="middle">${esc(p.label)}</text>`:''}`);
 return s+'</svg>'}
function barChart(o){const W=o.w||chartW(),Hh=o.h||210,pl=o.w?o.pl??48:chartPl(o.pl??48),pr=14,pt=14,pb=24,n=o.items.length,bw=(W-pl-pr)/n,f=v=>v.toFixed(1);
 const Y=y=>pt+(1-(y-o.y0)/(o.y1-o.y0))*(Hh-pt-pb);
 let s=`<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${esc(o.label||'Gráfico')}">`;
 (o.hbands||[]).forEach(b=>s+=`<rect class="${b.cls||'band'}" x="${pl}" y="${f(Y(b.y1))}" width="${W-pl-pr}" height="${f(Math.max(0,Y(b.y0)-Y(b.y1)))}"/>`);
 (o.yt||[]).forEach(([y,l])=>s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${f(Y(y))}" y2="${f(Y(y))}"/><text x="${pl-6}" y="${f(Y(y)+3.5)}" text-anchor="end">${esc(l)}</text>`);
 o.items.forEach((it,i)=>{const a=Y(Math.max(it.v,0)),b=Y(Math.min(it.v,0));s+=`<rect class="bar ${it.cls||''}" x="${f(pl+i*bw+bw*.2)}" y="${f(a)}" width="${f(bw*.6)}" height="${f(Math.max(1,b-a))}" rx="2"><title>${esc(it.t||'')}</title></rect>`;if(it.l)s+=`<text x="${f(pl+i*bw+bw/2)}" y="${Hh-7}" text-anchor="middle">${esc(it.l)}</text>`});
 if(o.zero)s+=`<line class="axis" x1="${pl}" x2="${W-pr}" y1="${f(Y(0))}" y2="${f(Y(0))}"/>`;
 (o.hlines||[]).forEach(h=>s+=`<line class="${h.cls||'ref'}" x1="${pl}" x2="${W-pr}" y1="${f(Y(h.y))}" y2="${f(Y(h.y))}"/>${h.label?`<text x="${W-pr-4}" y="${f(Y(h.y)-5)}" text-anchor="end">${esc(h.label)}</text>`:''}`);
 return s+'</svg>'}
function tankSvg(t){const pct=Math.max(0,Math.min(1,t.lvl)),w=64,h=110,ih=h-16,y=8+(1-pct)*ih,ym=8+(1-MINOP)*ih;
 return `<svg viewBox="0 0 ${w} ${h}" aria-hidden="true"><rect x="5" y="5" width="${w-10}" height="${h-10}" rx="13" class="tk-shell"/><clipPath id="clip${t.id}"><rect x="8" y="8" width="${w-16}" height="${ih}" rx="10"/></clipPath><rect clip-path="url(#clip${t.id})" x="8" y="${y.toFixed(1)}" width="${w-16}" height="${(pct*ih).toFixed(1)}" class="tk-fill f${PR[t.pid].k}"/><line x1="8" x2="${w-8}" y1="${ym.toFixed(1)}" y2="${ym.toFixed(1)}" class="tk-min"/></svg>`}

/* ================= armado de todos los datos ================= */
function rebuild(){const P=S.P;D={hist:buildHistory(P)};D.lw=lwDays();
 D.mape=Object.fromEntries(PRODS.map(p=>[p.id,backtest(D.hist,p.id)]));
 D.proj=project(S.ctx,null);D.tanks=TANKS.map(t=>Object.assign({},t,{out:D.proj[t.id].out}));
 D.order=planOrder(S.ctx,D.proj);D.projOrd=project(S.ctx,D.order);
 const outs=D.tanks.filter(t=>t.out!=null).sort((a,b)=>a.out-b.out);
 D.next=outs.length?{pid:outs[0].pid,id:outs[0].id,h:outs[0].out,dl:outs[0].out-P.lead}:null;
 D.wet=buildWet(D.hist);D.shifts=buildShifts();D.docs=buildDocs();D.segs=buildSegs();D.street=buildStreet();D.hoses=buildHoses();D.maint=buildMaint();D.fleet=buildFleet();D.cv=buildCV();streetIn();D.ev=buildEvents();D.traffic=buildTraffic();D.playa=buildPlaya();D.sec=buildSec();D.store=buildStore();D.motor=buildMotor()}

/* mantenimiento: caudal y cortes por manguera, desde el controlador */
function buildHoses(){const g=RNG(515),H=[],map=['super','diesel','premium','dpremium'];
 for(let s=1;s<=4;s++)['A','B','C','D'].forEach((Lt,i)=>{const pid=map[i],id=s+Lt,nom=PR[pid].naf?38:40,flow=[],err=[];
  for(let d=0;d<21;d++){let f=nom+g.n()*.6;if(id==='3B'&&d>=7)f-=.45*(d-6);flow.push(+f.toFixed(1));let e=g.u()<.08?1:0;if(id==='2A'&&d>=18)e=[3,5,7][d-18];err.push(e)}
  const drop=sum(flow.slice(-3))/3/nom-1,st=drop<-.1?'bad':sum(err.slice(-3))>=6?'warn':'ok';
  H.push({id,s,pid,nom,flow,err,drop,st})});
 return H}

const stat=(label,val,sub,cls='')=>`<div class="stat ${cls}"><span>${label}</span><b>${val}</b><small>${sub||''}</small></div>`;
const pill=(cls,txt)=>`<span class="pill ${cls}">${txt}</span>`;
const SEV={crit:['p-bad','Crítica'],warn:['p-warn','Atención'],info:['p-info','Sugerencia']};
const deltaChip=d=>d>0?`<span class="delta up">${arsS(d)}</span>`:d<0?`<span class="delta dn">${arsS(d)}</span>`:'<span class="delta eq">mantener</span>';
const slope=a=>{const n=a.length,mx=(n-1)/2,my=sum(a)/n;let nu=0,de=0;a.forEach((y,i)=>{nu+=(i-mx)*(y-my);de+=(i-mx)**2});return nu/de};

/* ---------- Resumen ---------- */
const flowHtml=()=>`<div class="flow"><div class="col2">${[['fuel','Controlador de surtidores'],['drop','Telemetría de tanques'],['cash','POS, QR y cierres de caja'],['file','Facturas, remitos y resúmenes'],['camera','Cámaras que ya tenés'],['tag','Precios públicos de la zona']].map(([i,t])=>`<div class="node">${ic(i)}${t}</div>`).join('')}</div><div class="arr">${ic('arrow')}</div><div class="core"><b>GOTA</b><p class="small muted" style="margin-top:8px">Modelos y reglas del dueño. Los números salen de los datos; si falta uno, dice «sin dato».</p></div><div class="arr">${ic('arrow')}</div><div class="col2">${[['spark','Sugerencias con su porqué'],['users','Aprobación de una persona'],['chat','Avisos por WhatsApp'],['list','Registro de cada decisión']].map(([i,t])=>`<div class="node">${ic(i)}${t}</div>`).join('')}</div></div>`;
V.inicio=()=>{const P=S.P,h=D.hist,y=h[h.length-1],w=h[h.length-8];
 const ly=sum(PRODS.map(p=>y.v[p.id])),lw=sum(PRODS.map(p=>w.v[p.id])),mg=sum(PRODS.map(p=>y.v[p.id]*(P.p[p.id].precio-P.p[p.id].costo)));
 const al=alerts(),crit=al.filter(a=>a.sev==='crit').length,nx=D.next,imp=impact(),tot=sum(imp.g.map(x=>x.v)),top=al.slice(0,8);
 const hr=NOW.getHours(),hi=hr>=5&&hr<13?'Buen día':hr>=13&&hr<20?'Buenas tardes':'Buenas noches',dl=DOWL[NOW.getDay()];
 const nxStat=nx&&nx.h<=96?stat('Próximo quiebre de stock',`${PR[nx.pid].short} · ${fDur(nx.h)}`,S.orderOk?'Pedido confirmado':nx.dl>0?`Pedí antes de ${fWhen(addH(NOW,nx.dl))}`:'Ya no llega un pedido normal',!S.orderOk&&nx.dl<12?'bad':''):stat('Próximo quiebre de stock','Sin riesgo','Ningún tanque llega al mínimo en 4 días','ok');
 return `<div class="hello hero"><div><h2>${hi}, equipo.</h2><p>${dl[0].toUpperCase()+dl.slice(1)} ${NOW.getDate()} de ${MONL[NOW.getMonth()]} · ${esc(P.station)}. Esto es lo que GOTA preparó para hoy.</p></div><div class="row"><button class="btn" data-act="tour">${ic('play')}Modo presentación</button><button class="btn" data-act="params">${ic('sliders')}Cargar mis números</button></div></div>
 <div class="stats">${stat('Litros vendidos ayer',lit(ly),`${pc(ly/lw-1)} vs. el ${DOWL[y.d.getDay()]} anterior`)}${stat('Margen bruto ayer',ars(mg),`${ars(mg/ly)} por litro, en promedio`)}${nxStat}${stat('Alertas abiertas',num(al.length),crit?`${crit} crítica${crit>1?'s':''}`:'Ninguna crítica',crit?'bad':'')}</div>
 <div class="grid2">${panel('Para hoy, en orden de importancia',top.length?top.map(a=>`<div class="item" data-act="go" data-v="${a.mod}"${a.sh?` data-sh="${a.sh}"`:''}${a.ev?` data-ev="${a.ev}"`:''} role="button" tabindex="0">${ic(a.icon)}<div class="body"><b>${a.t}</b><small>${a.s}</small></div><div class="side-r">${pill(SEV[a.sev][0],SEV[a.sev][1])}<span class="small muted">${VIEW[a.mod].name}</span></div></div>`).join('')+(al.length>top.length?`<div class="pad small muted">Y ${al.length-top.length} más en los módulos.</div>`:''):'<div class="pad muted">No quedan pendientes.</div>',{icon:'check',n:al.length})}
 ${panel('Impacto mensual estimado',`<div class="imp">${imp.g.map(x=>`<details><summary><span>${x.n}</span><b class="num">${ars(x.v)}</b></summary><p>${x.how}</p></details>`).join('')}<div class="imp-tot"><span>Total estimado por mes</span><b>${ars(tot)}</b></div><p class="note" style="margin:0 16px 14px">A validar en el piloto, sin sumar al total: ${imp.h.join(', ')}. Todo sale de los datos de la demo y de supuestos que podés cambiar en <a href="#" data-act="params">Parámetros</a>. Tocá cada línea para ver la cuenta.</p></div>`,{icon:'dollar'})}</div>
 <div class="grid2 mt">${panel('Parte diario por WhatsApp',`<div class="pad"><div class="wa"><div class="hd">hoy 07:30 · al celular del dueño</div><div class="b">${esc(parteDiario())}<small>07:30</small></div></div><div class="row" style="margin-top:10px">${S.appr.parte?pill('p-ok','Prueba enviada (simulada)'):`<button class="btn sm" data-act="parte">${ic('send')}Enviar prueba</button>`}<span class="small muted">El dueño no tiene que abrir nada: le llega lo importante.</span></div></div>`,{icon:'chat'})}${panel('Tu red de estaciones',redHtml(),{icon:'map',right:'<span class="small muted">ejemplo con 3</span>'})}</div>
 <div class="mt">${panel('Preguntale a GOTA',askHtml(),{icon:'chat'})}</div>
 <div class="mt">${panel('De dónde salen los datos',flowHtml(),{icon:'spark'})}</div>
 ${S.log.length?`<div class="mt">${panel('Lo que se decidió en esta sesión',S.log.slice().reverse().map(l=>`<div class="item"><span class="mono small muted" style="flex:none;width:44px">${l.at}</span><div class="body"><b>${esc(l.t)}</b></div></div>`).join(''),{icon:'list',n:S.log.length})}</div>`:''}`};

/* ---------- Precios ---------- */
function priceChart(m,lo,hi){const step=Math.max(1,Math.round((hi-lo)/90)),pts=[];for(let p=lo;p<=hi;p+=step)pts.push([p,m.M(p)]);if(pts[pts.length-1][0]!==hi)pts.push([hi,m.M(hi)]);
 const ys=pts.map(p=>p[1]);let y0=Math.min(...ys),y1=Math.max(...ys);const pd=(y1-y0)*.18||1;y0-=pd;y1+=pd*1.6;
 return lineChart({label:`Margen bruto diario esperado según el precio de ${PR[m.pid].short}`,x0:lo,x1:hi,y0,y1,yt:niceTicks(y0,y1,4).map(v=>[v,kfmt(v)]),xt:niceTicks(lo,hi,innerWidth<=620?3:5).map(v=>[v,'$'+num(v)]),
  bands:[{x0:Math.max(lo,m.lo),x1:Math.min(hi,m.hi),cls:'band-ok'}],vlines:[{x:m.mn,label:'mín. zona',anchor:'end',bottom:true},{x:m.ref,label:'prom.',bottom:true,dy:13},{x:m.mx,label:'máx.',bottom:true}],
  series:[{pts,cls:'sfg'}],dots:[{x:m.p0,y:m.M(m.p0),label:'hoy',below:true}].concat(m.d?[{x:m.best,y:m.M(m.best),cls:'acc',label:'sugerido'}]:[])})}
function tryOut(m,p){const v=m.V(p),mg=m.M(p),v0=m.V(m.p0),m0=m.M(m.p0),out=p<m.lo||p>m.hi;
 return `<div><span>Precio</span><b>${ars(p)}</b></div><div><span>Litros por día</span><b>${num(v)}<small class="${v>=v0?'okc':'badc'}">${pc(v/v0-1)}</small></b></div><div><span>Margen por día</span><b>${ars(mg)}<small class="${mg>=m0?'okc':'badc'}">${pc(mg/m0-1)}</small></b></div>${out?`<div class="full">Fuera de la banda que permiten las reglas (${ars(m.lo)} a ${ars(m.hi)}).</div>`:''}`}
function priceWhy(m){const r=[],pos=(m.p0-m.ref)/m.ref;
 r.push(['map',`Tu precio de hoy (${ars(m.p0)}) está ${Math.abs(pos)<.0005?'en línea con el':`${pc(Math.abs(pos)).slice(1)} ${pos>0?'por encima del':'por debajo del'}`} promedio de la zona, ponderado por distancia (${ars(m.ref)}).`]);
 const ch=COMP.find(c=>c.chg&&c.chg.pid===m.pid);if(ch)r.push(['up',`${ch.name} (a ${num(ch.dist,1)} km) ${ch.chg.d>0?'subió':'bajó'} ${ars(Math.abs(ch.chg.d))} hace ${fDur(ch.upd)}.`,'warn']);
 const nd=COMP.filter(c=>c.p[m.pid]==null);if(nd.length)r.push(['info',`${nd.map(c=>c.name).join(' y ')}: sin dato de ${PR[m.pid].short}. No se completa a ojo: se calcula con las ${m.rows.length} estaciones que sí tienen precio.`]);
 r.push(['gauge',`Sensibilidad al precio ${m.e>=10?'alta':m.e>=7?'media':'baja'} (elasticidad estimada: ${num(m.e,1)}${S.franja!=='dia'?`, franja «${FR[S.franja].n}»`:''}). Quedar por encima de la zona cuesta más litros de lo que se gana quedando por debajo.`]);
 if(m.binding)r.push(['lock',`La regla de cambio máximo diario (±${num(RL().maxch,1)}%) limita ${m.binding==='max'?'la suba':'la baja'}.`]);
 if(m.conflict)r.push(['alert','El margen mínimo no entra en la banda permitida: revisá el costo cargado.','bad']);
 r.push(['dollar',m.d===0?'Mantener: cualquier cambio deja un margen esperado menor o dentro del margen de error del modelo.':`Con ${ars(m.best)}, el margen esperado es de ${ars(m.M(m.best))} por día, contra ${ars(m.M(m.p0))} hoy (${arsS(m.dm)}). Los litros cambian ${pc(m.V(m.best)/m.V(m.p0)-1)}.`,m.d===0?'':'ok']);
 return r}
function compTable(pid){const own=S.P.p[pid].precio;
 return `<div class="tbl-wrap flat"><table class="tbl" style="min-width:520px"><thead><tr><th>Estación</th><th class="r">Distancia</th><th class="r">Precio</th><th class="r">vs. vos</th><th>Actualizado</th></tr></thead><tbody>${COMP.slice().sort((a,b)=>a.dist-b.dist).map(c=>{const p=compPrice(c,pid);return `<tr><td><b>${c.name}</b><div class="sub">${c.flag}</div></td><td class="r num">${num(c.dist,1)} km</td><td class="r num">${p==null?'<span class="muted">sin dato</span>':ars(p)}</td><td class="r num">${p==null?'—':`<span class="${p<own?'badc':p>own?'okc':''}">${arsS(p-own)}</span>`}</td><td class="small">${c.chg&&c.chg.pid===pid?`<span class="pill p-warn">${c.chg.d>0?'subió':'bajó'} ${ars(Math.abs(c.chg.d))}</span> `:''}hace ${fDur(c.upd)}</td></tr>`}).join('')}</tbody></table></div>`}
function radarSvg(pid){const W=360,Hh=300,cx=180,cy=150,R=130,mk=4,own=S.P.p[pid].precio,rr=km=>R*Math.sqrt(km/mk);
 let s=`<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Ubicación y precio de las estaciones de la zona">`;
 for(let k=1;k<=mk;k++)s+=`<circle cx="${cx}" cy="${cy}" r="${rr(k).toFixed(1)}" class="ring"/><text x="${cx+3}" y="${(cy-rr(k)-3).toFixed(1)}">${k} km</text>`;
 COMP.forEach(c=>{const r=rr(c.dist),a=(c.ang-90)*Math.PI/180,x=cx+r*Math.cos(a),y=cy+r*Math.sin(a),p=compPrice(c,pid),cls=p==null?'nd':p<own?'cheap':'exp';
  s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7" class="rd ${cls}"><title>${c.name}: ${p==null?'sin dato':ars(p)}</title></circle><text class="lab" x="${x.toFixed(1)}" y="${(y-11).toFixed(1)}" text-anchor="middle">${p==null?'sin dato':'$'+num(p)}</text><text x="${x.toFixed(1)}" y="${(y+19).toFixed(1)}" text-anchor="middle">${c.name.replace('Competidor ','C')}</text>`});
 s+=`<circle cx="${cx}" cy="${cy}" r="9" class="rd own"/><text class="lab" x="${cx}" y="${cy+24}" text-anchor="middle">Vos · $${num(own)}</text></svg>`;
 return s+`<div class="legend" style="padding:8px 0 0"><span><i class="sw" style="background:var(--bad)"></i>Más barata que vos</span><span><i class="sw" style="background:var(--ok)"></i>Más cara</span><span><i class="sw" style="background:var(--line-strong)"></i>Sin dato</span></div>`}
V.precios=()=>{const pid=S.prod,m=priceModel(pid,S.franja),ms=PRODS.map(p=>priceModel(p.id,S.franja));
 const lo=Math.floor(Math.min(m.mn,m.p0,m.best,m.lo)*.99),hi=Math.ceil(Math.max(m.mx,m.p0,m.best,m.hi)*1.01),tp=S.tryP&&S.tryP.pid===pid?S.tryP.p:m.best;
 return `<div class="banner">${ic('info')}<div>Las sugerencias respetan las reglas del dueño: margen mínimo por litro, cambio máximo de ±${num(RL().maxch,1)}% por día y tope de ${num(RL().tope,1)}% sobre la estación más cara de la zona. <b>Ningún precio cambia sin aprobación.</b></div></div>
 <div class="grid4">${ms.map(x=>`<div class="pcard${x.pid===pid?' on':''}" data-act="prod" data-p="${x.pid}" role="button" tabindex="0" aria-pressed="${x.pid===pid}"><div class="row" style="gap:8px"><span class="sw bg${PR[x.pid].k}"></span><h3>${PR[x.pid].name}</h3></div><div class="row"><span class="big">${ars(x.best)}</span>${deltaChip(x.d)}</div><div class="kvs"><div><span>Hoy</span><b>${ars(x.p0)}</b></div><div><span>Zona</span><b>${ars(x.ref)}</b></div><div><span>Margen/L</span><b>${ars(x.best-x.c)}</b></div></div></div>`).join('')}</div>
 <div class="row mt"><span class="small muted">Precio por franja horaria (si la bandera lo permite):</span><div class="seg" role="group" aria-label="Franja horaria">${Object.entries(FR).map(([k,f])=>`<button class="${S.franja===k?'on':''}" data-act="franja" data-f="${k}" aria-pressed="${S.franja===k}">${f.n}</button>`).join('')}</div></div>
 <div class="grid2 mt">${panel(`Margen bruto esperado según el precio · ${PR[pid].short}`,`<div class="pad">${priceChart(m,lo,hi)}<div class="legend" style="padding:6px 0 0"><span><i class="sw" style="background:var(--fg)"></i>Margen por día</span><span><i class="sw bgacc"></i>Sugerido</span><span><i class="sw" style="background:var(--ok-soft);outline:1px solid var(--ok)"></i>Banda que permiten las reglas</span></div>
 <label class="fld mt"><span>Probá un precio</span><input type="range" min="${lo}" max="${hi}" step="1" value="${tp}" data-in="tryPrice" data-p="${pid}" aria-label="Probar un precio"></label><div class="tryout" id="tryOut">${tryOut(m,tp)}</div></div>`,{icon:'chart'})}
 ${panel('Por qué este precio',`<ul class="why">${priceWhy(m).map(([i,t,c])=>`<li class="${c||''}">${ic(i)}<span>${t}</span></li>`).join('')}</ul><div class="pad" style="border-top:1px solid var(--line)"><div class="row">${m.d!==0?`<button class="btn pri" data-act="approvePrice" data-p="${pid}">${ic('check')}Aprobar ${ars(m.best)}</button>`:pill('p-ok','En línea con la zona: mantener')}<span class="small muted">En producción se envía al controlador de surtidores y a la cartelería.</span></div></div>`,{icon:'spark'})}</div>
 <div class="grid2 mt">${panel('Radar de la zona',`<div class="pad" style="max-width:460px;margin:0 auto">${radarSvg(pid)}</div>`,{icon:'map',right:`<span class="small muted">${PR[pid].short}</span>`})}${panel(`Precios de la zona · ${PR[pid].short}`,compTable(pid),{icon:'tag',n:COMP.length})}</div>
 <div class="grid2 mt">${panel(`Simulador de promociones · ${PR[pid].short}`,promoHtml(pid),{icon:'gift'})}${panel('Tus reglas de precio',rulesHtml(),{icon:'lock'})}</div>
 <div class="mt">${panel('Control del precio publicado',postedHtml(),{icon:'eye'})}</div>
 <p class="note">En producción: los precios de la zona salen de los datos abiertos de la Secretaría de Energía (desde 2025 informarlos es voluntario, así que algunas estaciones pueden quedar «sin dato») más un relevamiento propio. La sensibilidad al precio se estima con el historial de ventas de la estación. En esta demo, todo es simulado.</p>`};

/* ---------- Stock ---------- */
function tankCard(t){const pr=S.orderOk?D.projOrd:D.proj,o=pr[t.id].out,L=t.cap*t.lvl,dl=o==null?null:o-S.P.lead,cls=o==null?'':(dl<12&&!S.orderOk?'badc':o<=72?'warnc':''),w=t.agua[t.agua.length-1];
 return `<section class="panel tk">${tankSvg(t)}<div style="min-width:0"><div class="row" style="gap:8px"><span class="sw bg${PR[t.pid].k}"></span><h3>${t.id} · ${PR[t.pid].short}</h3></div><div class="big">${pcu(t.lvl)}</div><div class="kv2"><span>Volumen</span><b>${lit(L)}</b><span>Capacidad</span><b>${lit(t.cap)}</b><span>Al mínimo</span><b class="${cls}">${o==null?'en más de 4 días':fWhen(addH(NOW,o))}</b><span>Agua</span><b class="${w>=10?'warnc':''}">${w} mm</b><span>Temperatura</span><b>${num(t.temp,1)} °C</b></div></div></section>`}
function projChart(){const pr=S.orderOk?D.projOrd:D.proj,lead=Math.min(96,Math.round(S.P.lead)),xt=[0,24,48,72,96].map(h=>[h,h===0?'ahora':fDay(addH(NOW,h)).split(' ').slice(0,2).join(' ')]);
 return `<div class="pad">${lineChart({label:'Nivel proyectado de cada tanque, en porcentaje de su capacidad',x0:0,x1:96,y0:0,y1:100,yt:[0,25,50,75,100].map(v=>[v,v+'%']),xt,hlines:[{y:MINOP*100,cls:'ref-bad',label:'mínimo operativo'}],vlines:[{x:lead,cls:S.orderOk?'ref-acc':'ref',label:S.orderOk?'descarga':'si pedís ahora'}],series:D.tanks.map(t=>({pts:pr[t.id].pts.map((L,h)=>[h,L/t.cap*100]),cls:'s'+PR[t.pid].k}))})}</div><div class="legend">${D.tanks.map(t=>`<span><i class="sw bg${PR[t.pid].k}"></i>${t.id} ${PR[t.pid].short}</span>`).join('')}</div>`}
function orderHtml(){const o=D.order,nx=D.next;let head;
 if(!nx||nx.h>72)head='Ningún tanque llega al mínimo en las próximas 72 horas: el pedido puede esperar.';
 else if(nx.dl>0)head=`<b>Pedí antes de ${fWhen(addH(NOW,nx.dl))}</b> para que el ${PR[nx.pid].short.toLowerCase()} no llegue al mínimo.`;
 else head=`<b class="badc">El ${PR[nx.pid].short.toLowerCase()} llega al mínimo antes que un pedido normal.</b> Pedí entrega urgente.`;
 return `<div class="pad"><p style="margin-bottom:10px">${head} Descarga estimada: ${fWhen(o.eta)}.</p>
 <div class="truck" role="img" aria-label="Carga del camión por compartimento">${o.comps.map(c=>c.pid?`<div class="cmp${c.cap<Math.max(...COMPS)?' sm':''}" style="--w:${c.cap};--cc:var(--c${PR[c.pid].k})"><b>${PR[c.pid].short}</b>${num(c.cap/1000)} m³</div>`:`<div class="cmp empty" style="--w:${c.cap}">vacío<br>${num(c.cap/1000)} m³</div>`).join('')}<div class="cab"></div></div>
 <div class="tbl-wrap" style="border:0;margin-top:8px"><table class="tbl fit"><thead><tr><th>Producto</th><th class="r">Litros</th><th class="r">Alcanza para</th></tr></thead><tbody>${PRODS.map(p=>`<tr><td><span class="sw bg${p.k}"></span> ${p.short}</td><td class="r num">${o.alloc[p.id]?lit(o.alloc[p.id]):'—'}</td><td class="r num">${num(o.cover[p.id],1)} días</td></tr>`).join('')}</tbody></table></div>
 <p class="small muted" style="margin:10px 0">${o.full?`Camión completo: ${lit(o.total)} en ${o.comps.length} compartimentos, sin pasar el 95% de llenado seguro de ningún tanque. «Alcanza para» cuenta desde la descarga.`:`Camión parcial: ${lit(o.total)} de ${lit(sum(COMPS))}. No entra más sin pasar el 95% de llenado seguro.`}</p>
 <div class="row">${S.orderOk?`${pill('p-ok','Pedido confirmado (simulado)')}<button class="btn sm ghost" data-act="order">Deshacer</button>`:`<button class="btn pri" data-act="order">${ic('check')}Confirmar pedido</button><span class="small muted">En producción se envía al proveedor por mail o por su portal.</span>`}</div>${S.orderOk?orderTrack():''}
 <label class="row small" style="margin-top:10px;gap:8px;flex-wrap:nowrap;align-items:flex-start"><input type="checkbox" style="margin-top:3px" data-ch="auto"${S.autoOrder?' checked':''}><span><b>Pedido automático con aprobación:</b> cuando un tanque cruza el punto de pedido, GOTA arma el pedido y te pide el OK por WhatsApp.</span></label></div>`}
function fcHtml(){const days=[1,2,3,4,5,6,7].map(i=>addD(TODAY,i));
 return `<div class="tbl-wrap flat" style="border-radius:0"><table class="tbl" style="min-width:540px"><thead><tr><th>Miles de L</th>${days.map(d=>`<th class="r">${DOW[d.getDay()]} ${d.getDate()}${S.ctx.finde&&isLW(d)?' ★':''}</th>`).join('')}</tr></thead><tbody>${PRODS.map(p=>`<tr><td><span class="sw bg${p.k}"></span> ${p.short}</td>${days.map(d=>`<td class="r num">${num(fcDay(D.hist,p.id,d,S.ctx)/1000,1)}</td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="small muted pad">Error medio del modelo en los últimos 14 días: ${PRODS.map(p=>`${p.short} ${pcu(D.mape[p.id],1)}`).join(' · ')}.${S.ctx.finde?' ★ Fin de semana largo.':''}</p>`}
function wetHtml(){const sel=D.wet.find(w=>w.t.id===S.wetT)||D.wet.find(w=>w.alert)||D.wet[0],rows=sel.rows,tol=S.P.tolInv/100;
 const tolL=sum(rows.map(r=>r.sales))/rows.length*tol,mx=Math.max(tolL*1.25,...rows.map(r=>Math.abs(r.unexp)))*1.1;

/* ---------- Cierre de turno ---------- */
function waterfallSvg(sh){const c=shiftCalc(sh),steps=[{l:'Inicial',a:0,b:c.diff,cls:'bad'}];let run=c.diff;
 sh.causes.filter(x=>!x.manual).forEach(x=>{const st=S.appr[sh.id+':'+x.id];if(st==='no')return;steps.push({l:x.short,a:run,b:run+x.v,cls:st==='ok'?'ok':'mute'});run+=x.v});
 steps.push({l:'Queda',a:0,b:run,cls:Math.abs(run)<=S.P.tolCaja?'ok':'warn'});
 const W=chartW(),Hh=240,pl=chartPl(56),pr=10,pt=22,pb=28,lo=Math.min(c.diff,0,run)*1.12,hi=Math.max(0,c.diff,run)+Math.abs(lo)*.08,n=steps.length,bw=(W-pl-pr)/n,f=v=>v.toFixed(1),Y=y=>pt+(1-(y-lo)/(hi-lo))*(Hh-pt-pb);
 let s=`<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Cascada de la diferencia del turno">`;
 niceTicks(lo,hi,4).forEach(v=>s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${f(Y(v))}" y2="${f(Y(v))}"/><text x="${pl-6}" y="${f(Y(v)+3.5)}" text-anchor="end">${kfmt(v)}</text>`);
 s+=`<line class="axis" x1="${pl}" x2="${W-pr}" y1="${f(Y(0))}" y2="${f(Y(0))}"/>`;
 steps.forEach((st,i)=>{const top=Y(Math.max(st.a,st.b)),bot=Y(Math.min(st.a,st.b)),x=pl+i*bw+bw*.17,w=bw*.66,val=i===0||i===n-1?st.b:st.b-st.a;
  s+=`<rect class="bar ${st.cls}" x="${f(x)}" y="${f(top)}" width="${f(w)}" height="${f(Math.max(1.5,bot-top))}" rx="2"/><text class="lab" x="${f(x+w/2)}" y="${f(Math.max(top-6,12))}" text-anchor="middle">${kfmt(val)}</text><text x="${f(x+w/2)}" y="${Hh-9}" text-anchor="middle">${esc(st.l)}</text>`});
 return s+'</svg>'}
function causeItem(sh,x){const k=sh.id+':'+x.id,st=S.appr[k];
 const status=st?pill(st==='ok'?'p-ok':st==='rev'?'p-warn':'p-mute',st==='ok'?'Aprobada':st==='rev'?'En revisión':'Rechazada'):x.manual?`<button class="btn sm" data-act="cause" data-k="${k}" data-st="rev">Asignar revisión</button>`:`<div class="row" style="gap:6px;justify-content:flex-end"><button class="btn sm pri" data-act="cause" data-k="${k}" data-st="ok">Aprobar</button><button class="btn sm ghost" data-act="cause" data-k="${k}" data-st="no">Rechazar</button></div>`;
 return `<div class="item"><span class="evdot ${x.manual?'warn':st==='ok'?'ok':''}"></span><div class="body"><b>${x.t} · <span class="num">${x.manual?ars(-x.v):ars(x.v)}</span></b><small>${x.ev}</small><small><span style="font-weight:600;color:var(--fg)">Acción:</span> ${x.act} (${x.who})</small></div><div class="side-r">${x.conf!=null?`<span class="conf">confianza ${pcu(x.conf)}</span>`:'<span class="conf">sin evidencia</span>'}${status}</div></div>`}
const mediaTable=sh=>`<div class="tbl-wrap flat"><table class="tbl" style="min-width:520px"><thead><tr><th>Medio</th><th class="r">Rendido</th><th>Fuente</th><th>Estado</th></tr></thead><tbody>${sh.media.map(([n,v,src,st,txt])=>`<tr><td><b>${n}</b></td><td class="r num">${ars(v)}</td><td class="small">${src}</td><td>${pill(st==='ok'?'p-ok':st==='bad'?'p-bad':'p-warn',txt)}</td></tr>`).join('')}</tbody></table></div>`;
function staffTable(sh){const c=shiftCalc(sh),all=sum(sh.causes.map(x=>x.v));
 return `<div class="tbl-wrap flat"><table class="tbl" style="min-width:520px"><thead><tr><th>Playero</th><th class="r">Litros</th><th class="r">Venta</th><th class="r">Diferencia</th><th class="r">Sin explicar</th></tr></thead><tbody>${sh.staff.map(p=>{const mine=sh.causes.filter(x=>p.ex.includes(x.id));let dif=-sum(mine.map(x=>x.v));if(p.rest)dif+=c.diff+all;const left=dif+sum(mine.filter(x=>!x.manual&&S.appr[sh.id+':'+x.id]==='ok').map(x=>x.v));

 const over=pts.filter(p=>p[1]>5).map(p=>p[0]),rg=[];over.forEach(h=>{const r=rg[rg.length-1];if(r&&h===r[1]+1)r[1]=h;else rg.push([h,h])});

/* calle: autos que pasan (C6) contra autos que entran (C1), ayer */
function buildStreet(){const y=D.hist[D.hist.length-1],g=RNG(919),hrs=[];
 for(let h=6;h<=23;h++){const enter=sum(PRODS.map(p=>y.v[p.id]*hp(p.id)[h]))/CAR_L,cap=.058-.017*Math.exp(-((h-18.5)**2)/2)-.009*Math.exp(-((h-8)**2)/1.2)+g.n()*.0025;hrs.push({h,enter,pass:enter/cap,cap})}
 const pk=hrs.filter(x=>x.h>=17&&x.h<=19),rest=hrs.filter(x=>x.h<17||x.h>19),base=sum(rest.map(x=>x.enter))/sum(rest.map(x=>x.pass)),lost=sum(pk.map(x=>x.pass*Math.max(0,base-x.cap)));
 return{hrs,pass:sum(hrs.map(x=>x.pass)),enter:sum(hrs.map(x=>x.enter)),base,pkCap:sum(pk.map(x=>x.enter))/sum(pk.map(x=>x.pass)),lost}}
/* C1 cuenta cada auto que cruza «entrada»: los atendidos (litros ÷ CAR_L = D.cv.cars) más los que se fueron sin cargar (D.cv.hrs[].ab).
   Se llama en rebuild() después de buildCV; deja en x.atend los atendidos y recalcula captación, resto del día, pico y autos perdidos. */
function streetIn(){const st=D.street,cv=D.cv;st.hrs.forEach((x,i)=>{const c=cv.hrs[i];x.atend=c.cars;x.enter=c.cars+c.ab;x.cap=x.enter/x.pass});
 const pk=st.hrs.filter(x=>x.h>=17&&x.h<=19),rest=st.hrs.filter(x=>x.h<17||x.h>19);
 st.atend=cv.cars;st.enter=sum(st.hrs.map(x=>x.enter));st.base=sum(rest.map(x=>x.enter))/sum(rest.map(x=>x.pass));st.pkCap=sum(pk.map(x=>x.enter))/sum(pk.map(x=>x.pass));st.lost=sum(pk.map(x=>x.pass*Math.max(0,st.base-x.cap)))}
function streetEvTxt(){const x=D.street.hrs.find(r=>r.h===Math.min(23,Math.max(6,NOW.getHours()-1)))||D.street.hrs[0];return `De ${x.h} a ${x.h+1} h pasaron ${num(x.pass)} autos por la calle y entraron ${num(x.enter)} (${pcu(x.cap,1)}).`}
function streetHtml(){const st=D.street,mgL=sum(PRODS.map(p=>S.P.p[p.id].vol*(S.P.p[p.id].precio-S.P.p[p.id].costo)))/sum(PRODS.map(p=>S.P.p[p.id].vol)),mx=Math.max(...st.hrs.map(x=>x.cap))*1.15;
 return `<div class="pad"><div class="kv2" style="grid-template-columns:repeat(2,auto minmax(0,1fr));max-width:520px"><span>Pasaron por la calle</span><b>${num(st.pass)} autos</b><span>Entraron</span><b>${num(st.enter)} (${pcu(st.enter/st.pass,1)})</b></div>
 ${barChart({label:'Porcentaje de los autos que pasan por la calle y entran a la estación, por hora',h:170,items:st.hrs.map(x=>({v:x.cap*100,l:x.h%3?'':x.h+' h',cls:x.cap<st.base*.85?'bad':'mute',t:`${x.h} h: pasaron ${num(x.pass)}, entraron ${num(x.enter)} (${pcu(x.cap,1)})`})),y0:0,y1:mx*100,yt:niceTicks(0,mx*100,3).map(v=>[v,num(v,1)+'%']),hlines:[{y:st.base*100,cls:'ref',label:'resto del día'}]})}
 <p class="small" style="margin-top:6px"><b>De 17 a 20 h entra el ${pcu(st.pkCap,1)} de los autos que pasan, contra ${pcu(st.base,1)} el resto del día.</b> Coincide con la fila en las islas: son unos ${num(st.lost)} autos por día que siguen de largo (${lit(st.lost*CAR_L)}, ${ars(st.lost*CAR_L*mgL)} de margen). Ver <a href="#personal">Personal</a>. «Entraron» cuenta cada auto que cruza el ingreso (C1): ${num(st.atend??st.enter)} cargaron y ${num(st.enter-(st.atend??st.enter))} se fueron sin cargar (<a href="#playa">Playa e islas</a>).</p></div>`}

function hoseDetail(h){const n=h.flow.length,k=slope(h.flow.slice(-10)),cur=h.flow[n-1],lim=h.nom*.8,days=k<-.05?(cur-lim)/-k:null;
 let dx;if(h.st==='bad')dx=`<b>Caudal ${pc(h.drop,0)} en 14 días</b>, con tendencia sostenida (${num(k,2)} L/min por día). Causa probable: filtro saturado o desgaste de la bomba.${days!=null?` A este ritmo baja de ${num(lim)} L/min en unos ${Math.max(1,Math.round(days))} días, y los clientes esperan más en la isla.`:''}`;
 else if(h.st==='warn')dx=`<b>Cortes de despacho en aumento</b>: ${h.err.slice(-3).join(', ')} en los últimos tres días, contra 0 o 1 antes. Causa probable: pulsador o válvula. Conviene revisarlo antes de que la manguera quede fuera de servicio.`;
 else dx='Sin anomalías: caudal estable y sin cortes repetidos.';
 const y0=Math.floor(Math.min(...h.flow,lim)-2),y1=Math.ceil(h.nom+3),em=Math.max(8,...h.err);
 return `<div class="pad">${lineChart({label:`Caudal promedio por día de la manguera ${h.id}`,x0:0,x1:n-1,y0,y1,pl:66,yt:niceTicks(y0,y1,4).map(v=>[v,num(v)+' L/min']),xt:[[0,fDay(addD(TODAY,-n)).split(' ').slice(1).join(' ')],[n-1,'ayer']],hlines:[{y:h.nom,cls:'ref',label:'normal'},{y:lim,cls:'ref-bad',label:'límite'}],series:[{pts:h.flow.map((v,i)=>[i,v]),cls:h.st==='bad'?'sbad':'s'+PR[h.pid].k}]})}
 ${barChart({label:`Cortes de despacho por día de la manguera ${h.id}`,h:90,pl:66,items:h.err.map(v=>({v,cls:v>=3?'warn':'mute',t:v+' cortes'})),y0:0,y1:em,yt:[[0,'0'],[em,em+' cortes']]})}
 <p class="small" style="margin-top:8px">${dx}</p>${h.st!=='ok'?`<div class="row" style="margin-top:10px">${S.appr['mt:'+h.id]?pill('p-ok','Orden de trabajo creada'):`<button class="btn pri sm" data-act="wo" data-h="${h.id}">${ic('wrench')}Crear orden de trabajo</button>`}</div>`:''}</div>`}

const PUMP_W=[.34,.3,.22,.14]; // reparto de autos por surtidor: el 4 queda lejos de la entrada
function buildCV(){const g=RNG(2024),st=D.street;
 const hrs=st.hrs.map(x=>{const at=x.atend??x.enter,rho=at/(ATT*STAFF_NOW(x.h)),wait=Math.max(20,35+330*Math.max(0,rho-.75)**1.4+g.n()*4),fill=150+g.n()*8,out=38+(rho>.9?25:0)+g.n()*3;
  return{h:x.h,cars:at,wait,fill,out,rho,ab:at*(wait>95?.07:wait>70?.03:.008),occ:PUMP_W.map(w=>Math.min(.98,at*(wait+fill+out)/3600*w))}});
 const cars=sum(hrs.map(x=>x.cars)),ab=sum(hrs.map(x=>x.ab)),avg=k=>sum(hrs.map(x=>x[k]*x.cars))/cars;
 const rules=[
  {id:'celular',n:'Celular durante la carga',cam:'C3',tipo:'copresencia',det:7,ok:6,fp:1},
  {id:'espera',n:'Auto esperando sin atención más de 90 s',cam:'C3 · C4',tipo:'espera sin atención',det:23,ok:21,fp:2},
  {id:'abandono',n:'Se fue sin cargar',cam:'C4',tipo:'abandono',det:Math.round(ab)+1,ok:Math.round(ab),fp:1}, // confirmados = los que se fueron (D.cv.ab); más una falsa alarma
  {id:'ocupa',n:'Auto ocupando la isla más de 7 min',cam:'C4',tipo:'permanencia',det:3,ok:2,fp:1},
  {id:'bidon',n:'Carga en bidón',cam:'C3',tipo:'copresencia',det:2,ok:1,fp:1},
  {id:'fila',n:'Fila de 5 o más personas en la caja',cam:'C2',tipo:'fila',det:4,ok:4,fp:0},
  {id:'merodeo',n:'Persona más de 3 min en la zona de tanques',cam:'C4',tipo:'permanencia',det:3,ok:0,fp:3},
  {id:'fuga',n:'Patente en la lista de fugas',cam:'C1',tipo:'lectura de patente',det:0,ok:0,fp:0}]; // ayer no hubo coincidencias (D.sec.lpr.match); la de hoy está en «Eventos de hoy»
 const health=[['C1',.99,'—'],['C2',1,'—'],['C3',.97,'Gotas de lluvia en la lente, 7 a 8 h'],['C4',.92,'Reflejo de sol, 16 a 17 h'],['C5',1,'—'],['C6',.96,'Poca luz, 22 a 6 h: el conteo nocturno es menos preciso']];
 return{hrs,cars,ab,wait:avg('wait'),fill:avg('fill'),out:avg('out'),rules,health}}
const mmss=s=>`${Math.floor(s/60)}:${pad(Math.round(s%60))}`;
function stageChart(hrs){const W=chartW(),Hh=220,pl=chartPl(44),pr=10,pt=14,pb=24,n=hrs.length,bw=(W-pl-pr)/n,mx=Math.max(...hrs.map(x=>x.wait+x.fill+x.out))*1.1,f=v=>v.toFixed(1),Y=v=>pt+(1-v/mx)*(Hh-pt-pb);
 let s=`<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Tiempo promedio en la isla por etapa y por hora">`;
 niceTicks(0,mx,4).forEach(v=>s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${f(Y(v))}" y2="${f(Y(v))}"/><text x="${pl-6}" y="${f(Y(v)+3.5)}" text-anchor="end">${mmss(v)}</text>`);
 hrs.forEach((x,i)=>{let base=0;[['wait',x.wait>90?'bad':'warn'],['fill','mute'],['out','ok']].forEach(([k,c])=>{const a=Y(base+x[k]),b=Y(base);s+=`<rect class="bar ${c}" x="${f(pl+i*bw+bw*.18)}" y="${f(a)}" width="${f(bw*.64)}" height="${f(Math.max(.5,b-a))}"><title>${x.h} h · ${k==='wait'?'espera hasta que lo atienden':k==='fill'?'carga y cobro':'salida'}: ${mmss(x[k])}</title></rect>`;base+=x[k]});if(x.h%3===0)s+=`<text x="${f(pl+i*bw+bw/2)}" y="${Hh-7}" text-anchor="middle">${x.h} h</text>`});
 return s+'</svg>'}
function pumpHeat(hrs){return `<div class="tbl-wrap flat"><table class="tbl heat-t"><thead><tr><th>Surtidor</th>${hrs.map(x=>`<th>${x.h%3===0?x.h:''}</th>`).join('')}<th class="r">Pico</th></tr></thead><tbody>${PUMP_W.map((_,p)=>{const pk=Math.max(...hrs.map(x=>x.occ[p]));return `<tr><td><b>${p+1}</b></td>${hrs.map(x=>`<td title="${x.h} h: ${pcu(x.occ[p])} ocupado" style="background:color-mix(in srgb,var(--bad) ${Math.round(x.occ[p]*70)}%,var(--surface))"></td>`).join('')}<td class="r num">${pcu(pk)}</td></tr>`}).join('')}</tbody></table></div>`}

/* precisión de una regla: confirmadas ÷ (confirmadas + falsas alarmas) en 7 días (D.sec.week; sin ese módulo, ayer); con menos de CV_MIN revisiones no se publica porcentaje */

 ${rules.filter(r=>qs[r.id].fp>=3&&qs[r.id].fp>qs[r.id].ok).map(r=>`<div class="banner" style="margin:10px 14px">${ic('info')}<div><b>${r.n}:</b> ${qs[r.id].win} las personas descartaron ${qs[r.id].fp} de ${qs[r.id].n} avisos. Conviene subir el umbral o redibujar la zona antes de seguir avisando.</div></div>`).join('')}

 {id:'camion',n:'Camión',dsl:true,dw:690},
 {id:'moto',n:'Moto',dw:230},
 {id:'bus',n:'Colectivo',dsl:true,dw:540},
 {id:'sc',n:'Sin clasificar'}];
/* parque argentino típico: modelo, segmento, participación base y confianza media del modelo de visión */
const CALLE_M=[
 ['Toyota Hilux','camioneta',.09,.88],
 ['Fiat Cronos','auto',.075,.78],
 ['VW Amarok','camioneta',.065,.84],
 ['Ford Ranger','camioneta',.06,.82],
 ['Toyota Corolla / Corolla Cross','auto / SUV',.06,.8],
 ['Chevrolet Onix / Tracker','auto / SUV',.055,.72],
 ['Peugeot 208','auto',.05,.75],
 ['VW Gol / Polo / Taos','auto / SUV',.05,.68],
 ['Toyota Yaris','auto',.045,.7]];
const CALLE_A=[['0 a 3 años',.14],['4 a 8 años',.19],['9 a 15 años',.2],['más de 15 años',.17]]; // rangos, nunca año exacto
const CALLE_COV={man:1,med:1,tar:1,noc:.82}; // cobertura observable de C6 por franja: de noche falta luz (ver Salud de las cámaras)
const CALLE_AFAC=14.8; // edad promedio del parque argentino, AFAC 2025: referencia externa, no la mide la cámara
const CALLE_SC_MAX=.4; // si «sin clasificar» supera esto, no se muestra ranking de marca ni reparto de antigüedad
/* parte de camionetas, utilitarios, camiones y colectivos entre los que entraron un día */
const callePick=d=>{const tot=sum(Object.values(d.mix));return tot?sum(CALLE_T.filter(t=>t.dsl).map(t=>d.mix[t.id]))/tot:0};

/* datos: últimos 7 días derivados de D.hist (litros por producto) y del perfil horario de D.street, con semilla fija */
function buildTraffic(){const g=RNG(3031),st=D.street,hist=D.hist.slice(-7),fr=h=>CALLE_F.find(f=>h>=f.h[0]&&h<f.h[1]),kIn=st.atend?st.enter/st.atend:1;
 // entran = los que cargan (litros ÷ CAR_L) más los que se van sin cargar, con la proporción de ayer (streetIn)
 const days=hist.map(x=>{const dow=x.d.getDay(),fin=dow===0||dow===6,tot=sum(PRODS.map(p=>x.v[p.id])),enter=tot/CAR_L*kIn,dsl=(x.v.diesel+x.v.dpremium)/tot,k=enter/st.enter;
  // pasan y entran por franja y por mano: el perfil horario de ayer, escalado a los litros de cada día
  const fz=CALLE_F.map(f=>{const hs=st.hrs.filter(r=>fr(r.h)===f),e=sum(hs.map(r=>r.enter))*k,p=sum(hs.map(r=>r.pass))*k*(1+g.n()*.04);
   const pN=p*f.kn,pS=p-pN,eN=e*pN*CALLE_S[0].k/(pN*CALLE_S[0].k+pS*CALLE_S[1].k);
   return{f:f.id,pass:p,enter:e,norte:{pass:pN,enter:eN},sur:{pass:pS,enter:e-eN}}});
  // mix de vehículos: los que suelen cargar diésel siguen la parte de diésel en los litros de ese día; «sin clasificar» 8-12 %
  const sc=.08+g.u()*.04,moto=Math.max(.03,.07-(fin?.015:0)+g.n()*.006),bus=Math.max(.005,.012+g.n()*.002),pick=dsl*.95+g.n()*.02;
  const fr8={sc,moto,bus,suv:pick*.56,util:pick*.3,camion:pick*.14};fr8.auto=1-sc-moto-bus-pick;
  const mix=Object.fromEntries(CALLE_T.map(t=>[t.id,Math.round(enter*fr8[t.id])]));
  // tiempo en la estación: solo recorridos con entrada y salida vistas por C1 (done = parte de recorridos completos)
  const done=.76+g.u()*.14;
  const dwell=Object.fromEntries(CALLE_T.filter(t=>t.dw).map(t=>{const med=t.dw*(fin?1.12:1)*(1+g.n()*.05);return[t.id,{n:Math.round(mix[t.id]*done),med,p90:med*(1.75+g.n()*.08)}]}));
  return{d:x.d,dow,enter,pass:sum(fz.map(z=>z.pass)),dsl,fz,mix,dwell,done}});
 // agregados de 7 días por mano y por franja; sin división si no pasó nadie
 const agg=(f,s)=>{let p=0,e=0;days.forEach(d=>d.fz.forEach(z=>{if(!f||z.f===f){p+=z[s].pass;e+=z[s].enter}}));return{pass:p,enter:e,cap:p>0?e/p:null}};
 const sent=Object.fromEntries(CALLE_S.map(s=>[s.id,agg(null,s.id)]));
 const franjas=CALLE_F.map(f=>Object.assign({f:f.id,n:f.n,a:f.a,sub:f.sub,cov:CALLE_COV[f.id]},Object.fromEntries(CALLE_S.map(s=>[s.id,agg(f.id,s.id)]))));
 // marca y modelo estimados (semana): «sin clasificar» 27-33 %, el resto se reparte entre los modelos y «otros identificados»
 const seen=sum(days.map(d=>d.enter)),sc=.27+g.u()*.06;
 const models=CALLE_M.map(([n,seg,sh,conf])=>({n,seg,share:sh*(1+g.n()*.06),conf})).sort((a,b)=>b.share-a.share),idn=sum(models.map(m=>m.share));
 const brands={n:seen,sc,models,other:1-sc-idn,conf:sum(models.map(m=>m.conf*m.share))/idn};
 // antigüedad por rango: deriva del modelo estimado, así que comparte el «sin dato» con marca/modelo
 const raw=CALLE_A.map(([,s])=>s*(1+g.n()*.04)),ka=(1-sc)/sum(raw);
 const age={n:seen,sc,rows:CALLE_A.map(([r],i)=>({r,share:raw[i]*ka}))};
 return{days,sent,franjas,brands,age,pass:sum(days.map(d=>d.pass)),enter:seen}}
const calleDay=()=>{S.calleDay??=6;return D.traffic.days[S.calleDay]||D.traffic.days[6]};

/* tabla con medidor: nombre, barra proporcional y valor */
const calleTbl=(head,rows)=>`<div class="tbl-wrap flat"><table class="tbl" style="min-width:340px"><thead><tr>${head}</tr></thead><tbody>${rows.map(r=>`<tr${r.mute?' style="opacity:.75"':''}><td><b>${r.n}</b>${r.sub?`<div class="sub">${r.sub}</div>`:''}</td><td style="min-width:90px"><div class="meter"><i style="width:${(r.v*100).toFixed(1)}%;min-width:0;background:${r.bg||'var(--accent)'}"></i></div></td><td class="r num">${r.txt}</td></tr>`).join('')}</tbody></table></div>`;

/* (a) captación por sentido de circulación y franja, últimos 7 días (C6) */
function calleSentHtml(){const T=D.traffic,lo=T.sent.norte.cap>T.sent.sur.cap?CALLE_S[1]:CALLE_S[0],hi=CALLE_S.find(s=>s!==lo),L=T.sent[lo.id],Hc=T.sent[hi.id];
 const lost=L.pass*Math.max(0,Hc.cap-L.cap)/7,mgL=sum(PRODS.map(p=>S.P.p[p.id].vol*(S.P.p[p.id].precio-S.P.p[p.id].costo)))/sum(PRODS.map(p=>S.P.p[p.id].vol));
 const worst=T.franjas.filter(f=>f[lo.id].cap!=null).sort((a,b)=>a[lo.id].cap-b[lo.id].cap)[0],cell=c=>c.cap==null?'<span class="muted">sin dato</span>':pcu(c.cap,1);
 const row=f=>`<tr><td><b>${f.n}</b><div class="sub">${f.sub}${f.cov<1?` · sobre ${pcu(f.cov)} observable`:''}</div></td>${CALLE_S.map(s=>`<td class="r num">${num(f[s.id].pass)}</td><td class="r num">${num(f[s.id].enter)}</td><td class="r num ${f[s.id].cap!=null&&f[s.id].cap<T.sent[s.id].cap*.85?'badc':''}">${cell(f[s.id])}</td>`).join('')}</tr>`;
 return `<div class="tbl-wrap flat"><table class="tbl" style="min-width:640px"><thead><tr><th>Franja</th>${CALLE_S.map(s=>`<th class="r">Pasan<div class="sub">${s.n.toLowerCase()}</div></th><th class="r">Entran</th><th class="r">Captación</th>`).join('')}</tr></thead>
 <tbody>${T.franjas.map(row).join('')}<tr><td><b>7 días</b></td>${CALLE_S.map(s=>`<td class="r num"><b>${num(T.sent[s.id].pass)}</b></td><td class="r num"><b>${num(T.sent[s.id].enter)}</b></td><td class="r num"><b>${cell(T.sent[s.id])}</b></td>`).join('')}</tr></tbody></table></div>
 <p class="small pad"><b>Del ${hi.n.toLowerCase()} entra el ${pcu(Hc.cap,1)} de los autos que pasan; del ${lo.n.toLowerCase()}, el ${pcu(L.cap,1)}</b> (${lo.sub}); la franja más floja de esa mano es ${worst.a} ${worst.n.toLowerCase()}, con ${pcu(worst[lo.id].cap,1)}. El techo de mejora: si esa mano captara como la otra serían hasta unos ${num(lost)} autos más por día (${lit(lost*CAR_L)}, ${ars(lost*CAR_L*mgL)} de margen). <b>Qué probar:</b> que el cartel de precios y el ingreso de esa mano se vean antes (poda, luz, una señal 100 m antes); el resultado se lee en esta misma tabla la semana siguiente. En rojo, las franjas que captan 15 % menos que el promedio de su mano.</p>`}

/* (b) mix de vehículos del día elegido (C1) y su relación con el diésel (controlador de surtidores) */
function calleMixHtml(d){const T=D.traffic,tot=sum(Object.values(d.mix)),sc=tot?d.mix.sc/tot:1,pick=callePick(d),i0=T.days.indexOf(d);
 if(sc>.25)return `<p class="pad">Entraron <b>${num(tot)} vehículos</b>, pero el ${pcu(sc)} quedó sin clasificar: el mix todavía no es confiable y no se muestra. Hay que revisar encuadre e iluminación de C1.</p>`;
 const mxp=Math.max(...T.days.map(x=>Math.max(x.dsl,callePick(x))))*100*1.25;
 return `${calleTbl('<th>Tipo</th><th>Reparto</th><th class="r">Vehículos</th>',CALLE_T.map(t=>({n:t.n,v:d.mix[t.id]/tot,txt:`${num(d.mix[t.id])} · ${pcu(d.mix[t.id]/tot)}`,bg:t.id==='sc'?'var(--line-strong)':t.dsl?'var(--c3)':'var(--c1)',mute:t.id==='sc'})))}
 <div class="legend" style="padding:8px 16px 0"><span><i class="sw" style="background:var(--c3)"></i>Suelen cargar diésel</span><span><i class="sw" style="background:var(--c1)"></i>Suelen cargar nafta</span><span><i class="sw" style="background:var(--line-strong)"></i>Sin clasificar: se informa, no se reparte</span></div>
 <div class="pad"><p class="small" style="margin:0 0 8px"><b>${DOWL[d.dow]}: camionetas, utilitarios y camiones fueron el ${pcu(pick)} de los que entraron, y el diésel el ${pcu(d.dsl)} de los litros</b> (controlador de surtidores).</p>
 ${lineChart({label:'Porcentaje de camionetas, utilitarios y camiones que entran (cámara C1) y porcentaje de diésel en los litros (controlador), por día',h:150,x0:0,x1:6,y0:0,y1:mxp,
  yt:niceTicks(0,mxp,3).map(v=>[v,num(v)+'%']),xt:T.days.map((x,i)=>[i,DOW[x.dow]]),
  series:[{pts:T.days.map((x,i)=>[i,callePick(x)*100]),cls:'sacc'},{pts:T.days.map((x,i)=>[i,x.dsl*100]),cls:'s3',dash:true}],
  dots:i0<0?[]:[{x:i0,y:pick*100,cls:'acc'}]})}
 <div class="legend" style="padding:6px 0 0"><span><i class="sw" style="background:var(--accent-ink)"></i>Camionetas, utilitarios y camiones (cámara)</span><span><i class="sw" style="background:var(--c3)"></i>Diésel en litros (controlador, línea punteada)</span></div>
 <p class="small" style="margin-top:8px">Las dos curvas suben y bajan juntas: los días de más camionetas conviene tener diésel premium a mano y lubricantes para diésel en la góndola de la caja. La precisión del tipo de vehículo se valida a mano en el piloto (200 cruces) antes de tomar decisiones de stock.</p></div>`}

/* (e) tiempo total en la estación (entra → sale) por tipo, día elegido (C1): mediana y p90; menos de 5 casos → sin dato */
function calleDwellHtml(d){const rows=CALLE_T.filter(t=>t.dw),ok=rows.filter(t=>d.dwell[t.id].n>=5),car=d.dwell.auto;
 const slow=ok.filter(t=>t.id!=='auto').sort((a,b)=>d.dwell[b.id].med-d.dwell[a.id].med)[0];
 const row=t=>{const w=d.dwell[t.id];return `<tr><td><b>${t.n}</b></td><td class="r num">${num(w.n)}</td>${w.n<5?'<td class="r" colspan="2"><span class="muted">sin dato por pocos casos</span></td>':`<td class="r num">${mmss(w.med)}</td><td class="r num">${mmss(w.p90)}</td>`}</tr>`};
 return `<div class="tbl-wrap flat"><table class="tbl" style="min-width:340px"><thead><tr><th>Tipo</th><th class="r">Casos</th><th class="r">Mediana</th><th class="r">p90</th></tr></thead><tbody>${rows.map(row).join('')}</tbody></table></div>
 <p class="small pad"><b>${DOWL[d.dow]}: la mitad de los autos estuvo menos de ${mmss(car.med)} en la estación y uno de cada diez más de ${mmss(car.p90)}.</b> ${slow?`${slow.n}: ${mmss(d.dwell[slow.id].med)}, unos ${Math.max(1,Math.round((d.dwell[slow.id].med-car.med)/60))} min más que un auto; si ocupan una isla en el pico, conviene dirigirlos a la ${slow.id==='camion'?'isla de carga pesada':'isla más lejana'}. `:''}Se cuentan solo los vehículos a los que C1 les vio entrada y salida (${pcu(d.done)} de los que entraron${d.done<.7?', <b>parcial</b>: menos del 70 %':''}); los demás se excluyen, no se completan con promedios.</p>`}

/* (c) marca y modelo estimados por un modelo de visión, una vez por visita sobre el mejor cuadro de C1; agregado por semana */
function calleBrandsHtml(){const b=D.traffic.brands,top=b.models.slice(0,8),ms=top[0].share,pk=top.filter(m=>m.seg==='camioneta');
 if(b.sc>CALLE_SC_MAX)return `<p class="pad">Se vieron <b>${num(b.n)} vehículos</b> y el modelo quedó <b>sin clasificar en el ${pcu(b.sc)}</b>: la estimación todavía no es confiable y no se muestra el ranking. Hay que revisar encuadre e iluminación de C1 y volver a medir.</p>`;
 const row=m=>`<tr><td><b>${m.n}</b><div class="sub">${m.seg}</div></td><td style="min-width:120px"><div class="meter"><i class="${m.conf<.75?'mid':''}" style="width:${(m.share/ms*100).toFixed(0)}%"></i></div><span class="small muted">${pcu(m.share,1)} · estimado</span></td><td class="r num ${m.conf<.7?'warnc':''}">${num(m.conf,2)}</td></tr>`;
 return `<div class="tbl-wrap flat"><table class="tbl" style="min-width:340px"><thead><tr><th>Modelo</th><th>Participación</th><th class="r">Confianza</th></tr></thead>
 <tbody>${top.map(row).join('')}<tr><td class="muted">Otros identificados</td><td class="small muted">${pcu(b.other,1)}</td><td></td></tr><tr><td class="muted">Sin clasificar</td><td class="small muted">${pcu(b.sc,1)} · no se reparte</td><td class="r muted">—</td></tr></tbody></table></div>
 <p class="small pad"><b>${pk.length} de los 8 modelos más vistos son camionetas (${pk.map(m=>m.n.replace(/^\S+ /,'')).join(', ')})</b>: estimación del modelo sobre ${num(b.n)} vehículos, confianza media ${num(b.conf,2)}. Sirve para decidir góndola y stock, no para identificar a nadie: no se guarda patente ni hora junto al modelo. El modelo exacto del parque argentino se afina en el piloto con imágenes propias; con más del ${pcu(CALLE_SC_MAX)} sin clasificar el ranking se oculta.</p>`}

/* (d) antigüedad estimada por rango de años, derivada de la generación del modelo; los no identificados quedan sin dato */
function calleAgeHtml(){const a=D.traffic.age,idn=1-a.sc,old=sum(a.rows.slice(2).map(r=>r.share))/idn;
 if(a.sc>CALLE_SC_MAX)return `<p class="pad">El ${pcu(a.sc)} de los vehículos quedó <b>sin dato</b> de antigüedad (modelo no identificado): no se muestra el reparto por rango hasta bajar de ${pcu(CALLE_SC_MAX)}.</p>`;
 const rows=[...a.rows.map(r=>({n:r.r,v:r.share,txt:`${pcu(r.share,1)} · estimado`})),{n:'Sin dato',sub:'modelo no identificado',v:a.sc,txt:pcu(a.sc,1),bg:'var(--line-strong)',mute:true}];
 return `${calleTbl('<th>Rango</th><th>Reparto</th><th class="r">Participación</th>',rows)}
 <p class="small pad"><b>Entre los clasificados, ${Math.round(old*10)} de cada 10 tendrían más de 8 años</b> (estimado por rango, nunca por año exacto: la precisión por año se mide en el piloto). Referencia externa, no medida por la cámara: la edad promedio del parque argentino es ${num(CALLE_AFAC,1)} años (AFAC 2025). <b>Qué hacer:</b> aditivos, lubricantes y chequeo de agua y aceite ofrecidos en la isla. Los no identificados quedan «sin dato», no se completan con el promedio.</p>`}

/* (f) lo que no se hace con la cámara: decisión de producto, no limitación técnica */
const calleNoHtml=()=>`<ul class="why">
 <li class="warn">${ic('x')}<span><b>Repetición de vehículos y frecuencia de visita.</b> Haría falta guardar la patente de cada auto: es un dato personal (Ley 25.326) y no se hace con la cámara. Se mide con la app de puntos, donde el cliente se identifica solo: ver <a href="#fidelizacion">Fidelización</a>. Guardar un hash de la patente no lo resuelve: sigue siendo un dato personal.</span></li>
 <li class="warn">${ic('x')}<span><b>Lectura de patentes en la calle (C6).</b> La cámara de la calle solo cuenta y da el sentido. Las patentes se leen únicamente en el ingreso (C1) y solo se comparan con la lista de fugas con denuncia: ver <a href="#seguridad">Seguridad</a>.</span></li>
 <li class="ok">${ic('check')}<span><b>Lo que sí se hace:</b> conteo por sentido y franja, tipo de vehículo, marca y rango de años como estimación agregada por semana, tiempo entre entrada y salida. Nada queda asociado a una persona ni a una patente.</span></li></ul>`;

 return `<div class="banner">${ic('info')}<div>La cámara de la calle (C6) cuenta los autos que pasan y en qué sentido; la del ingreso (C1) cuenta los que entran, qué tipo de vehículo son y cuánto se quedan. <b>La diferencia es la tasa de captación:</b> cuántos de los que pasan eligen esta estación. Lo que es estimación lleva la palabra «estimado» y su confianza.</div></div>

 <div class="mt">${panel('Lo que no se hace con la cámara',calleNoHtml(),{icon:'shield',right:src('decisión de producto')})}</div>
 <p class="note">Conteo con líneas virtuales sobre la imagen: una por mano en C6 y una de entrada y otra de salida en C1; el tipo de vehículo lo da el detector al cruzar la línea; marca, modelo y rango de años los estima un modelo de visión una vez por visita sobre el mejor cuadro de C1 y se publican solo como totales por semana, sin patente ni hora. Los litros vienen del controlador de surtidores. En producción: el motor GOTA Vision en un equipo dentro de la estación, con la precisión del mix validada a mano en el piloto antes de mostrar porcentajes; a la nube suben números, no video. Los números de esta pantalla son de ejemplo.</p>`};
