/* ---------- Playa e islas: espera por isla y turno, carga del controlador, fila y playeros visibles ---------- */
/* Cámaras C3 (isla 2) y C4 (playa) + controlador de surtidores. Isla 1 = surtidores 1 y 2; isla 2 = surtidores 3 y 4.
   Cada fuente mide lo suyo: la cámara mide presencia, espera y fila; el controlador, inicio y fin de cada despacho y los litros.
   Integración: D.playa=buildPlaya() en rebuild() (después de D.cv y D.hoses); V.playa=V_playa; Object.assign(ACT,ACT_PLAYA);
   exponer buildPlaya y playaQ en window.GOTA. */
const PLAYA_T=[['dia','Día completo',''],['man','Mañana','6 a 14 h'],['tar','Tarde','14 a 22 h'],['noc','Noche','22 a 6 h']];
const playaTurno=h=>h>=6&&h<14?'man':h>=14&&h<22?'tar':'noc';
const playaTn=t=>PLAYA_T.find(x=>x[0]===t)[1];
// Horas NO OBSERVABLE de ayer por cámara (coinciden con D.cv.health; en producción las marca el detector de calidad de imagen).
const PLAYA_NOOBS={C3:[7],C4:[16]};
// Caudal efectivo de un despacho sobre el nominal de la manguera (arranque, tope y goteo final).
const PLAYA_EFF=.6;
// Litros por despacho relativos al promedio: las camionetas diésel cargan más que los autos a nafta.
const PLAYA_K={super:.9,premium:.85,diesel:1.35,dpremium:1.45};
// Despachos por auto: quien carga dos productos o un bidón suma dos despachos (el mismo 2,4 % que ve Motor de visión al comparar cámara y controlador).
const PLAYA_MULTI=1.024;
// Cuantil con interpolación lineal (mediana: .5, p90: .9) sobre un arreglo no vacío.
const playaQ=(a,p)=>{const s=a.slice().sort((x,y)=>x-y),i=(s.length-1)*p,lo=Math.floor(i),hi=Math.min(lo+1,s.length-1);return s[lo]+(s[hi]-s[lo])*(i-lo)};
// Agrupa horas consecutivas en rangos [desde,hasta]; hourRanges() del HTML hace lo mismo pero devuelve texto.
const playaGrp=hs=>hs.reduce((r,h)=>{const l=r[r.length-1];if(l&&h===l[1]+1)l[1]=h;else r.push([h,h]);return r},[]);

function buildPlaya(){const g=RNG(4041),cv=D.cv,y=D.hist[D.hist.length-1],cars=[];
 // (a) Una espera por auto. La isla 1, cerca de la entrada, recibe más autos y espera más; de noche, con un solo playero, casi todos paran en la isla 1.
 //     La isla 1 la mide C4 y la isla 2, C3: cuando esa cámara está NO OBSERVABLE el auto no entra en la estadística (ni cero ni promedio relleno).
 cv.hrs.forEach(x=>{
  const share1=STAFF_NOW(x.h)===1?.85:PUMP_W[0]+PUMP_W[1];
  for(let i=0,n=Math.round(x.cars);i<n;i++){
   const isla=g.u()<share1?1:2,wait=x.wait*(isla===1?1.12:.8)*Math.exp(g.n()*.45);
   cars.push({h:x.h,isla,t:playaTurno(x.h),wait,obs:!PLAYA_NOOBS[isla===2?'C3':'C4'].includes(x.h)})}});
 const cell=(isla,t)=>{
  const a=cars.filter(c=>c.obs&&(isla==='todo'||c.isla===+isla)&&(t==='dia'||c.t===t)).map(c=>c.wait);
  return{n:a.length,med:a.length>=5?playaQ(a,.5):null,p90:a.length>=5?playaQ(a,.9):null}};
 const cells={};
 ['1','2','todo'].forEach(isla=>PLAYA_T.forEach(([t])=>{cells[isla+':'+t]=cell(isla,t)}));
 // (b) Controlador: litros del día por producto (los mismos de Stock); litros por despacho tales que los despachos sumen los autos que contó la cámara por PLAYA_MULTI;
 //     caudal nominal según las mangueras de ayer (los mismos datos de Mantenimiento) por el factor de despacho.
 const L=Object.fromEntries(PRODS.map(p=>[p.id,y.v[p.id]])),k=sum(PRODS.map(p=>L[p.id]/PLAYA_K[p.id]))/(cv.cars*PLAYA_MULTI),last=h=>h.flow[h.flow.length-1];
 const prods=PRODS.map(p=>{
  const hs=D.hoses.filter(h=>h.pid===p.id),lpd=PLAYA_K[p.id]*k,flow=sum(hs.map(last))/hs.length*PLAYA_EFF;
  return{id:p.id,n:p.short,desp:L[p.id]/lpd,lpd,flow,carga:lpd/flow*60}});
 const carga=sum(prods.map(p=>p.carga*p.desp))/cv.cars,cobro=Math.max(20,cv.fill-carga);
 const slow=D.hoses.reduce((a,b)=>b.drop<a.drop?b:a),peers=D.hoses.filter(h=>h.pid===slow.pid&&h!==slow),sp=prods.find(p=>p.id===slow.pid),ref=sum(peers.map(last))/peers.length;
 const hose={id:slow.id,s:slow.s,prod:PR[slow.pid].short,flow:last(slow),ref,lpd:sp.lpd,t:sp.lpd/(last(slow)*PLAYA_EFF)*60,tRef:sp.lpd/(ref*PLAYA_EFF)*60,desp:sp.desp*PUMP_W[slow.s-1]};
 // (c) Fila, (b2) rendimiento y (d) playeros visibles, por hora. Sin C4 no hay dato en esa hora.
 const hrs=cv.hrs.map(x=>{
  const obs=!PLAYA_NOOBS.C4.includes(x.h),Lh=sum(PRODS.map(p=>L[p.id]*hp(p.id)[x.h])),occMin=sum(x.occ)*60,prog=STAFF_NOW(x.h);
  const fila=Math.round(Math.min(59,Math.max(0,70*(x.rho-.7))*(1+.12*g.n())));
  const vis=obs?Math.max(1,prog-(x.h===7||x.h===8?.75:.15)+g.n()*.06):null;
  return{h:x.h,obs,cars:x.cars,L:Lh,occ:sum(x.occ)/4,prog,vis,perStaff:vis?x.cars/vis:null,
   rend:obs?Lh/occMin:null,fila:obs?fila:null,qmax:obs?(fila>40?3:fila>15?2:fila>0?1:0):null,
   free4:obs&&fila?Math.min(1,Math.max(0,1-x.occ[3]+g.n()*.05)):null}});
 const ob=hrs.filter(x=>x.obs),pk=ob.filter(x=>x.fila>15),rest=ob.filter(x=>x.fila<=15);
 const rend=a=>a.length?sum(a.map(x=>x.L))/sum(a.map(x=>x.L/x.rend)):null;
 return{cars,cells,prods,carga,cobro,salida:cv.out,hose,hrs,
  filaMin:sum(ob.map(x=>x.fila)),free4:pk.length?sum(pk.map(x=>x.free4*x.fila))/sum(pk.map(x=>x.fila)):null,
  occFila:pk.length?Math.min(...pk.map(x=>x.occ)):null,rendPk:rend(pk),rendRest:rend(rest)}}

/* (a) Espera hasta ser atendido: mediana y p90 por isla y por turno; celdas con menos de 5 autos: «sin dato por pocos casos». */
function playaEsperaHtml(){const P=D.playa,t=S.playaT,T=PLAYA_T.slice(1).concat([PLAYA_T[0]]),tt=t==='dia'?'tar':t;
 const a=P.cells['1:'+tt],b=P.cells['2:'+tt],nm=playaTn(tt).toLowerCase();
 const fc=c=>c.med==null
  ?`<span class="muted">${c.n?'sin dato por pocos casos':'sin dato'}</span><div class="sub">${c.n?`${c.n} auto${c.n===1?'':'s'}`:'ningún auto observado'}</div>`
  :`<b class="${c.med>90?'badc':''}">${mmss(c.med)}</b><div class="sub">p90 ${mmss(c.p90)} · ${num(c.n)} autos</div>`;
 const ISLAS=[['1','Isla 1','surtidores 1 y 2 · C4'],['2','Isla 2','surtidores 3 y 4 · C3'],['todo','Toda la playa','']];
 const head=ISLAS.map(([k,n,s])=>`<th class="r">${n}${s?`<div class="sub">${s}</div>`:''}</th>`).join('');
 const rows=T.map(([tk,n,s])=>
  `<tr class="${tk===t?'playa-on':''}"><td><b>${n}</b>${s?`<div class="sub">${s}</div>`:''}</td>${ISLAS.map(([k])=>`<td class="r num">${fc(P.cells[k+':'+tk])}</td>`).join('')}</tr>`).join('');
 const lectura=a.med!=null&&b.med!=null
  ?`<b>A la ${nm}, en la isla 1 se espera ${mmss(a.med)} (p90 ${mmss(a.p90)}) y en la isla 2, ${mmss(b.med)} (p90 ${mmss(b.p90)}).</b> ${a.med>b.med*1.25
   ?'La isla 2 tiene lugar: señalizar el surtidor 4 y que el playero de la isla 2 llame a los autos que esperan en la 1.'
   :'Las dos islas esperan parecido: el cuello de botella es la cantidad de playeros, no el reparto entre islas.'}`
  :`<b>A la ${nm} alguna celda tiene menos de 5 autos:</b> no se muestra mediana ni p90 para no sacar conclusiones de dos o tres autos.`;
 return `<div class="tbl-wrap flat"><table class="tbl" id="playaEspera" style="min-width:480px"><thead><tr><th>Turno</th>${head}</tr></thead><tbody>${rows}</tbody></table></div>
 <p class="small pad">${lectura} Mediana y p90 por isla y por turno, nunca por persona. La demo tiene cámara de 6 a 24 h: la noche son las 22 y las 23 h; de 0 a 6 h no hay registro.</p>`}

/* (b) Carga inicio → fin de despacho por producto (controlador), separada del cobro y la salida (cámara). */
function playaCargaHtml(){const P=D.playa,h=P.hose;
 const rows=P.prods.map(p=>`<tr><td><b>${p.n}</b></td><td class="r num">${num(p.desp)}</td><td class="r num">${lit(p.lpd)}</td><td class="r num">${mmss(p.carga)}</td><td class="r num">${num(p.flow,1)}</td></tr>`).join('');
 return `<div class="tbl-wrap flat"><table class="tbl" style="min-width:480px"><thead><tr><th>Producto</th><th class="r">Despachos</th><th class="r">L por despacho</th><th class="r">Carga inicio → fin</th><th class="r">Caudal L/min</th></tr></thead><tbody>${rows}</tbody></table></div>
 <div class="pad"><div class="kv2" style="max-width:420px;margin-top:0">
  <span>Carga · controlador</span><b>${mmss(P.carga)}</b>
  <span>Cobro · cámara C4 menos controlador</span><b>${mmss(P.cobro)}</b>
  <span>Salida · cámara C4</span><b>${mmss(P.salida)}</b>
  <span>Carga + cobro + salida</span><b>${mmss(P.carga+P.cobro+P.salida)}</b></div>
 <p class="small" style="margin-top:8px"><b>Cargar lleva ${mmss(P.carga)} en promedio; cobrar y salir, ${mmss(P.cobro+P.salida)}.</b> La manguera ${h.id} (${h.prod}, surtidor ${h.s}) despacha a ${num(h.flow,1)} L/min nominales contra ${num(h.ref,1)} las otras de ${h.prod}: ${lit(h.lpd)} le llevan ${mmss(h.t)} en vez de ${mmss(h.tRef)}, ${mmss(h.t-h.tRef)} más en cada uno de sus ${num(h.desp)} despachos por día. Coincide con la orden de trabajo de <a href="#mantenimiento">Mantenimiento</a>. Son ${num(sum(P.prods.map(p=>p.desp)))} despachos para ${num(D.cv.cars)} autos: quien carga dos productos o un bidón suma dos. La espera hasta ser atendido no entra acá: la mide la cámara.</p></div>`}

/* (b2) Rendimiento: litros del controlador por minuto de surtidor ocupado según la cámara, por hora. */
function playaRendHtml(){const P=D.playa,mx=Math.max(1,...P.hrs.map(x=>x.rend||0))*1.15;
 const items=P.hrs.map(x=>({v:x.rend||0,l:x.h%3?'':x.h+' h',cls:x.rend==null?'mute':x.fila>15?'bad':'',
  t:x.rend==null?`${x.h} h: sin dato (C4 NO OBSERVABLE)`:`${x.h} h: ${lit(x.L)} en ${num(x.L/x.rend)} min de surtidor ocupado: ${num(x.rend,1)} L/min`}));
 const lectura=P.rendPk!=null&&P.rendRest!=null
  ?`<b>En las horas con fila, cada minuto de surtidor ocupado rinde ${num(P.rendPk,1)} L; sin fila, ${num(P.rendRest,1)} L.</b> El caudal de las mangueras no cambia con la hora: en el pico el surtidor ocupado está esperando al playero o al cobro, no cargando. Cada minuto que se recorta del ciclo en el pico son más autos atendidos con los mismos surtidores.`
  :'<span class="muted">sin dato</span>: hace falta el controlador y la cámara en la misma hora.';
 return `<div class="pad">${barChart({label:'Litros despachados por minuto de surtidor ocupado, por hora',h:170,items,y0:0,y1:mx,yt:niceTicks(0,mx,3).map(v=>[v,num(v)+' L']),hlines:P.rendRest!=null?[{y:P.rendRest,cls:'ref',label:'horas sin fila'}]:[]})}
 <p class="small" style="margin-top:6px">${lectura} A las ${PLAYA_NOOBS.C4.join(' y ')} h la C4 estuvo NO OBSERVABLE y la hora queda en gris, sin promediar con las vecinas.</p></div>`}

/* (c) Fila en la playa: minutos con autos esperando una isla, máximo simultáneo y relación con la ocupación. */
function playaFilaHtml(){const P=D.playa,pk=P.hrs.filter(x=>x.fila>15),mxh=P.hrs.filter(x=>x.obs).reduce((a,b)=>b.fila>a.fila?b:a);
 const items=P.hrs.map(x=>({v:x.fila||0,l:x.h%3?'':x.h+' h',cls:x.fila==null?'mute':x.fila>15?'bad':x.fila>0?'warn':'',
  t:x.fila==null?`${x.h} h: sin dato (C4 NO OBSERVABLE)`:`${x.h} h: ${x.fila} min con fila, hasta ${x.qmax} auto${x.qmax===1?'':'s'} a la vez · ocupación media ${pcu(x.occ)}`}));
 const lectura=pk.length
  ?`<b>Hubo fila ${hourRanges(pk.map(x=>x.h)).join(' y ')}: ${num(sum(pk.map(x=>x.fila)))} minutos en total, con un máximo de ${mxh.fila} min y hasta ${mxh.qmax} autos esperando a las ${mxh.h} h.</b> La fila aparece cuando la ocupación media de los surtidores pasa del ${pcu(P.occFila)}${P.free4!=null
   ?`, y mientras hubo fila el surtidor 4 estuvo libre el ${pcu(P.free4)} del tiempo: la fila es de señalización, no de capacidad`:''}. Un cartel «Surtidor 4 libre» y que el playero de la isla 2 llame a los autos es la prueba más barata.`
  :'No hubo fila de más de 15 minutos en ninguna hora.';
 const accion=S.appr.playaSenal?pill('p-ok','Aviso enviado al encargado (simulado)'):`<button class="btn sm" data-act="playaAviso">${ic('send')}Avisar al encargado: señalizar el surtidor 4</button>`;
 return `<div class="pad">${barChart({label:'Minutos con autos esperando una isla, por hora',h:170,items,y0:0,y1:60,yt:[0,20,40,60].map(v=>[v,v+' min']),hlines:[{y:15,cls:'ref-bad',label:'más de 15 min: fila'}]})}
 <p class="small" style="margin-top:6px">${lectura}</p>
 <div class="row" style="margin-top:10px">${accion}</div></div>`}

/* (d) Playeros visibles (uniforme, cámara C4, promedio por hora, sin nombres) contra autos atendidos, filtrado por el turno elegido. */
function playaStaffHtml(){const P=D.playa,t=S.playaT,rows=P.hrs.filter(x=>t==='dia'||playaTurno(x.h)===t);
 const st=x=>x.perStaff==null?null:x.perStaff>ATT*1.25?'bad':x.perStaff>ATT?'warn':'ok';
 const bad=P.hrs.filter(x=>st(x)==='bad'),w=bad.length?bad.reduce((a,b)=>b.perStaff>a.perStaff?b:a):null;
 const rg=playaGrp(bad.map(x=>x.h)),rw=w?rg.find(r=>w.h>=r[0]&&w.h<=r[1]):null,inR=rw?bad.filter(x=>x.h>=rw[0]&&x.h<=rw[1]):[];
 const vis=inR.length?sum(inR.map(x=>x.vis))/inR.length:0,cars=inR.length?sum(inR.map(x=>x.cars))/inR.length:0,prog=inR.length?inR[0].prog:0;
 const others=rg.filter(r=>r!==rw).map(([a,b])=>`de ${a} a ${b+1} h`);
 const tr=rows.map(x=>{const s=st(x);
  return `<tr><td><b>${x.h} a ${x.h+1} h</b></td><td class="r num">${x.vis==null?'<span class="muted">sin dato</span>':num(x.vis,1)}</td><td class="r num">${x.prog}</td><td class="r num">${num(x.cars)}</td><td class="r num ${s==='bad'?'badc':s==='warn'?'warnc':''}">${x.perStaff==null?'<span class="muted">sin dato</span>':num(x.perStaff)}</td><td>${s==null?pill('p-mute','NO OBSERVABLE'):s==='bad'?pill('p-bad','Falta gente'):s==='warn'?pill('p-warn','Justo'):pill('p-ok','Alcanza')}</td></tr>`}).join('');
 const lectura=rw
  ?`<b>De ${rw[0]} a ${rw[1]+1} h hay ${num(vis,1)} ${Math.abs(vis-1)<.05?'playero visible':'playeros visibles'} para ${num(cars)} autos por hora</b> (${num(cars/vis)} por playero, contra los ${ATT} que supone <a href="#personal">Personal</a>)${others.length?`; también falta gente ${others.join(' y ')}`:''}. ${vis<prog-.4
   ?`La grilla dice ${prog} y la cámara ve ${num(vis,1)}. Faltan playeros a la vista en esa hora: revisá la grilla y las tareas de la hora (descarga, tienda) con el encargado. No sirve para sancionar a nadie.`
   :'Mover media hora del turno tarde al pico o sumar un refuerzo de media jornada: ver <a href="#personal">Personal</a>.'}`
  :'En todas las horas observadas hubo playeros suficientes para los autos atendidos.';
 return `<div class="tbl-wrap flat"><table class="tbl" id="playaStaff" style="min-width:600px"><thead><tr><th>Hora</th><th class="r">Playeros visibles</th><th class="r">Programados</th><th class="r">Autos atendidos</th><th class="r">Autos por playero y hora</th><th>Lectura</th></tr></thead><tbody>${tr}</tbody></table></div>
 <p class="small pad">${lectura} Conteo de uniformes por la cámara C4, promedio por hora, sin nombres ni reconocimiento facial: los tiempos se miden por isla y por turno, nunca por persona, y no sirven para sancionar.</p>`}

 ${panel('Ocupación de cada surtidor, ayer',`${pumpHeat(cv.hrs)}<p class="small pad">El surtidor 1 se satura en el pico y el 4 casi no se usa: está lejos de la entrada. <b>Sugerencia:</b> señalizar el surtidor 4 y que el playero de la isla 2 haga pasar a los autos.</p>`,{icon:'fuel',right:src('cámara C4',c4[1])})}</div>

/* Datos nuevos: buildSec() → D.sec (semilla 6061). Reusa D.cv.rules, D.cv.health, D.street.hrs, D.ev, LPR, CAMS, camOf,
   cvRulesHtml, lprTable y evItem. Estado de UI: S.secCam (cámara) y S.secEst (estado del evento). */

/* datos: 7 días por regla a partir de D.cv.rules (ayer), patentes en C1 a partir de los autos que entran (D.street.hrs) */
function buildSec(){const g=RNG(6061),cv=D.cv,st=D.street,week=[],band=SEC_BANDS.map(([a,b,l])=>({a,b,l,avisos:0,pend:0}));
 cv.rules.forEach(r=>{let avisos=0;for(let d=0;d<7;d++)avisos+=Math.max(0,Math.round(r.det*(.7+.6*g.u())));
  const noche=Math.round(avisos*(SEC_NIGHT[r.id]??.05)),dia=avisos-noche;
  const pendN=Math.round(noche*(.5+.15*g.u())),pendD=Math.round(dia*(.04+.04*g.u())),pend=pendN+pendD,res=avisos-pend;
  const p=r.ok+r.fp?r.ok/(r.ok+r.fp):.7,ok=Math.round(res*p),fp=res-ok;
  const med=res?Math.max(1,Math.round((SEC_MED[r.id]||8)*(.85+.3*g.u()))):null; // sin avisos resueltos no hay mediana: sin dato
  week.push({id:r.id,n:r.n,cam:r.cam,avisos,ok,fp,pend,pendN,pendD,noche,dia,med});
  band[0].avisos+=noche;band[0].pend+=pendN;
  [.3,.35,.35].forEach((k,i)=>{band[i+1].avisos+=dia*k;band[i+1].pend+=pendD*k})});
 const tot=k=>sum(week.map(w=>w[k]));
 const T={avisos:tot('avisos'),ok:tot('ok'),fp:tot('fp'),pend:tot('pend')},noche={avisos:tot('noche'),pend:tot('pendN')},dia={avisos:tot('dia'),pend:tot('pendD')};
 const worst=week.slice().sort((a,b)=>b.pendN-a.pendN)[0];
 /* patentes en C1: la calle da los autos que entran de 6 a 23 h; la madrugada se agrega. De noche, sin infrarrojo, la lectura cae */
 const hrs=[...Array(24).keys()].map(h=>{const x=st.hrs.find(r=>r.h===h),cars=x?x.enter:2+Math.round(g.u()*4),night=h>=21||h<6;
  const noObs=night?.42+.08*g.u():.01,leg=night?.3+.1*g.u():.9+.06*g.u();
  return{h,cars,night,noObs:cars*noObs,leg:cars*(1-noObs)*leg}});
 const lpr={hrs,plates:sum(hrs.map(x=>x.cars)),legible:sum(hrs.map(x=>x.leg)),noObs:sum(hrs.map(x=>x.noObs)),
  match:(cv.rules.find(r=>r.id==='fuga')||{det:0}).det,matchHoy:D.ev.filter(e=>e.type==='Patente en la lista de fugas').length,
  chk:[{t:'Ancho de la placa en la imagen ≥ 130 px',v:'142 px (mediana de ayer)',ok:true},
   {t:'Ángulo entre la cámara y la placa < 30°',v:'24°',ok:true},
   {t:'Iluminador infrarrojo para la noche',v:'No instalado: de 21 a 6 h la lectura queda NO OBSERVABLE',ok:false},
   {t:'Obturador rápido (sin barrido con el auto en movimiento)',v:null,ok:null}]};
 return{week,band,tot:T,noche,dia,worst,lpr}}

const secCov=()=>SEC_CAMS.map(id=>{const h=D.cv.health.find(x=>x[0]===id);return h?`${id} ${pcu(h[1])}`:`${id} sin dato`}).join(' · ');

const tiendaSplit=(tot,w)=>{const r=w.map(v=>Math.round(tot*v)),d=Math.round(tot)-sum(r);r[0]+=d;return r};
const tiendaND='<span class="muted">sin dato</span>',tiendaNDP='<span class="muted">sin dato por pocos casos</span>';

function buildStore(){const g=RNG(5051),cv=D.cv;
 // Por hora. Entran (C2, línea de la puerta) = quienes vienen de la playa (el 26 % del embudo; más a la mañana por el café, menos en el pico de la playa)
 // + quienes llegan de a pie o en moto (café temprano, kiosco de noche). Tickets (POS) = entradas × conversión: alta temprano, baja de 20 a 22 h y cuando hay fila en la caja.
 const hrs=cv.hrs.map(x=>{const h=x.h,q=tiendaQueue(h);
  const kin=.26*(1+.6*Math.exp(-((h-8.5)**2)/2.5)-.3*Math.exp(-((h-18.5)**2)/1.5))*(1+g.n()*.05);
  const walk=Math.max(0,2.2+1.8*Math.exp(-((h-8.5)**2)/2)+2.6*Math.exp(-((h-20.5)**2)/3)+g.n()*.5),ppl=x.cars*kin+walk;
  const conv=Math.min(.95,Math.max(.4,.8+.1*Math.exp(-((h-7.5)**2)/2)-.25*Math.exp(-((h-20.5)**2)/2)-.012*Math.max(0,q-3)+g.n()*.03));
  // Abandono de la fila (estimado): más cuando la espera en caja pasa de 5 min.
  return{h,cars:x.cars,ppl,walk,tk:ppl*conv,wc:ppl*TIENDA_WC,q,ab:ppl*(q>5?.1:q>3?.03:.004)}});
 const ppl=sum(hrs.map(x=>x.ppl)),tk=sum(hrs.map(x=>x.tk)),wc=sum(hrs.map(x=>x.wc)),ab=sum(hrs.map(x=>x.ab)),conv=ppl?tk/ppl:null;
 // Pico: la hora con más entradas, abierta en cuartos de 15 min (agregado por franja, nunca por persona).
 const pk=hrs.reduce((a,b)=>b.ppl>a.ppl?b:a),wq=[.45,.28,.16,.11],qp=tiendaSplit(pk.ppl,wq),qt=tiendaSplit(pk.tk,wq);
 const q=qp.map((p,i)=>({m:i*15,ppl:p,tk:Math.min(p,qt[i])}));
 // Oportunidad: horas con muchas visitas (al menos la mitad del pico) y pocos tickets (menos del 88 % de la conversión del día).
 const opp=conv?hrs.filter(x=>x.ppl>=pk.ppl*.5&&x.tk/x.ppl<conv*.88).map(x=>x.h):[];
 // Permanencia puerta a puerta: muestra determinista de visitas; quien compra ronda 3:20 y quien no, 1:10. El 84 % de los recorridos llega completo; el resto se pierde entre góndolas y se excluye.
 const samp=(k,m,s)=>{const a=[];for(let i=0;i<k;i++)a.push(Math.max(15,Math.exp(Math.log(m)+g.n()*s)));return a.sort((x,y)=>x-y)};
 const qf=(a,p)=>a.length?a[Math.min(a.length-1,Math.floor(p*a.length))]:null;
 const nb=Math.round(tk),db=samp(nb,200,.45),dn=samp(Math.max(0,Math.round(ppl)-nb),70,.6),da=db.concat(dn).sort((x,y)=>x-y);
 const dwell={med:qf(da,.5),p90:qf(da,.9),buy:qf(db,.5),no:qf(dn,.5),full:.84};
 // POS por categoría y franja: tickets con la categoría = tickets de la franja × (pasan × compran de la góndola, por ticket) × peso de la franja; unidades e importe con los supuestos de TIENDA_CAT.
 const cats=TIENDA_CAT.map((c,i)=>{const gd=GOND.find(x=>x.n===c.n)||GOND[i];
  const fr=[0,1,2,3].map(fi=>{const t=sum(hrs.filter(x=>tiendaFrOf(x.h)===fi).map(x=>x.tk*Math.min(.95,gd.p*gd.c/.8*c.f[fi])));return{tk:t,un:t*c.u,imp:t*c.u*c.pr}});
  return{n:c.n,pr:c.pr,u:c.u,fr,tk:sum(fr.map(f=>f.tk)),un:sum(fr.map(f=>f.un)),imp:sum(fr.map(f=>f.imp))}});
 const tkp=tk?sum(cats.map(c=>c.imp))/tk:0;
 // Interés sin compra en plata: si una góndola convirtiera (compran ÷ toman) al promedio de la tienda, cuántas compras más por día y cuánto margen más por mes
 // (ticket de la categoría = precio × unidades; margen TIENDA_MG; 30 días).
 const rbar=sum(GOND.map(x=>x.p*x.c))/sum(GOND.map(x=>x.p*x.t));
 const gain=GOND.map(x=>{const c=TIENDA_CAT.find(y=>y.n===x.n),tkc=c?c.pr*c.u:0,extra=ppl*x.p*Math.max(0,x.t*rbar-x.c);
  return{n:x.n,r:x.t?x.c/x.t:null,tkc,extra,mes:extra*30*tkc*TIENDA_MG}}).sort((a,b)=>b.mes-a.mes);
 return{hrs,ppl,walk:sum(hrs.map(x=>x.walk)),tk,wc,look:ppl-tk-wc,conv,ab,tkp,pk:{h:pk.h,ppl:pk.ppl,tk:pk.tk,q},opp,dwell,cats,rbar,gain}}

/* filas de categorías del POS para una franja (también se usa en las pruebas) */
function storeCatRows(fid){const f=TIENDA_FR.find(x=>x.id===fid)||TIENDA_FR[0],fis=[0,1,2,3].filter(i=>f.id==='dia'||TIENDA_FR[i+1].id===f.id);
 return D.store.cats.map(c=>{const tk=sum(fis.map(i=>c.fr[i].tk)),un=sum(fis.map(i=>c.fr[i].un)),imp=sum(fis.map(i=>c.fr[i].imp));return{n:c.n,tk,un,imp,ok:tk>=TIENDA_MIN}})}

/* datos: todo sale de D.cv y D.hist con semilla fija; lo que no se midió queda null («sin dato») */
function buildMotor(){const g=RNG(7071),cv=D.cv,days=D.hist.slice(-7),kS=2,inst=addH(addD(TODAY,-47),11);
 // (d) precisión y cobertura de revisión por regla en los últimos 7 días (D.sec.week, el mismo dato de Seguridad); sin ese módulo, ayer (D.cv.rules).
 //     Con menos de MOTOR_MIN revisiones no se publica porcentaje.
 const wk=D.sec&&D.sec.week,win=wk?'7 días':'ayer';
 const rules=cv.rules.map(r=>{const w=wk?wk.find(x=>x.id===r.id):null,ok=w?w.ok:r.ok,fp=w?w.fp:r.fp,det=w?w.avisos:r.det,rev=ok+fp;
  return{id:r.id,n:r.n,cam:r.cam,det,ok,fp,rev,cov:det?rev/det:null,p:rev>=MOTOR_MIN?ok/rev:null}});
 const rev=sum(rules.map(r=>r.rev)),okT=sum(rules.map(r=>r.ok)),det=sum(rules.map(r=>r.det));
 // cámara contra controlador, 7 días: autos atendidos (C3 y C4) contra despachos. Ayer la cámara es D.cv.cars; los otros días, litros de 6 a 24 h ÷ CAR_L.
 // Un auto que carga dos productos o un bidón suma dos despachos: lo normal es que la cámara cuente 1 a 3 % menos. El día kS la C4 se corrió y contó de menos.
 const drift=days.map((x,i)=>{const base=i===6?cv.cars:sum(PRODS.map(p=>x.v[p.id]*sum(hp(p.id).slice(6))))/CAR_L,cam=i===6?base:base*(i===kS?.93:1)*(1+g.n()*.004),nz=g.n(),ctl=i===6&&D.playa?sum(D.playa.prods.map(p=>p.desp)):base*(1.018+nz*.005);
  return{d:x.d,cam,ctl,dev:cam/ctl-1}});
 // cámaras: lo configurado, la última calibración (C4 se redibujó la mañana siguiente al desvío) y el desplazamiento del fondo contra la referencia (estimado)
 const cams=MOTOR_ZONAS.map(c=>{const mov=c.id==='C6'?.028+g.u()*.004:.002+g.u()*.005,re=c.id==='C4';
  return{id:c.id,n:c.nombre,zones:(c.zonas||[]).length,lines:(c.lineas||[]).length,rules:(c.reglas||[]).length,cal:re?addH(days[kS+1].d,10.5):inst,why:re?'controlador':'instalación',mov,conf:.78+g.u()*.1,moved:mov>MOTOR_MOV,since:mov>MOTOR_MOV?addH(days[5].d,17.3):null}});
 // confianza media del detector por cámara y clase, de día y de noche; null = la cámara no busca esa clase
 const conf=CAMS.map(c=>{const m=MOTOR_CONF[c.id]||{k:1,c:{}};return{id:c.id,cells:Object.fromEntries(MOTOR_CLS.map(([k])=>[k,m.c[k]==null?null:{d:m.c[k]+g.n()*.004,nt:m.c[k]*m.k+g.n()*.004}]))}});
 // velocidad: supuestos de hardware; atributos = una consulta por auto atendido
 const pk=cv.hrs.reduce((a,b)=>b.cars>a.cars?b:a);
 return{rules,win,prec:{rev,ok:okT,det,p:rev>=MOTOR_MIN?okT/rev:null,cov:det?rev/det:null},drift,kS,cams,conf,
  speed:{fps:10,cams:CAMS.length,aud:4/2.5,attr:cv.cars,attrPk:pk.cars,attrH:pk.h},legal:{ok:MOTOR_LEGAL.filter(x=>x.ok).length,n:MOTOR_LEGAL.length}}}

function motorSvg(c,st){const W=480,H=270,f=v=>v.toFixed(1),T=(x,y,t,a='middle',k='')=>`<text x="${f(x)}" y="${f(y)}" text-anchor="${a}"${k?` class="${k}"`:''}>${esc(t)}</text>`;
 let s=`<svg class="motor-svg" id="motorSvg" data-cam="${c.id}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(`Cámara ${c.id}, ${c.nombre}: ${(c.zonas||[]).length} zonas y ${(c.lineas||[]).length} líneas configuradas`)}">
 <defs><radialGradient id="motorVig" cx="50%" cy="45%" r="75%"><stop offset="0" stop-color="#28312c"/><stop offset="1" stop-color="#0b0e0d"/></radialGradient><pattern id="motorScan" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="1" fill="rgba(255,255,255,.035)"/></pattern></defs>
 <rect width="${W}" height="${H}" fill="url(#motorVig)"/><rect width="${W}" height="${H}" fill="url(#motorScan)"/>`;
 (c.zonas||[]).forEach(z=>{const p=z.poligono,cx=sum(p.map(q=>q[0]))/p.length*W,cy=sum(p.map(q=>q[1]))/p.length*H;
  s+=`<polygon class="motor-zona" points="${p.map(q=>f(q[0]*W)+','+f(q[1]*H)).join(' ')}" fill="rgba(77,163,255,.18)" stroke="#4da3ff" stroke-width="2" stroke-linejoin="round"/>`+T(cx,cy+4,z.id,'middle','motor-z')});
 // línea de conteo: la flecha apunta al lado que cuenta como «entra» (izquierda/derecha del segmento a→b, como en geometry.side)
 (c.lineas||[]).forEach(l=>{const ax=l.a[0]*W,ay=l.a[1]*H,bx=l.b[0]*W,by=l.b[1]*H,L=Math.hypot(bx-ax,by-ay)||1,k=l.entra==='derecha'?-1:1,nx=-(by-ay)/L*k,ny=(bx-ax)/L*k,mx=(ax+bx)/2,my=(ay+by)/2,tx=mx+nx*20,ty=my+ny*20,hz=Math.abs(nx)>.5;
  s+=`<line class="motor-linea" x1="${f(ax)}" y1="${f(ay)}" x2="${f(bx)}" y2="${f(by)}" stroke="#ffd60a" stroke-width="2.5" stroke-dasharray="8 6"/><path d="M${f(mx)} ${f(my)}L${f(tx)} ${f(ty)}" stroke="#ffd60a" stroke-width="2"/><path d="M${f(tx+nx*7)} ${f(ty+ny*7)}L${f(tx-ny*5)} ${f(ty+nx*5)}L${f(tx+ny*5)} ${f(ty-nx*5)}Z" fill="#ffd60a"/>`
   +T(mx-nx*11,my-ny*11+4,l.id,nx<-.5?'start':nx>.5?'end':'middle','motor-l')+(hz?T(tx+nx*12,ty+4,'entra',nx<0?'end':'start','motor-dim'):T(mx+9,my+ny*12+4,'entra','start','motor-dim'))});
 s+=`<circle cx="16" cy="16" r="4" fill="#ff3b30"/>`+T(26,20,`${c.id} · ${c.nombre}`,'start')+T(12,38,`Imagen de referencia: ${fDay(st.cal)}`,'start','motor-dim');
 if(st.moved)s+=`<rect x="3" y="3" width="${W-6}" height="${H-6}" rx="9" fill="none" stroke="#ff9f0a" stroke-width="2" stroke-dasharray="10 7"/>`+T(W-12,20,'Posible cámara movida (estimado)','end','motor-warn');
 return s+'</svg>'}

/* ---------- Detalle por cámara: qué intenta identificar la IA, recorridos, tendencias, predicción y recomendaciones ----------
   Cada cámara declara su ficha en CAMDET.Cn (bloques «cámara Cn», contrato en CAMDET-CONTRACT.md). Este núcleo:
   - calcula los recorridos del clip real (media/deteccion.js) con las mismas zonas, líneas y punto de apoyo que el motor;
   - analiza series diarias de 28 días: tendencia (Mann-Kendall y pendiente de Sen sobre la serie sin el efecto del día de la semana),
     cambio de nivel (CUSUM, solo si un escalón explica mejor que una recta), predicción (Holt-Winters aditivo semanal con intervalo
     del 80 % y error medido sobre las 2 últimas semanas) y si ayer se salió de lo esperado;
   - arma la ficha. Todos los números salen de acá o de D; los textos solo los citan. */
const CAMDET={},CD_N=28,CD_MIN=14,CD_P=.05;
const cdAvg=a=>a.length?sum(a)/a.length:null;
const cdVar=a=>{const m=cdAvg(a);return a.length>1?sum(a.map(v=>(v-m)**2))/(a.length-1):0};
function cdErf(x){const s=Math.sign(x),t=1/(1+.3275911*Math.abs(x));return s*(1-((((1.061405429*t-1.453152027)*t+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x))}
const cdPhi=z=>.5*(1+cdErf(z/Math.SQRT2));
/* quita el efecto del día de la semana: a cada posición (i mod 7) le resta su desvío medio */
function cdDeseason(y,p=7){const m=cdAvg(y),idx=[...Array(p)].map((_,k)=>cdAvg(y.filter((_,i)=>i%p===k))-m);return y.map((v,i)=>v-idx[i%p])}
/* Mann-Kendall: ¿la serie sube o baja de forma sostenida? p a dos colas con aproximación normal (sin empates: valores continuos) */
function cdMK(y){const n=y.length;let S=0;for(let i=0;i<n-1;i++)for(let j=i+1;j<n;j++)S+=Math.sign(y[j]-y[i]);
 const v=n*(n-1)*(2*n+5)/18,z=S>0?(S-1)/Math.sqrt(v):S<0?(S+1)/Math.sqrt(v):0;return{S,z,p:2*(1-cdPhi(Math.abs(z)))}}
/* pendiente de Sen: mediana de las pendientes entre todos los pares (robusta a días raros) */
function cdSen(y){const s=[];for(let i=0;i<y.length-1;i++)for(let j=i+1;j<y.length;j++)s.push((y[j]-y[i])/(j-i));s.sort((a,b)=>a-b);const m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2}
function cdTrend(y){if(!y||y.length<CD_MIN||y.some(v=>v==null||!isFinite(v)))return{ok:false,n:y?y.length:0};
 const ds=cdDeseason(y),mk=cdMK(ds),sen=cdSen(ds),m=cdAvg(y),l7=cdAvg(y.slice(-7)),p7=cdAvg(y.slice(-14,-7));
 return{ok:true,n:y.length,mean:m,sen,sem:sen*7,pct:m?sen*7/m:null,z:mk.z,p:mk.p,dir:mk.p<CD_P?(sen>0?'sube':'baja'):'estable',l7,p7,r7:p7?l7/p7-1:null}}
/* Holt-Winters aditivo con estación semanal. La serie termina ayer: fc[0] es hoy y fc[1], mañana. Devuelve h días de pronóstico con intervalo del 80 %, el error típico (MAPE de las
   predicciones a un día de las 2 últimas semanas) y cuánto se apartó ayer de lo que el modelo esperaba (en desvíos). */
function cdHW(y,h=7,p=7,al=.3,be=.05,ga=.3){const n=y?y.length:0;if(n<2*p+3)return null;

 cdReco:el=>{S.cdReco??={};const k=el.dataset.k,v=el.dataset.v,[id,rid]=k.split(':'),A=cdAnalyze(id),r=A&&A.recos.find(x=>x.id===rid);S.cdReco[k]=v;
  if(v==='ok'&&r&&r.unaVez){log(`Visión ${id}: hecho · ${r.t}`);toast(`Marcado como hecho en ${id}: queda en el registro de decisiones`)}

/* >>> cámara C1 */
/* C1 · Ingreso: qué autos entran, cuánto se quedan y qué hacen adentro. La única cámara que lee patentes: solo a los que entran,
   como hash con sal contra la lista de fugas con denuncia. Números de «ayer» iguales a Calle y acceso (D.street, D.traffic) y Seguridad (D.sec). */
// margen por litro ponderado por volumen: la misma fórmula que Calle y acceso (streetHtml)
const cdC1_mgL=()=>sum(PRODS.map(p=>S.P.p[p.id].vol*(S.P.p[p.id].precio-S.P.p[p.id].costo)))/sum(PRODS.map(p=>S.P.p[p.id].vol));
const cdC1_mg=id=>S.P.p[id].precio-S.P.p[id].costo;
// «más de 8 años» entre los clasificados, 7 días: lo mismo que calleAgeHtml («X de cada 10 tendrían más de 8 años») = (9 a 15 + más de 15) ÷ (1 − sin dato)
const cdC1_old=()=>{const a=D.traffic.age;return sum(a.rows.slice(2).map(r=>r.share))/(1-a.sc)};
const cdC1_ayerDia=()=>D.traffic.days[D.traffic.days.length-1];
// tracks del clip que cruzaron la línea l en el sentido s: el contador del motor suma uno por track
const cdC1_cuenta=(J,l,s)=>J.filter(j=>j.cr.some(c=>c.l===l&&c.sentido===s)).length;
const cdC1_pl=(n,a,b)=>`${num(n)} ${n===1?a:b}`;
const cdC1_hm=min=>{const m=Math.round(min)%(24*60);return `${pad(Math.floor(m/60))}:${pad(m%60)}`};
const cdC1_draw=(g,arr)=>{let u=g.u()*sum(arr.map(x=>x[1]));for(const x of arr){u-=x[1];if(u<=0)return x[0]}return arr[arr.length-1][0]};
// reparto entero de n casos según pesos (mayores restos): la muestra respeta las proporciones del día
const cdC1_quota=(w,n)=>{const t=sum(w)||1,raw=w.map(x=>x/t*n),q=raw.map(Math.floor);raw.map((x,i)=>[x-q[i],i]).sort((x,y)=>y[0]-x[0]).slice(0,n-sum(q)).forEach(([,i])=>q[i]++);return q};
const cdC1_rep=(q,vals)=>q.flatMap((k,i)=>Array(k).fill(vals[i]));
const cdC1_shuf=(g,a)=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(g.u()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
// cuantiles de la normal para 12 casos: las estadías de la muestra tienen la mediana y el p90 del día
const cdC1_Z=[-1.73,-1.15,-.81,-.55,-.32,-.1,.1,.32,.55,.81,1.15,1.73];
/* muestra determinista de ayer: 12 vehículos con las proporciones del día. Hora: muestreo sistemático sobre los autos que entraron por hora (D.street);
   tipo: reparto del día (D.traffic); marca y antigüedad: reparto de la semana; estadía: mediana y p90 del tipo; playa: espera + carga y cobro + salida
   de esa hora (D.cv); salida no vista y «se fue sin cargar»: proporción del día; patente: lo que pasó ayer en esa hora (D.sec.lpr). Ejemplo, no recorridos reales. */
function cdC1_rows(){const N=cdC1_Z.length,g=RNG(9150),st=D.street,d=cdC1_ayerDia(),b=D.traffic.brands,a=D.traffic.age,L=D.sec.lpr,cv=D.cv,sig=Math.log(1.75)/1.2816,seg={auto:/auto/,suv:/camioneta|SUV/};
 const tot=sum(st.hrs.map(x=>x.enter));let c=0;const cum=st.hrs.map(x=>[x.h,c+=x.enter]);
 const T=[...Array(N)].map((_,i)=>{const h=cum.find(x=>x[1]>=(i+.5)/N*tot)[0];return h*60+Math.floor(g.u()*60)}).sort((x,y)=>x-y);T.forEach((t,i)=>{if(i&&t<=T[i-1])T[i]=T[i-1]+1});
 const tps=cdC1_shuf(g,cdC1_rep(cdC1_quota(CALLE_T.map(t=>d.mix[t.id]),N),CALLE_T)),scT=tps.filter(t=>t.id==='sc').length;
 const known=cdC1_shuf(g,tps.map((t,i)=>t.id==='sc'?-1:i).filter(i=>i>=0)),scB=new Set(known.slice(0,Math.max(0,Math.round(N*b.sc)-scT)));
 const ages=cdC1_shuf(g,cdC1_rep(cdC1_quota(a.rows.map(r=>r.share),N-scT-scB.size),a.rows.map(r=>r.r)));
 const nAb=Math.round(N*(st.enter?cv.ab/st.enter:0)),nNo=Math.max(0,N-nAb-Math.round(N*d.done)),fl=cdC1_shuf(g,[...Array(N)].map((_,i)=>i<nAb?'ab':i<nAb+nNo?'no':'ok')),zs=cdC1_shuf(g,cdC1_Z.slice());
 const pr=T.map(t=>{const x=L.hrs.find(r=>r.h===Math.floor(t/60));return x&&x.cars?[x.noObs/x.cars,x.leg/x.cars]:[0,1]});
 const nNoObs=Math.round(sum(pr.map(x=>x[0]))),nIleg=Math.round(sum(pr.map(x=>1-x[0]-x[1]))),byNight=pr.map((x,i)=>[x[0],i]).sort((x,y)=>y[0]-x[0]).map(x=>x[1]);
 const pat=Array(N).fill('leg');byNight.slice(0,nNoObs).forEach(i=>pat[i]='noobs');cdC1_shuf(g,byNight.slice(nNoObs)).slice(0,nIleg).forEach(i=>pat[i]='ileg');
 let ai=0;
 return T.map((t0,i)=>{const h=Math.floor(t0/60),sh=st.hrs.find(x=>x.h===h),tp=tps[i];
  const nro=Math.round(sum(st.hrs.filter(x=>x.h<h).map(x=>x.enter))+sh.enter*(t0%60)/60)+1;
  // marca y modelo: solo modelos compatibles con el tipo (camioneta o SUV, auto); el resto, «otro modelo identificado»
  let mod=null,age=null;
  if(tp.id!=='sc'&&!scB.has(i)){const ok=seg[tp.id]?b.models.filter(x=>seg[tp.id].test(x.seg)):[];mod=ok.length?cdC1_draw(g,[...ok.map(x=>[x,x.share]),['otro',b.other]]):'otro';age=ages[ai++]}
  const cvh=cv.hrs.find(x=>x.h===h),dw=d.dwell[tp.dw?tp.id:'auto'],ab=fl[i]==='ab';
  let dur=dw.med*Math.exp(sig*zs[i]),pl=(cvh.wait+cvh.fill+cvh.out)*(.85+.3*g.u());
  if(ab){pl=cvh.wait*(1+.3*g.u());dur=pl+30+30*g.u()}
  if(pl>dur*.95)pl=dur*(.6+.3*g.u());
  return{nro,t0,tp,mod,age,dur,pl,seen:fl[i]!=='no',aban:ab,pat:pat[i]}})}
function cdC1_ayer(){const st=D.street,d=cdC1_ayerDia(),L=D.sec.lpr,b=D.traffic.brands,rows=cdC1_rows();
 const que=r=>{const rest=r.dur-r.pl;if(r.aban)return `Estuvo ${mmss(r.pl)} en la playa y salió: posible «se fue sin cargar» (lo confirma C4)`;
  if(!r.seen)return `Playa ${mmss(r.pl)}; la salida no se vio`;
  return rest>300?`Playa ${mmss(r.pl)}; después ${mmss(rest)} fuera de la playa`:`Playa ${mmss(r.pl)} y salió`};
 const veh=r=>r.tp.id==='sc'?'<span class="muted">tipo sin clasificar</span>':r.tp.n;
 const pat={leg:'Comparada como hash: no está en la lista',ileg:'<span class="muted">Ilegible (confianza menor a '+pcu(SEC_UMBRAL)+'): no se compara</span>',noobs:'<span class="badc">NO OBSERVABLE: falta luz</span>',nd:'<span class="muted">sin dato</span>'};
 const cars=d.dwell.auto,legR=L.plates?L.legible/L.plates:null;
 return{cols:['Vehículo','Entró → salió','En la estación','Qué hizo adentro','Tipo','Patente vs. lista de fugas'],
  rows:rows.map(r=>[`<b>v${r.nro}</b>`,r.seen?`${cdC1_hm(r.t0)} → ${cdC1_hm(r.t0+r.dur/60)}`:`${cdC1_hm(r.t0)} → <span class="muted">sin dato</span>`,
   r.seen?`<b>${mmss(r.dur)}</b>`:'<span class="muted">sin dato</span>',que(r),veh(r),pat[r.pat]]),
  resumen:`Ayer entraron <b>${num(st.enter)} autos de 6 a 24 h</b> (Calle y acceso) y ${num(L.plates)} contando la madrugada (Seguridad). Camionetas, utilitarios y camiones: <b>${pcu(callePick(d))}</b> de los que entraron. La mitad de los autos estuvo menos de <b>${mmss(cars.med)}</b> en la estación y uno de cada diez, más de ${mmss(cars.p90)} (C1 les vio entrada y salida al ${pcu(d.done)}). Patentes legibles: ${legR==null?'<span class="muted">sin dato</span>':`${num(L.legible)} (${pcu(legR)})`}; coincidencias con la lista de fugas: <b>${num(L.match)}</b> ayer. Marca y modelo sin clasificar en la semana: ${pcu(b.sc)}.`,
  nota:`El tipo lo da el detector al cruzar «entrada». Marca, modelo y antigüedad no se guardan por vehículo: se publican sumados por semana en Calle y acceso. La patente se compara como hash con la lista de fugas con denuncia y no se muestra: en esta tabla no hay ninguna. Playa = espera, carga y cobro.`,minW:860}}

CAMDET.C1={
 titulo:'qué autos entran, cuánto se quedan y qué hacen',
 modulo:'calle',
 modelo:'YOLOv8n detecta los vehículos y el tracker GOTA les da un número anónimo que dura lo que dura la visita. Dos líneas cuentan cruces con sentido («entrada», en el acceso, y «calle», frente al ingreso) y la zona «playa» suma segundos sobre los surtidores. Un modelo de visión y lenguaje (VLM) mira una sola vez el mejor cuadro de cada vehículo y estima tipo, marca, modelo y rango de años, cada uno con su confianza. El lector de patentes corre solo en esta cámara y todavía está en piloto (falta validar un lector dedicado): calcula un hash con sal rotativa y lo compara con la lista de fugas con denuncia; la patente en claro no queda en el registro del vehículo.',
 objetivos:[
  {q:'Cuántos autos entran y a qué hora',como:'Línea «entrada» dibujada en el acceso: cada vehículo que la cruza hacia la playa suma uno, una sola vez por track. Se cuenta por hora y por día.',estado:'medido',conf:'alta'},
  {q:'Cuánto tiempo se queda cada auto en la estación',como:'Entra y sale por esta misma cámara, que ve toda la playa de frente: tiempo entre el cruce de «entrada» hacia adentro y hacia afuera del mismo track. Si el track se corta, el auto queda fuera de la cuenta; no se completa con promedios.',estado:'medido',conf:'media'},
  {q:'A dónde va adentro: la playa o fuera de ella',como:'Zona «playa» sobre los surtidores: suma los segundos del punto de apoyo del vehículo (el centro del borde de abajo) dentro de la zona. El resto de la visita es fuera de la playa.',estado:'medido',conf:'alta'},
  {q:'Si la patente está en la lista de fugas con denuncia',como:`Solo a los que cruzan «entrada»: con confianza de ${pcu(SEC_UMBRAL)} o más se calcula un hash con sal rotativa y se compara con la lista. La patente en claro no se guarda en el registro del vehículo ni se cruza con marca, modelo u hora; solo queda en el evento cuando coincide con la lista, para que una persona lo revise (ver Seguridad). De 21 a 6 h, sin infrarrojo, la lectura queda NO OBSERVABLE. Requiere un lector dedicado en C1 validado en el piloto; la tasa de legibles de Seguridad es de ejemplo.`,estado:'piloto',conf:'sin dato hasta validar'},
  {q:'Qué tipo de vehículo es',como:'Clase del detector al cruzar la línea; el VLM separa camioneta o SUV y utilitario una sola vez por track. «Sin clasificar» se informa y no se reparte entre los demás. La precisión se valida a mano en el piloto (200 cruces).',estado:'estimado',conf:'media'},
  {q:'Qué marca y modelo es',como:'El VLM responde marca y modelo con su confianza sobre el mejor cuadro de la visita; por debajo de 0,5 queda «sin clasificar». Se publica sumado por semana, sin patente ni hora.',estado:'estimado',conf:'media'},
  {q:'Qué antigüedad tiene, por rango de años',como:'El mismo VLM estima un rango de 5 años de modelo (por ejemplo, 2015-2019), nunca el año exacto (la precisión por año se mide en el piloto). Se publica por semana en los rangos de Calle y acceso; si no identificó el modelo, «sin dato».',estado:'estimado',conf:'baja'},
  {q:'Cuántos pasan por la calle sin entrar',como:'Línea «calle», vertical, frente al ingreso: cuenta los que pasan hacia la derecha y hacia la izquierda de la imagen. La captación del día la da C6, en Calle y acceso.',estado:'medido',conf:'alta'}],
 clip:(J,R)=>{const pos={},L=R.res&&R.res.lineas||{},E=L.entrada,Cl=L.calle,lado={entra:'hacia la derecha',sale:'hacia la izquierda'};
  R.f.forEach(([,obs])=>obs.forEach(([id,,x1,,x2,y2])=>{const a=[(x1+x2)/2,y2];(pos[id]??={a0:a}).a1=a}));
  const k={in:0,out:0,calle:0,quieto:0,otro:0};
  const rows=J.map(j=>{const ent=j.cr.filter(c=>c.l==='entrada'),cal=j.cr.filter(c=>c.l==='calle'),e=ent.find(c=>c.sentido==='entra'),s=ent.find(c=>c.sentido==='sale'),p=pos[j.id],mv=p?Math.hypot(p.a1[0]-p.a0[0],p.a1[1]-p.a0[1]):0,pl=j.zt.playa||0;
   let q;
   if(e&&s&&s.t>e.t){q=`<b>Entró y salió</b>: ${num(s.t-e.t,1)} s en la estación`;k.in++}
   else if(e){q=`<b>Entró a la estación</b> a los ${num(e.t,1)} s${j.hastaFinal?`; seguía adentro al terminar el clip: la estadía queda sin dato`:''}`;k.in++}
   else if(s){q=`<b>Salió de la estación</b> a los ${num(s.t,1)} s`;k.out++}
   else if(cal.length){q=`<b>Pasó por la calle</b> ${lado[cal[0].sentido]||cal[0].sentido}, sin entrar`;k.calle++}
   else if(mv<.03){q=`Quieto mientras se lo vio, sin cruzar ninguna línea`;k.quieto++}
   else{q='Se movió sin cruzar ninguna línea';k.otro++}
   return[`<b>${j.id}</b>`,`${num(j.t0,1)} a ${num(j.t1,1)} s`,q,pl?`<b>${num(pl,1)} s</b>${j.hastaFinal?'<div class="sub">seguía al terminar el clip</div>':''}`:'<span class="muted">no entró</span>',
    '<span class="muted">sin dato</span>',e||s?'<span class="muted">sin dato</span>':'<span class="muted">no se lee: no entró</span>']});
  const mov=k.in+k.out+k.calle+k.otro,parts=[k.in?`<b>${k.in} ${k.in===1?'entró':'entraron'}</b> a la estación`:'nadie entró a la estación',k.out?`${k.out} ${k.out===1?'salió':'salieron'}`:'',k.calle?`<b>${k.calle} ${k.calle===1?'pasó':'pasaron'} por la calle</b>`:'',k.quieto?`${k.quieto} ${k.quieto===1?'quedó quieto':'quedaron quietos'} sin cruzar líneas`:''].filter(Boolean);
  const igual=(!E||(E.entra===cdC1_cuenta(J,'entrada','entra')&&E.sale===cdC1_cuenta(J,'entrada','sale')))&&(!Cl||(Cl.entra===cdC1_cuenta(J,'calle','entra')&&Cl.sale===cdC1_cuenta(J,'calle','sale')));
  const cnt=E||Cl?` El contador del motor ${igual?'da lo mismo':`da distinto que esta lectura por track (por track: «entrada» ${cdC1_cuenta(J,'entrada','entra')} hacia adentro y ${cdC1_cuenta(J,'entrada','sale')} hacia afuera; «calle» ${cdC1_cuenta(J,'calle','entra')} hacia la derecha y ${cdC1_cuenta(J,'calle','sale')} hacia la izquierda)`}: «entrada» ${E?`${num(E.entra)} hacia adentro y ${num(E.sale)} hacia afuera`:'sin dato'}; «calle» ${Cl?`${num(Cl.entra)} hacia la derecha y ${num(Cl.sale)} hacia la izquierda`:'sin dato'}.`:'';
  return{cols:['Track','En cuadro','Qué hizo','En la playa','Tipo, marca y años','Patente'],rows,
   resumen:`${parts.slice(0,-1).join(', ')}${parts.length>1?' y ':''}${parts[parts.length-1]}.${cnt} Con ${cdC1_pl(mov,'vehículo','vehículos')} en movimiento no se calcula captación: eso sale del día entero, en Calle y acceso.`,
   nota:'Tipo, marca, modelo y años: sin dato en este clip, porque el detector exportó solo «vehículo» y el modelo de atributos (VLM) no corrió en la demo. La patente, sin dato por lo mismo; en producción se lee solo a los que cruzan «entrada», se compara como hash con sal con la lista de fugas y la patente en claro no queda en el registro del vehículo, solo en el evento si coincide con la lista. A los que pasan por la calle no se les lee.'}},
 ayerTitulo:'Autos de ayer, uno por uno',

 // perfil por hora de ayer de los autos que entran (el mismo de Calle y acceso y de Personal)

 recos:A=>{const out=[],man=A.man?A.man.v:null,b=D.traffic.brands,ptxt=t=>t.p<.001?'p &lt; 0,001':'p = '+t.p.toFixed(3).replace('.',',');

/* ---------- C3 · Isla 2: cuánto tarda la atención en la isla 2 (surtidores 3 y 4) ----------
   Números de «ayer» iguales a Playa e islas: autos y espera de la isla 2 (D.playa.cells['2:dia'], fila «Día completo» del panel «Espera hasta ser atendido,
   por isla y por turno»), carga y cobro y salida (D.cv.fill y D.cv.out, panel «Tiempo en la isla por etapa»), carga del controlador y cobro
   (D.playa.carga y D.playa.cobro) y las reglas de C3 (D.cv.rules: celular y bidón). La manguera lenta es la de Mantenimiento (D.playa.hose).
   Clip real: media/deteccion.js (cams.C3), zona «isla2» de vision/zonas.demo.json; el playero se reconoce por el color del uniforme. */
const cdC3_ESPERA=90;   // s: umbral de la regla «sin_atender» de C3 (vision/zonas.demo.json) y de «Auto esperando sin atención más de 90 s»
const cdC3_CEL_S=3;     // s: la regla «celular_carga» pide ver el celular junto al auto al menos 3 s seguidos (vision/zonas.demo.json)
const cdC3_BID_S=5;     // s: la regla «bidon» pide ver el bidón 5 s seguidos (vision/zonas.demo.json)
const cdC3_QUIETO=.01;  // fracción de la imagen: un track que en todo el clip se mueve menos que esto está quieto
// objetos fijos del cuadro de C3, marcados a mano sobre este clip de la demo (punto de apoyo, coordenadas normalizadas); NO están en
// vision/zonas.demo.json y el motor no los usa. Un track quieto encima de uno es una falsa detección probable según esta revisión de la demo.
const cdC3_FIJOS=[{n:'el poste rojo de protección del surtidor',a:[.638,.512],r:.03},{n:'los arbustos del fondo',a:[.143,.2],r:.04}];
const cdC3_p=t=>t.p<.001?'p &lt; 0,001':'p = '+t.p.toFixed(3).replace('.',',');
const cdC3_pl=(n,a,b)=>`${num(n)} ${Math.round(n)===1?a:b}`;
// reparto entero de n casos según pesos (mayores restos) y mezcla determinista: la muestra respeta las proporciones del día
const cdC3_quota=(w,n)=>{const t=sum(w)||1,raw=w.map(x=>x/t*n),q=raw.map(Math.floor);raw.map((x,i)=>[x-q[i],i]).sort((x,y)=>y[0]-x[0]).slice(0,n-sum(q)).forEach(([,i])=>q[i]++);return q};
const cdC3_rep=(q,vals)=>q.flatMap((k,i)=>Array(k).fill(vals[i]));
const cdC3_shuf=(g,a)=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(g.u()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
// autos de la isla 2 que vio la C3 ayer, en orden de llegada (las horas NO OBSERVABLE no entran: ni cero ni promedio relleno)
const cdC3_i2=()=>D.playa.cars.filter(c=>c.isla===2&&c.obs);
const cdC3_cell=()=>D.playa.cells['2:dia'];
const cdC3_n90=()=>cdC3_i2().filter(c=>c.wait>cdC3_ESPERA).length;
const cdC3_rule=id=>D.cv.rules.find(r=>r.id===id)||{det:0,ok:0,fp:0};
// margen por litro ponderado por volumen: la misma fórmula que Calle y acceso
const cdC3_mgL=()=>sum(PRODS.map(p=>S.P.p[p.id].vol*(S.P.p[p.id].precio-S.P.p[p.id].costo)))/sum(PRODS.map(p=>S.P.p[p.id].vol));
// la manguera lenta de Playa e islas y Mantenimiento, solo si está en esta isla (surtidores 3 y 4)
const cdC3_hose=()=>{const h=D.playa.hose,x=h&&D.hoses.find(y=>y.id===h.id);return x&&(h.s===3||h.s===4)?{...h,pid:x.pid}:null};
// en qué parte de los autos alguien entra a la tienda: la misma cuenta que el panel «De la playa a la caja» de Tienda (funnelHtml)
const cdC3_tienda=()=>D.store&&D.cv.cars?sum(D.store.hrs.map(x=>x.ppl-x.walk))/D.cv.cars:null;
// isla 2 a una hora: esperas de ayer de los autos observados
const cdC3_hora=h=>{const w=cdC3_i2().filter(c=>c.h===h).map(c=>c.wait);return{n:w.length,med:w.length>=5?playaQ(w,.5):null,p90:w.length>=5?playaQ(w,.9):null,mean:w.length?cdAvg(w):null,m90:w.filter(x=>x>cdC3_ESPERA).length}};

/* el clip real: punto de apoyo al empezar y al terminar, extremos del recorrido, cuándo entra a la isla y la última caja de cada track */
function cdC3_pts(R){const z=(R.zonas||[]).find(z=>z.id==='isla2'),o={};
 R.f.forEach(([t,obs])=>obs.forEach(([id,,x1,y1,x2,y2])=>{const a=[(x1+x2)/2,y2],e=o[id]??={a0:a,mn:a.slice(),mx:a.slice(),tin:null};
  e.a1=a;e.t1=t;e.box=[x1,y1,x2,y2];e.mn=[Math.min(e.mn[0],a[0]),Math.min(e.mn[1],a[1])];e.mx=[Math.max(e.mx[0],a[0]),Math.max(e.mx[1],a[1])];
  if(z&&e.tin==null&&cdIn(a,z.poligono))e.tin=t}));
 Object.values(o).forEach(e=>{e.mov=Math.hypot(e.mx[0]-e.mn[0],e.mx[1]-e.mn[1])});return o}
/* caja de un track en el primer cuadro posterior a t (para saber quién pasó delante de quién) */
const cdC3_boxAfter=(R,id,t)=>{for(const[tt,obs]of R.f){if(tt<=t)continue;const o=obs.find(x=>x[0]===id);if(o)return o.slice(2)}return null};

function cdC3_clip(J,R){const P=cdC3_pts(R),rg=(R.res&&R.res.reglas)||{},sa=rg.sin_atender||{},cel=rg.celular_carga||{},bid=rg.bidon||{};
 const col=(window.GOTA_DET&&window.GOTA_DET.uniforme&&window.GOTA_DET.uniforme.colores)||[],uni=col.length?` (${col.join(' y ')})`:'';
 const fijo=j=>{const e=P[j.id];return e&&e.mov<cdC3_QUIETO?cdC3_FIJOS.find(f=>Math.hypot(e.a0[0]-f.a[0],e.a0[1]-f.a[1])<f.r)||null:null};
 const play=J.filter(j=>j.k==='a'&&P[j.id]&&P[j.id].tin!=null).sort((a,b)=>P[a.id].tin-P[b.id].tin);

 // espera de cada auto: como el motor (metrics.esperas): desde que entra a la isla hasta que entra a la isla el primer playero que coincide con él

/* ayer, auto por auto (ejemplo): N autos de la isla 2 repartidos a lo largo del día, con la hora y la espera que tienen en Playa e islas (D.playa.cars).
   Surtidor según PUMP_W (3 y 4), producto según los despachos del día (D.playa.prods), carga del controlador (la manguera lenta, si es de esta isla),
   cobro y salida de los promedios del día (D.playa.cobro, D.cv.hrs.out). Celular, bidón y tienda con las proporciones de ayer. Determinista. */
function cdC3_rows(){const g=RNG(9310),P=D.playa,cv=D.cv,A2=cdC3_i2(),n=A2.length,N=Math.min(13,n);if(!N)return[];
 const off=.2+.6*g.u(),ks=[...A2.keys()],lar=ks.filter(k=>A2[k].wait>cdC3_ESPERA),cor=ks.filter(k=>A2[k].wait<=cdC3_ESPERA),nL=Math.min(lar.length,Math.round(N*lar.length/n));
 // muestra estratificada: tantos autos de más de 1:30 como la proporción del día, el resto parejo a lo largo del día
 const pick=(a,m)=>[...Array(m)].map((_,i)=>a[Math.min(a.length-1,Math.floor((i+off)*a.length/m))]),idx=[...pick(lar,nL),...pick(cor,N-nL)].sort((x,y)=>x-y);
 const sur=cdC3_shuf(g,cdC3_rep(cdC3_quota([PUMP_W[2],PUMP_W[3]],N),[3,4])),pr=cdC3_shuf(g,cdC3_rep(cdC3_quota(P.prods.map(p=>p.desp),N),P.prods));
 const tr=cdC3_tienda(),nCel=Math.round(N*cdC3_rule('celular').det/n),nBid=Math.round(N*cdC3_rule('bidon').det/n),nTi=tr==null?0:Math.round(N*tr);
 const ord=cdC3_shuf(g,[...Array(N).keys()]),cel=new Set(ord.slice(0,nCel)),bid=new Set(ord.slice(nCel,nCel+nBid)),ti=new Set(cdC3_shuf(g,[...Array(N).keys()]).slice(0,nTi)),hose=cdC3_hose();
 return idx.map((k,i)=>{const c=A2[k],same=A2.filter(x=>x.h===c.h),m=Math.min(59,Math.floor((same.indexOf(c)+g.u())/same.length*60)),p=pr[i],s=sur[i];
  const lenta=!!hose&&p.id===hose.pid&&s===hose.s,base=hose&&p.id===hose.pid?(lenta?hose.t:hose.tRef):p.carga,cvh=cv.hrs.find(x=>x.h===c.h);
  return{id:'v'+(k+1),h:c.h,m,wait:c.wait,s,p,lenta,carga:base*Math.exp(.12*g.n()),cobro:P.cobro*Math.exp(.3*g.n()),out:(cvh?cvh.out:cv.out)*(.85+.3*g.u()),cel:cel.has(i),bid:bid.has(i),ti:tr==null?null:ti.has(i)}})}

 const h3=(cv.health||[]).find(x=>x[0]==='C3'),noobs=h3&&h3[1]<1?h3[2].charAt(0).toLowerCase()+h3[2].slice(1):null;
 const nC=rows.filter(r=>r.cel).length,nB=rows.filter(r=>r.bid).length,nT=rows.filter(r=>r.ti).length,nL=rows.filter(r=>r.wait>cdC3_ESPERA).length;
 return{cols:['Auto · llegada','Esperó al playero','Carga · controlador','Cobro','Salida','En la isla','Durante la carga','¿Fue a la tienda?'],minW:980,
  rows:rows.map(r=>[`<b>${r.id}</b><div class="sub">${r.h}:${pad(r.m)} · surtidor ${r.s}</div>`,
   r.wait>cdC3_ESPERA?`<b class="badc">${mmss(r.wait)}</b><div class="sub">más de 1:30: aviso</div>`:`<b>${mmss(r.wait)}</b>`,
   `${mmss(r.carga)}<div class="sub">${r.p.n}${r.lenta?` · manguera ${hose.id}, lenta`:''}</div>`,mmss(r.cobro),mmss(r.out),`<b>${mmss(r.wait+r.carga+r.cobro+r.out)}</b>`,
   r.cel?pill('p-warn','celular junto al auto: aviso'):r.bid?pill('p-warn','bidón: aviso'):'<span class="muted">nada para avisar</span>',
   r.ti==null?'<span class="muted">sin dato</span>':r.ti?pill('p-info','sí · según Tienda'):'<span class="muted">no</span>']),
  resumen:`Ayer la isla 2 atendió <b>${num(c.n)} autos</b> con la C3 mirando${noobs?` (${noobs}: esa hora queda sin dato)`:''}. Esperaron al playero <b>${mmss(c.med)}</b> de mediana y uno de cada diez, más de ${mmss(c.p90)}; más de 1:30, <b>${cdC3_pl(n90,'auto','autos')}</b> (${pcu(n90/c.n,1)}). En toda la playa la espera promedio fue ${mmss(cv.wait)}; la carga y el cobro, <b>${mmss(cv.fill)}</b> por auto (${mmss(P.carga)} de carga según el controlador y ${mmss(P.cobro)} de cobro) y la salida, ${mmss(cv.out)}. Avisos de la C3: celular durante la carga, <b>${num(ce.det)}</b> (${cdC3_pl(ce.ok,'confirmado','confirmados')} por una persona); bidón, ${num(bi.det)} (${cdC3_pl(bi.ok,'confirmado','confirmados')}).${tr!=null?` Según el panel «De la playa a la caja» de Tienda, en el ${pcu(tr)} de los autos alguien entra a la tienda (esta cámara todavía no lo mide).`:''}`,
  nota:`Muestra de ${rows.length} autos de la isla 2 repartidos a lo largo del día: la hora y la espera de cada uno son las de los datos de ayer de Playa e islas (${nL} de ${rows.length} pasan de 1:30). La carga sale del controlador según el producto${hose?`; la manguera ${hose.id} (${hose.prod}, surtidor ${hose.s}) carga más lento y ya tiene orden de trabajo en Mantenimiento`:''}. Cobro y salida, de los promedios del día. Celular, bidón y tienda, con las proporciones de ayer: ${nC} con celular, ${nB} con bidón, ${nT} a la tienda. «Fue a la tienda» reparte la proporción del panel «De la playa a la caja» de Tienda: esta cámara todavía no tiene dibujada la línea hacia la tienda y no ve la puerta; no se la sigue con otra cámara ni se mira su ticket.`}}

// avisos de celular por día (enteros): cdSerie con suba, y los 6 días anteriores a ayer reescalados (mayores restos) para que los últimos 7
// sumen los avisos de 7 días de Seguridad (D.sec.week); los días previos se escalan igual para no inventar un salto. Sin ese dato, la serie tal cual.
function cdC3_celSerie(){const ay=cdC3_rule('celular').det,o=cdSerie({ayer:ay,seed:9304,motor:'autos',drift:.06,ruido:.05,min:0}),y=o.y,n=y.length;
 const w=D.sec&&D.sec.week&&D.sec.week.find(x=>x.id==='celular'),rest=w?w.avisos-ay:null;
 if(rest==null||rest<0)return{...o,y:y.map(Math.round)};
 const last6=y.slice(n-7,n-1),k=rest/(sum(last6)||1),q=cdC3_quota(last6.map(v=>v*k),rest);
 return{...o,y:y.map((v,i)=>i===n-1?ay:i>=n-7?q[i-(n-7)]:Math.max(0,Math.round(v*k)))}}

/* ---------- ayer, auto por auto (ejemplo) ----------
   Muestra estratificada y declarada: autos atendidos repartidos por isla (cuota según el reparto de D.playa.cars observados) y, dentro de cada isla,
   a lo largo del día, con la hora, la isla y la espera que tienen en Playa e islas (solo horas con cámara), más TODOS los que se fueron sin cargar
   ayer (Math.round(D.cv.ab)), ubicados en las horas con más abandono (D.cv.hrs[].ab, sin la hora NO OBSERVABLE de C4). Surtidor según PUMP_W dentro
   de la isla; carga y cobro y salida de los promedios de esa hora (D.cv.hrs[].fill y .out); playeros a la vista y fila de esa hora, de D.playa.hrs.
   Ids de track con un solo contador por orden de llegada: atendidos (D.playa.cars, cronológico) y los que se fueron, intercalados por hora y minuto.
   Determinista (semilla 9400). */
function cdC4_rows(){const g=RNG(9400),cv=D.cv,no=cdC4_noobs(),A=D.playa.cars.filter(c=>c.obs&&!no.includes(c.h)),nAb=Math.round(cv.ab),NS=Math.max(0,Math.min(A.length,13-nAb));
 const nh=h=>Math.max(1,Math.round((cv.hrs.find(x=>x.h===h)||{cars:1}).cars));
 const AI=[1,2].map(i=>A.filter(c=>c.isla===i)),qi=cdC4_quota(AI.map(a=>a.length),NS),off=.15+.7*g.u();
 const pick=AI.flatMap((a,k)=>[...Array(qi[k])].map((_,i)=>a[Math.min(a.length-1,Math.floor((i+off)*a.length/qi[k]))])).sort((x,y)=>D.playa.cars.indexOf(x)-D.playa.cars.indexOf(y));
 const hs=cv.hrs.filter(x=>!no.includes(x.h)),qa=cdC4_quota(hs.map(x=>x.ab),nAb),abH=hs.flatMap((x,i)=>Array(qa[i]).fill(x.h));
 const mn=(h,k)=>Math.min(59,Math.floor((k+g.u())*60/nh(h)));
 const at=pick.map(c=>{const w=c.isla===1?[PUMP_W[0],PUMP_W[1]]:[PUMP_W[2],PUMP_W[3]],s=(c.isla===1?1:3)+(g.u()<w[0]/(w[0]+w[1])?0:1),x=cv.hrs.find(y=>y.h===c.h);
  const same=A.filter(y=>y.h===c.h);return{c,h:c.h,m:mn(c.h,same.indexOf(c)),isla:c.isla,s,wait:c.wait,fill:x.fill*Math.exp(.1*g.n()),out:x.out*(.85+.3*g.u()),ab:false}});
 const ab=abH.map(h=>{const x=cv.hrs.find(y=>y.h===h);return{h,m:Math.floor(g.u()*60),isla:null,acc:x.wait*(1.1+.7*g.u()),ab:true}});
 // contador común de tracks: cada auto del día (con la C4 mirando) en orden de llegada; los que no están en la muestra, en el centro de su lugar dentro de la hora
 const tm=new Map(at.map(r=>[r.c,r.h*60+r.m])),k={},ev=D.playa.cars.filter(c=>!no.includes(c.h)).map(c=>{const i=k[c.h]=(k[c.h]??-1)+1;return{o:c,t:tm.has(c)?tm.get(c):c.h*60+Math.min(59.5,(i+.5)*60/nh(c.h))}});
 ab.forEach(r=>ev.push({o:r,t:r.h*60+r.m}));ev.sort((x,y)=>x.t-y.t);const id=new Map(ev.map((e,i)=>[e.o,i+1]));
 return at.map(r=>({...r,n:id.get(r.c)})).concat(ab.map(r=>({...r,n:id.get(r)}))).sort((x,y)=>x.n-y.n).map(r=>({...r,id:'v'+r.n}))}
function cdC4_ayer(){const cv=D.cv,P=D.playa,rows=cdC4_rows(),nAb=Math.round(cv.ab),ent=D.street.enter,r=cdC4_rule('abandono'),c1=P.cells['1:dia'],c2=P.cells['2:dia'],oc=cdC4_occ(),pk=cdC4_pico();
 const h4=(cv.health||[]).find(x=>x[0]==='C4'),no=cdC4_noobs(),fila=P.hrs.filter(x=>x.fila>15),nS=rows.filter(x=>!x.ab).length,i1=rows.filter(x=>x.isla===1).length;
 const hora=h=>{const x=P.hrs.find(y=>y.h===h);return x&&x.obs?`${num(x.vis,1)} de ${x.prog}<div class="sub">${x.fila?`fila ${x.fila} min · hasta ${cdC4_pl(x.qmax,'auto','autos')}`:'sin fila'}</div>`:'<span class="muted">sin dato (C4 no observable)</span>'};
 const ll=x=>`<b>${x.id}</b><div class="sub">${x.h}:${pad(x.m)}</div>`;
 return{cols:['Auto · llegada','Isla · surtidor','Esperó<br>al playero','Carga y cobro<br>· salida','Tiempo total<br>en la isla','Playeros a la vista<br>· fila en la playa','Resultado'],minW:900,
  rows:rows.map(x=>x.ab
   ?[ll(x),'<span class="muted">ninguna</span>','<span class="muted">no llegó a una isla</span>','<span class="muted">no cargó</span>','<span class="muted">no aplica</span>',hora(x.h),`${pill('p-bad','se fue sin cargar')}<div class="sub">estuvo <b class="badc">${mmss(x.acc)}</b> en la playa sin llegar a una isla</div>`]
   :[ll(x),`Isla ${x.isla}<div class="sub">surtidor ${x.s}${x.isla===2?' · espera medida por C3':''}</div>`,x.wait>90?`<b class="badc">${mmss(x.wait)}</b><div class="sub">más de 1:30: aviso</div>`:`<b>${mmss(x.wait)}</b>`,`${mmss(x.fill)}<div class="sub">salida ${mmss(x.out)}</div>`,`<b>${mmss(x.wait+x.fill+x.out)}</b>`,hora(x.h),pill('p-ok','cargó')]),
  resumen:`Ayer se atendieron <b>${num(cv.cars)} autos</b> y ${nAb?`${nAb===1?'otro <b>se fue':`otros <b>${num(nAb)} se fueron`} sin cargar</b> (${pcu(cv.ab/ent,1)} de los ${num(ent)} que entraron, como cuenta C1 en Calle y acceso)`:'ninguno se fue sin cargar'}: la regla dio ${num(r.det)} ${r.det===1?'aviso':'avisos'} y una persona confirmó ${num(r.ok)} (${cdC4_pl(r.fp,'falsa alarma','falsas alarmas')}). Tiempo total en la isla: <b>${mmss(cv.wait+cv.fill+cv.out)}</b> por auto (espera ${mmss(cv.wait)}, carga y cobro ${mmss(cv.fill)}, salida ${mmss(cv.out)}). La isla 1 (surtidores 1 y 2, cerca de la entrada) atendió ${num(c1.n)} autos observados con espera mediana de <b>${mmss(c1.med)}</b>; la isla 2, ${num(c2.n)} con ${mmss(c2.med)}. El surtidor más cargado fue el ${oc.s}: <b>${pcu(oc.v)} ocupado</b> de ${oc.h} a ${oc.h+1} h. ${fila.length?`Hubo fila en la playa ${hourRanges(fila.map(x=>x.h)).join(' y ')}: ${num(sum(fila.map(x=>x.fila)))} minutos en esas horas, como en Playa e islas (${num(P.filaMin)} contando también las esperas cortas del resto del día). `:''}En la hora de más autos (${pk.h} a ${pk.h+1} h) se vieron ${num(pk.vis,1)} de los ${pk.prog} playeros de la grilla.${h4&&h4[1]<1?` La C4 estuvo observable el ${pcu(h4[1])} del día: ${h4[2].charAt(0).toLowerCase()+h4[2].slice(1)}, esa hora queda sin dato.`:''}`,
  nota:`Muestra de ${nS} autos atendidos repartidos por isla como en el día (${num(i1)} en la isla 1 y ${num(nS-i1)} en la isla 2) y a lo largo de las horas, con la hora, la isla y la espera que tienen en los datos de ayer de Playa e islas, más los ${cdC4_pl(nAb,'auto que se fue','autos que se fueron')} sin cargar (${nAb===1?'el único':'todos'} los de ayer), en las horas con más abandono: por eso en esta tabla los que se van pesan más que en el día (${pcu(cv.ab/ent,1)}). El número de track sigue el orden de llegada de todos los autos del día. Carga y cobro y salida, de los promedios de esa hora; playeros y fila, de la hora completa. Las horas en que la C4 no vio${no.length?` (${no.map(h=>`${h} a ${h+1} h`).join(', ')})`:''} no entran.`}}

    out.push({id:'tanques_merodeo',t:'Recalibrá la zona de tanques: el aviso de merodeo casi nunca se confirma',unaVez:true,
     porque:`Ayer la regla «persona más de 3 min en la zona de tanques» dio ${num(r.det)} avisos y una persona confirmó ${num(r.ok)}. ${q.win==='ayer'?'':`${w?`En 7 días hubo ${num(w.avisos)} avisos (${num(w.noche)} de madrugada): `:'En 7 días: '}<b>${num(q.ok)} confirmados y ${num(q.fp)} falsas alarmas</b>${w?`, y ${num(w.pend)} todavía sin revisar${w.med!=null?`; cada aviso de esta regla tarda ${num(w.med)} min de mediana en resolverse`:''}`:''}. `}La regla todavía no distingue al playero que mide los tanques ni al chofer de la descarga, que pasan ahí más de 3 min por trabajo. Un aviso que siempre es falso termina ignorado, y es el que importa de noche.`,
     impacto:null,
     conf:'alta',prio:'media',medir:'C4: avisos de merodeo y cuántos confirma una persona, dos semanas antes y dos después de excluir al personal con uniforme y los horarios de descarga del remito.'})}}
  return out.slice(0,4)}
};

/* ---------- C5 · Góndolas: qué hace cada cliente frente a las góndolas ----------
   Números de ayer: tabla GOND (pasan p, segundos s, toman t, compran c, por góndola) y D.store del módulo Tienda.
   Clip real: media/deteccion.js (cams.C5), zonas golosinas, pasillo, bebidas y caja de vision/zonas.demo.json. */
const cdC5_GOL='Golosinas y alfajores',cdC5_CAF='Café y panadería';
const cdC5_SH={'Golosinas y alfajores':'Golosinas','Café y panadería':'Café','Bebidas frías':'Bebidas','Snacks salados':'Snacks','Lácteos':'Lácteos','Limpieza del auto':'Limpieza del auto','Lubricantes':'Lubricantes','Revistas y regalos':'Revistas'};
const cdC5_n=n=>cdC5_SH[n]||n;
const cdC5_G=n=>GOND.find(x=>x.n===n);
const cdC5_PARADA=3;   // segundos: menos que esto en una zona no alcanza para decir que se detuvo
// ¿un track retoma a otro que el tracker perdió? Sí, si arranca a una distancia que se camina en el hueco: distancia ≤ cdC5_VEL × segundos de hueco + cdC5_SALTO.
// cdC5_VEL (fracción de la imagen por segundo): un poco más que lo que caminan los pies de los clientes medidos en este clip (p3 y p4: 0,06 a 0,07 por segundo).
// cdC5_SALTO: lo que salta el punto de apoyo cuando la góndola tapa los pies y la caja de la detección cambia de alto.
const cdC5_VEL=.08,cdC5_SALTO=.03;
const cdC5_GYF=.9;     // supuesto de la muestra de ayer: góndolas + fila ocupan como mucho el 90 % de la permanencia puerta a puerta; el resto es caminar y pagar
const cdC5_MAS=.1;     // escenario de la regla «mover»: cuántos clientes más de cada uno pasan frente a la góndola movida
const cdC5_p=t=>t.p<.001?'p &lt; 0,001':'p = '+t.p.toFixed(3).replace('.',',');
const cdC5_y=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' y '+a[a.length-1];

/* pies (centro del borde de abajo, como el motor) al empezar y al terminar cada track del clip */
function cdC5_ends(R){const e={};R.f.forEach(([t,obs])=>obs.forEach(([id,,x1,,x2,y2])=>{const a=[(x1+x2)/2,y2],o=e[id]??={t0:t,a0:a};o.t1=t;o.a1=a}));return e}

/* el clip real: por track, segundos por zona, si llegó a la caja; lo que tomó no lo mide el motor todavía */
function cdC5_clip(J,R){const zn=z=>DET_Z[z]||z,E=cdC5_ends(R),pp=J.filter(j=>j.k==='p');
 // en orden de aparición, cada track retoma al track perdido MÁS RECIENTE que sea alcanzable caminando (y cada track se retoma una sola vez).
 // Contra el video: p1 → p3 → p5 es el cliente que va de la heladera a la caja y p2 → p4 el del fondo, junto a las heladeras.
 const PV={},usado=new Set(),dd=(a,b)=>Math.hypot(E[a.id].a1[0]-E[b.id].a0[0],E[a.id].a1[1]-E[b.id].a0[1]);
 pp.forEach(j=>{if(!E[j.id])return;const c=pp.filter(a=>a!==j&&E[a.id]&&!usado.has(a.id)&&E[a.id].t1<E[j.id].t0&&dd(a,j)<=cdC5_VEL*(E[j.id].t0-E[a.id].t1)+cdC5_SALTO).sort((x,y)=>E[y.id].t1-E[x.id].t1)[0];
  if(c){PV[j.id]=c;usado.add(c.id)}});
 const ult=a=>{const z=a.seq[a.seq.length-1];return z?zn(z):'fuera de las zonas'};
 const mismo=p=>j=>`Puede ser <b>${p.id}</b> retomado: terminó en ${ult(p)} ${num(j.t0-E[p.id].t1,1)} s antes, a una distancia que se camina en ese tiempo: probablemente la misma persona, que el tracker perdió y siguió con otro número.`;
 const rows=pp.map(j=>{const zs=j.seq.filter((z,i,a)=>a.indexOf(z)===i),caja=j.zt.caja,p=PV[j.id],tot=sum(Object.values(j.zt));
  const lect=caja?`Estuvo en la zona de caja${j.desdeInicio||j.seq[0]==='caja'?' (ya aparece ahí)':''}${j.hastaFinal?' y seguía en cuadro al terminar el clip':''}.${p?' '+mismo(p)(j):''} Si pagó lo dice el POS por franja, no este track.`
   :p?mismo(p)(j)
   :j.dur<cdC5_PARADA?`Track corto (${num(j.dur,1)} s): no alcanza para decir si se detuvo.`
   :`Se detuvo ${num(tot,1)} s en ${cdC5_y(zs.map(zn))}.`;
  return[`<b>${j.id}</b><div class="sub">${num(j.t0,1)} a ${num(j.t1,1)} s</div>`,
   zs.length?zs.map(z=>`${zn(z)} ${num(j.zt[z]||0,1)} s`).join(' · '):'<span class="muted">fuera de las zonas</span>',
   caja?`<b>Sí</b> · ${num(caja,1)} s en la zona`:'No, en este clip',
   '<span class="muted">sin dato</span>',lect]});
 const Z=(R.zonas||[]).map(z=>z.id),en=z=>pp.filter(j=>j.seq.includes(z)),vac=Z.filter(z=>!en(z).length),con=Z.filter(z=>en(z).length);
 const durs=pp.map(j=>j.dur),golVacia=Z.includes('golosinas')&&!en('golosinas').length,nU=pp.filter(j=>PV[j.id]).length;
 return{cols:['Track','Segundos por zona','¿Pasó por la zona de caja?','Tomó o devolvió','Qué se puede decir'],rows,
  resumen:`${con.map(z=>{const t=en(z);return `<b>${zn(z)}</b>: ${t.length} ${t.length===1?'track':'tracks'}, ${num(sum(t.map(j=>j.zt[z]||0)),1)} s entre todos`}).join(' · ')}.${vac.length?` Sin detecciones: ${cdC5_y(vac.map(z=>zn(z)+(z==='golosinas'&&golVacia?' (punto ciego, ver nota)':'')))}.`:''}${nU?` ${nU} de los ${pp.length} tracks ${nU===1?'retoma':'retoman'} a otro que el tracker perdió: serían unas ${pp.length-nU} personas${golVacia?', más el cliente que tapa la góndola de golosinas':''}.`:''}`,
  nota:`${golVacia?'Golosinas figura sin visitas, pero en el pasillo de la izquierda hay un cliente: la góndola lo tapa casi entero y el motor no lo detecta. Es un punto ciego, no «nadie»: se corrige subiendo la cámara o sumando una al fondo del pasillo. ':''}«Tomó o devolvió»: sin dato, el motor todavía no detecta la mano tomando un producto (pose + VLM, en piloto).${pp.length?` En este clip los tracks duran de ${num(Math.min(...durs),1)} a ${num(Math.max(...durs),1)} s: el clip es corto y las góndolas cortan tracks; en la estación de ejemplo, el ${pcu(D.store.dwell.full)} de los recorridos llega completo.`:''}`}}

/* ayer, cliente por cliente (ejemplo): muestra armada con las proporciones de ayer (GOND y D.store), determinista */
function cdC5_ayer(){const s=D.store,dw=s.dwell,g=RNG(9510),N=13,vis=s.ppl-s.wc,hw=s.hrs.map(x=>x.ppl-x.wc),tot=sum(hw),G=cdC5_G(cdC5_GOL),gl=s.gain.find(x=>x.n===cdC5_GOL);
 // se van sin comprar: misma proporción que ayer = entran y no compran ÷ (entran − solo al baño)
 const nNo=Math.min(N-1,Math.max(1,Math.round(N*s.look/vis)));
 // horarios: N puntos repartidos según el perfil por hora de ayer (una visita cada tot/N personas)
 const C=[...Array(N)].map((_,i)=>{let u=(i+.15+.7*g.u())/N*tot,k=0;while(k<hw.length-1&&u>hw[k]){u-=hw[k];k++}const fr=Math.min(.99,Math.max(0,u/hw[k])),x=s.hrs[k];
  return{i,h:x.h,m:Math.floor(fr*60),cum:sum(hw.slice(0,k))+fr*hw[k],cv:x.ppl?x.tk/x.ppl:1,sec:{},lleva:[],dev:[],res:'compra'}});
 // quienes se van sin comprar caen en las horas con menos tickets por persona (como en el módulo Tienda); se alternan «devolvió todo» y «solo miró»
 C.slice().sort((a,b)=>a.cv-b.cv||a.i-b.i).slice(0,nNo).forEach((c,k)=>{c.res=k%2?'miro':'devolvio'});
 const pick=(arr,n,sc)=>arr.map(c=>({c,r:sc(c)+g.u()*.5})).sort((a,b)=>a.r-b.r).slice(0,Math.max(0,n)).map(x=>x.c);
 // por góndola: pasan round(N·p), compran round(pasan·c), toman round(pasan·t); toman − compran = lo devuelven a la góndola
 GOND.forEach(X=>{const kp=Math.min(N,Math.round(N*X.p)),kt=Math.min(kp,Math.round(kp*X.t)),kb=Math.min(kt,Math.round(kp*X.c));
  const buy=pick(C.filter(c=>c.res==='compra'),kb,c=>c.lleva.length);buy.forEach(c=>c.lleva.push(X.n));
  const ret=pick(C.filter(c=>c.res!=='miro'&&!buy.includes(c)),kt-kb,c=>c.res==='devolvio'?(c.dev.length?2:-10):0);ret.forEach(c=>c.dev.push(X.n));
  const tk=buy.concat(ret),pas=tk.concat(pick(C.filter(c=>!tk.includes(c)),kp-tk.length,c=>c.res==='miro'?-.25:0));
  // segundos frente a la góndola: quien toma y devuelve se queda más; se reescala para que el promedio sea el de GOND (X.s)
  const raw=pas.map(c=>X.s*Math.exp(.35*g.n())*(c.dev.includes(X.n)?1.6:c.lleva.includes(X.n)?1.2:.7)),f=raw.length?X.s*raw.length/sum(raw):1;
  pas.forEach((c,k)=>{c.sec[X.n]=Math.max(3,Math.round(raw[k]*f))})});
 // fila de la caja: la curva de espera del módulo Tienda (tiendaQueue, minutos) a esa hora
 const B=C.filter(c=>c.res==='compra'),gs=c=>sum(Object.values(c.sec));B.forEach(c=>{c.fila=tiendaQueue(c.h+c.m/60)*60*(.75+.5*g.u())});
 // y acotada a la permanencia puerta a puerta del módulo Tienda: góndolas + fila con mediana ≤ cdC5_GYF × D.store.dwell.buy (un solo factor para todas las filas,
 // así se mantiene la forma por hora) y nadie por encima de cdC5_GYF × D.store.dwell.p90. Se achica la fila, no los segundos frente a góndolas (que son los de GOND).
 const tB=cdC5_GYF*(dw.buy||Infinity),tP=cdC5_GYF*(dw.p90||Infinity),med=k=>{const a=B.map(c=>gs(c)+k*c.fila).sort((x,y)=>x-y),m=a.length>>1;return a.length%2?a[m]:(a[m-1]+a[m])/2};
 let kf=1;if(B.length&&med(1)>tB){let lo=0,hi=1;for(let it=0;it<30;it++){const mid=(lo+hi)/2;if(med(mid)>tB)hi=mid;else lo=mid}kf=lo}
 B.forEach(c=>{c.fila=Math.max(0,Math.min(c.fila*kf,tP-gs(c)))});
 let last=0;C.forEach(c=>{last=Math.max(last+1,Math.floor(c.cum)+1);c.id='p'+last});
 const L=a=>a.length?a.map(cdC5_n).join(' · '):'<span class="muted">nada</span>',RES={compra:['p-ok','compró'],devolvio:['p-warn','devolvió todo y se fue'],miro:['p-mute','solo miró y se fue']};
 // góndolas en el orden fijo de GOND (no es el orden en que caminó: eso lo da el recorrido del motor en producción)
 const rows=C.map(c=>{const ord=GOND.map(X=>X.n).filter(n=>c.sec[n]!=null),tg=sum(Object.values(c.sec)),tomo=ord.filter(n=>c.lleva.includes(n)||c.dev.includes(n));
  return[`<b>${c.id}</b><div class="sub">${c.h}:${pad(c.m)}</div>`,`${ord.map(n=>`${cdC5_n(n)} ${c.sec[n]} s`).join(' · ')}<div class="sub">${mmss(tg)} frente a góndolas</div>`,
   L(tomo),L(c.dev),c.res==='compra'?`${c.lleva.length?L(ord.filter(n=>c.lleva.includes(n))):'<span class="muted">nada de góndola</span>'}<div class="sub">${mmss(c.fila)} en la fila</div>`:'No',pill(...RES[c.res])]});
 const nb=C.filter(c=>c.res==='compra').length,nd=C.filter(c=>c.res==='devolvio').length,nm=N-nb-nd,gt=C.filter(c=>c.lleva.includes(cdC5_GOL)||c.dev.includes(cdC5_GOL)).length,gr=C.filter(c=>c.dev.includes(cdC5_GOL)).length;
 return{cols:['Cliente','Góndolas · segundos frente a cada una','Tomó','Devolvió a la góndola','Llevó a la caja','Resultado'],rows,minW:900,
  resumen:`Ayer recorrieron las góndolas unas <b>${num(vis)} personas</b>: las entradas por la puerta (${num(s.ppl)}) sin las que fueron solo al baño (unas ${num(s.wc)}). <b>Golosinas</b>: pasa el ${pcu(G.p)}, se detienen ${num(G.s)} s, toma un producto el ${pcu(G.t)} y compra el ${pcu(G.c)}: de cada 100 que toman una golosina, <b>${num(100-gl.r*100)} la devuelven</b>. Se fueron sin comprar unas <b>${num(s.look)}</b> (${pcu(s.look/s.ppl)} de las entradas).`,
  nota:`Muestra de ${N} recorridos con esas proporciones: ${nb} compraron, ${nd} ${nd===1?'devolvió':'devolvieron'} todo y se ${nd===1?'fue':'fueron'}, ${nm} solo ${nm===1?'miró':'miraron'}; de ${gt} que tomaron golosinas, ${gr} las ${gr===1?'devolvió':'devolvieron'}. «Tomó» y «devolvió» son del modelo en piloto (pose + VLM, confianza media) y dicen la categoría de la góndola, no la marca. «Compró» es estimado: llegó a la caja y se quedó lo que dura un cobro; nunca se mira su ticket. La fila sigue la espera por hora del módulo Tienda, acotada para que góndolas más fila ocupen como mucho el ${pcu(cdC5_GYF)} de la permanencia puerta a puerta del módulo (mediana de quien compra ${mmss(dw.buy)}; p90 de todas las visitas ${mmss(dw.p90)}): el resto es caminar y pagar.`}}

 clip:cdC5_clip,

 series:()=>{const s=D.store,G=cdC5_G(cdC5_GOL),gl=s.gain.find(x=>x.n===cdC5_GOL);return[

  {id:'clientes',n:'Clientes frente a las góndolas',fmt:'num',mejor:'sube',...cdSerie({ayer:s.ppl-s.wc,seed:9500,motor:'autos',drift:0,ruido:.05})},

 // perfil por hora de ayer: entradas − solo al baño (D.store.hrs)
 horas:()=>({n:'Clientes frente a las góndolas',u:'clientes',hrs:D.store.hrs.map(x=>[x.h,x.ppl-x.wc])}),
 recos:A=>{const s=D.store,G=cdC5_G(cdC5_GOL),Cf=cdC5_G(cdC5_CAF),gl=s.gain.find(x=>x.n===cdC5_GOL),cg=A.S.conv_gol,sg=A.S.seg_gol,sc=A.S.sin_compra,out=[];
  const baja=cg&&cg.tr.ok&&cg.tr.dir==='baja',pk=A.pk,rc=Cf&&Cf.t?Cf.c/Cf.t:null;

  if(gl&&gl.mes>0&&(baja||gl.r<s.rbar*.7)){const tom=s.ppl*G.p*G.t,sem=baja?-cg.tr.sem:0,perd=tom*sem*gl.tkc*TIENDA_MG*30;
   out.push({id:'golosinas',t:`Poné el precio de las golosinas a la vista y llená la góndola${pk?` antes de las ${pk[0]} h`:''}`,

 recos:A=>{const out=[],st=D.street,T=D.traffic,lo=cdC6_lo(),hi=lo==='sur'?'norte':'sur',Sl=CALLE_S.find(s=>s.id===lo),Lc=T.sent[lo],Hc=T.sent[hi],mgL=cdC6_mgL();

  const fl=cdC6_flojas();

   const cvh=D.cv.hrs.filter(x=>hs.includes(x.h)),wmax=cvh.length?Math.max(...cvh.map(x=>x.wait)):null,pk=A.pk&&hs.includes(A.pk[0]);

   // solo las bajas de la competencia pueden llevarse autos; una suba se informa como lo que es: no explica la caída
   const cTxt=c=>`${c.name} (a ${num(c.dist,1)} km) ${c.chg.d>0?'subió':'bajó'} ${ars(Math.abs(c.chg.d))} la ${PR[c.chg.pid].short.toLowerCase()} hace ${fDur(c.upd)}`;
   const pre=caro.length?`Hoy estás por encima del promedio de la zona (ponderado por distancia) en ${caro.map(x=>`${x.p.short} (${arsS(x.m.p0-x.m.ref)})`).join(', ')}.`:`Hoy tus ${num(PRODS.length)} precios están en o por debajo del promedio de la zona (ponderado por distancia): la causa no parece ser el precio.`;

   out.push({id:'precios',t:porPrecio?'Mirá los precios de la competencia: la captación viene cayendo':'La captación viene cayendo: descartá el precio y la cámara antes de actuar',

    conf:'media',prio:'alta',
    medir:porPrecio?'C6 sigue la captación diaria por sentido: si se ajusta un precio, se comparan las 2 semanas siguientes con las 2 anteriores y la tendencia tiene que dejar de bajar.':'C6 sigue la captación diaria por sentido: con las líneas redibujadas, se comparan las 2 semanas siguientes con las 2 anteriores; si la tendencia sigue bajando con la cámara en su lugar, la causa está fuera del precio y de la cámara.'})}
  // 4. el motor estima que C6 se corrió (D.motor) → redibujar líneas y verificar una hora a mano antes de usar los números de esos días
  if(M&&M.moved){out.push({id:'recalibrar',t:'Redibujá las líneas de C6: la cámara se corrió',unaVez:true,

  const rk={alta:0,media:1,baja:2};return out.sort((x,y)=>rk[x.prio]-rk[y.prio])}
};

 const[i,n]=THEMES[theme],b=$('themeBtn');b.innerHTML=ic(i)+'<span class="hide-sm">'+n.replace('Tema ','').replace(/^./,c=>c.toUpperCase())+'</span>';b.title=n+' (clic para cambiar)';b.setAttribute('aria-label',n+'. Cambiar tema')}
function renderSide(){const cnt={};alerts().forEach(a=>{const c=cnt[a.mod]=cnt[a.mod]||{n:0,crit:0};c.n++;if(a.sev==='crit')c.crit++});
 const secs=[...new Set(VIEWS.map(v=>v.sec))];
 $('side').innerHTML=`<div class="brand"><div class="mark">${LOGO}</div><div><b>GOTA</b><small>Estaciones inteligentes</small></div></div><nav class="nav" aria-label="Módulos">${secs.map(s=>`<div class="sec">${s}</div>`+VIEWS.filter(v=>v.sec===s).map(v=>{const c=cnt[v.id];return `<button data-act="go" data-v="${v.id}" class="${S.view===v.id?'on':''}"${S.view===v.id?' aria-current="page"':''}>${ic(v.icon)}<span class="lbltxt">${v.name}</span>${c?`<span class="badge${c.crit?'':' soft'}" aria-label="${c.n} pendientes">${c.n}</span>`:''}</button>`}).join('')).join('')}</nav><div class="side-foot"><div class="proto">Demo con datos simulados. Ningún número corresponde a una estación real.</div></div>`}
let lastView=null;
function render(){const v=VIEW[S.view]||VIEW.inicio,el=$('view'),keep=lastView===v.id?el.scrollTop:0;renderSide();
 // en el teléfono el menú es una fila que se desliza: centra la pestaña activa sin mover la página
 if(innerWidth<=820){const b=document.querySelector('.nav button.on'),n=b&&b.parentNode;if(n)n.scrollLeft+=b.getBoundingClientRect().left-n.getBoundingClientRect().left-(n.clientWidth-b.offsetWidth)/2}
 $('eyebrow').textContent=S.P.station+' · datos simulados';$('pageTitle').textContent=v.title;el.innerHTML=V[v.id]();el.scrollTop=keep;lastView=v.id;if(v.id==='vision')startCams()}
function route(){const h=decodeURIComponent(location.hash.slice(1));S.view=VIEW[h]?h:'inicio';render();$('view').focus({preventScroll:true})}

 wetT:el=>{S.wetT=el.dataset.t;render()},
 calib:()=>{S.appr['mt:cal']=1;S.wo.unshift({t:`Calibrar la manguera ${topDrift()} (Diésel) con medida patrón de 20 L`,s:'Nueva',when:addD(TODAY,1)});log(`Calibración de la manguera ${topDrift()} agendada (faltante en T3)`);render();toast('Orden de trabajo creada para mañana.')},

 cause:el=>{const k=el.dataset.k,st=el.dataset.st,[sid,cid]=k.split(':'),sh=D.shifts.find(s=>s.id===sid),c=sh&&sh.causes.find(x=>x.id===cid);if(!c)return;S.appr[k]=st;log(`${sh.name} · ${c.t}: ${st==='ok'?'aprobada':st==='rev'?'enviada a revisión':'rechazada'}`);render()},

 claim:el=>{const d=findDoc(el.dataset.id);if(!d)return;S.claim=d.id;$('drawer').innerHTML=docDrawer(d);const t=$('claimTxt');if(t)t.focus()},
 copyClaim:()=>{const t=$('claimTxt');if(!t)return;const done=()=>toast('Texto copiado.'),fb=()=>{t.select();try{document.execCommand('copy');done()}catch(e){toast('Seleccioná el texto y copialo a mano.')}};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t.value).then(done,fb);else fb()},
 docOk:el=>{const d=findDoc(el.dataset.id);if(!d)return;const dif=d.estado==='dif';S.appr['doc:'+d.id]=dif?(S.claim===d.id?'claim':'rev'):'paid';log(`${d.tipo} ${d.num}: ${dif?'revisado':'aprobado para pago'}`);closeDrawer();render();toast(dif?'Marcado como revisado.':'Aprobado para pago.')},
